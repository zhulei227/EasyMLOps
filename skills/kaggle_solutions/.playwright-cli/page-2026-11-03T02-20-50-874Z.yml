              - paragraph [ref=f12e40]: VinBigData Chest X-ray Abnormalities Detection
            - paragraph [ref=f12e41]: Solution Writeup · 1st place · Jan 27, 2022
        - separator [ref=f12e43]
        - generic [ref=f12e44]:
          - generic [ref=f12e46]:
            - paragraph [ref=f12e47]:
              - strong [ref=f12e48]:
                - text: Thanks to Kaggle and hosts for this very interesting competition with a too challenging dataset. This has been a great collaborative effort. Please give your upvotes to
                - link "@fatihozturk (opens in a new tab)" [ref=f12e49] [cursor=pointer]:
                  - /url: /fatihozturk
                  - text: "@fatihozturk"
                - link "@socom20 (opens in a new tab)" [ref=f12e50] [cursor=pointer]:
                  - /url: /socom20
                  - text: "@socom20"
                - link "@avsanjay (opens in a new tab)" [ref=f12e51] [cursor=pointer]:
                  - /url: /avsanjay
                  - text: "@avsanjay"
                - text: Congrats to The Winners.
            - heading "TLDR" [level=2] [ref=f12e52]
            - paragraph [ref=f12e53]:
              - link "@fatihozturk (opens in a new tab)" [ref=f12e54] [cursor=pointer]:
                - /url: /fatihozturk
                - text: "@fatihozturk"
              - text: explained in his
              - link "post (opens in a new tab)" [ref=f12e55] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/vinbigdata-chest-xray-abnormalities-detection/discussion/229724
                - text: post
              - text: how was his path through this competition, this post is intended as an overall view of our final solution which achieved 0.354/0..314 PublicLB/PrivateLB. It is worth mentioning that we also had a better solution with 0.330/0.321 PublicLB/PrivateLB (which unfortunately we didn't select). As you all already know the main magic we have used for this competition was our Ensembling procedure, also there were lots of other important findings that we mention in this post.
            - paragraph [ref=f12e56]:
              - strong [ref=f12e57]: CV strategy
              - text: ": This was our main challenge, we didn't have a unique validation scheme. Since we started the competition as different teams, we all were using different CV splits to train our models and to build our separated best ensembles. To overcome this difficulty we finally ended up using the public LB as an extra validation dataset. We felt that this strategy was a bit risky, so we also retrained some of our best models using a common validation split and then we ensemble them (this last approach didn't have the best score on the private LB by itself). We think that our last ensemble, using the public LB as a validation source, helped out our final solution to fit better the consensus method used to build the test dataset."
            - heading "Our Validation Strategy" [level=2] [ref=f12e58]
            - paragraph [ref=f12e59]: "Our strategy for the final submission can be divided into 3 stages :"
            - list [ref=f12e60]:
              - listitem [ref=f12e61]: Fully Validated Stage
              - listitem [ref=f12e62]: Partially Validated Stage
              - listitem [ref=f12e63]: Not validated Stage (Just validated using the Public LB)
            - heading "Models, we used for Ensembling" [level=2] [ref=f12e64]
            - list [ref=f12e65]:
              - listitem [ref=f12e66]:
                - paragraph [ref=f12e67]:
                  - strong [ref=f12e68]: "Fully Validated Stage:"
                - list [ref=f12e69]:
                  - listitem [ref=f12e70]:
                    - text: Detectron2 Resnet101 (notebook by
                    - link "@corochann (opens in a new tab)" [ref=f12e71] [cursor=pointer]:
                      - /url: /corochann
                      - text: "@corochann"
                    - text: ", Thanks)"
                  - listitem [ref=f12e72]: YoloV5
                  - listitem [ref=f12e73]: EffDetD2
              - listitem [ref=f12e74]:
                - paragraph [ref=f12e75]:
                  - strong [ref=f12e76]: "Partially Validated Stage:"
                - list [ref=f12e77]:
                  - listitem [ref=f12e78]: YoloV5 5Folds
              - listitem [ref=f12e79]:
                - paragraph [ref=f12e80]:
                  - strong [ref=f12e81]: "Not Validated Stage:"
                - list [ref=f12e82]:
                  - listitem [ref=f12e83]: 2 EffdetD2 model
                  - listitem [ref=f12e84]: 3 YoloV5 (1x w/ TTA , 2x w/o TTA)
                  - listitem [ref=f12e85]: 16 Classes Yolo model
                  - listitem [ref=f12e86]:
                    - text: 5 Folds YoloV5 by
                    - link "@awsaf49 (opens in a new tab)" [ref=f12e87] [cursor=pointer]:
                      - /url: /awsaf49
                      - text: "@awsaf49"
                  - listitem [ref=f12e88]: New Anchor Yolo
                  - listitem [ref=f12e89]:
                    - text: Detectron2 Resnet50 (notebook by
                    - link "@corochann (opens in a new tab)" [ref=f12e90] [cursor=pointer]:
                      - /url: /corochann
                      - text: "@corochann"
                    - text: ", Thanks)"
                  - listitem [ref=f12e91]:
                    - text: YoloV5
                    - link "@nxhong93 (opens in a new tab)" [ref=f12e92] [cursor=pointer]:
                      - /url: /nxhong93
                      - text: "@nxhong93"
                    - text: (
                    - link "https://www.kaggle.com/nxhong93/yolov5-chest-512 (opens in a new tab)" [ref=f12e93] [cursor=pointer]:
                      - /url: https://www.kaggle.com/nxhong93/yolov5-chest-512
                      - text: https://www.kaggle.com/nxhong93/yolov5-chest-512
                    - text: )
                  - listitem [ref=f12e94]: Yolov5 with image size (640)
            - heading "Ensembling Strategy" [level=2] [ref=f12e95]
            - paragraph [ref=f12e96]:
              - text: To ensemble all the partial models we mainly used
              - link "@zfturbo (opens in a new tab)" [ref=f12e97] [cursor=pointer]:
                - /url: /zfturbo
                - text: "@zfturbo"
              - text: "'s ensembling repository"
              - link "https://github.com/ZFTurbo/Weighted-Boxes-Fusion (opens in a new tab)" [ref=f12e98] [cursor=pointer]:
                - /url: https://github.com/ZFTurbo/Weighted-Boxes-Fusion
                - text: https://github.com/ZFTurbo/Weighted-Boxes-Fusion
              - text: ". Our ensemble technic is shown in the following figure:"
            - paragraph [ref=f12e99]:
              - img "enter image description here" [ref=f12e100]
            - paragraph [ref=f12e101]:
              - text: As you can see at the end of the Not Validated Stage, we use WBF+p_sum. This last blending method is a variant of WBF proposed by
              - link "@socom20 (opens in a new tab)" [ref=f12e102] [cursor=pointer]:
                - /url: /socom20
                - text: "@socom20"
              - text: and was intended to simulate the consensus of radiologists used in this particular test dataset. By using WBF+p_sum improved our Not Validated stage from 0.319 to 0.331 in the PublicLB.
            - paragraph [ref=f12e103]:
              - strong [ref=f12e104]: "Modified WBF:"
              - text: "It has more flexibility than WBF, it has 4 bbox blending technics, we found that only 2 of them were useful in this competition:"
            - list [ref=f12e105]:
              - listitem [ref=f12e106]:
                - text: "\"p_det_weight_pmean\", has a behaviour similar to WBF, it finds the set of bboxes with iou > thr, and then weights them using their detection probabilities (detection confidences). The new p_det (detection confidence) is an"
                - strong [ref=f12e107]: average
                - text: over the detection probabilities of detections with iou > thr.
              - listitem [ref=f12e108]:
                - text: "\"p_det_weight_psum\": does the same with the bboxes. In this case, the new p_det is a"
                - strong [ref=f12e109]: sum
                - text: over the detection probability of bboxes with iou > thr. Because of the sum of the p_dets, "p_det_weight_psum" needs a final normalization step. The idea behind psum is to try to replicate "the consensus of radiologists" using the partial models. When adding the probabilities of detection, we weigh more those boxes in which more models/radiologists agree.
            - paragraph [ref=f12e110]: In our final submission, the not validated stage had a high weighting, which lead to an overfitted problem in our final ensemble we got 0.354/0.314 Public/Private. If we had reduced the weighting for this not validated stage, the LB score would have become 0.330/0.321 Public/Private as we previously have mentioned in the post.
            - heading "Some Interesting Findings" [level=2] [ref=f12e111]
            - list [ref=f12e112]:
              - listitem [ref=f12e113]:
                - text: After spending more time understanding the competition metric, we realized that there is No Penalty For Adding More Bbox as
                - link "@cdeotte (opens in a new tab)" [ref=f12e114] [cursor=pointer]:
                  - /url: /cdeotte
                  - text: "@cdeotte"
                - text: "explains clearly here:"
                - link "https://www.kaggle.com/c/vinbigdata-chest-xray-abnormalities-detection/discussion/229637 (opens in a new tab)" [ref=f12e115] [cursor=pointer]:
                  - /url: https://www.kaggle.com/c/vinbigdata-chest-xray-abnormalities-detection/discussion/229637
                  - text: https://www.kaggle.com/c/vinbigdata-chest-xray-abnormalities-detection/discussion/229637
                - text: . Having more confident boxes is good but, at the same time, having many low confidence bboxes improves the Recall and can improve the mAP as well. We tested this approach by using two models, a Model A with a good mAP, and a Model B with a good Recall for all the classes. The following figure shows on the left the Precision vs Recall curves of Model A. It can be seen that many class tails end with a maximum recall = 0.7. We managed to add to Model A all the bboxes predicted for Model B which doesn't overlap with any bbox of predicted for Model A, the result is in the plot of the right. It can be seen that the main shape of the PvsR curves is still the same, but the tails now reach over recall=0.8. We didn't use this approach in our final model because the final ensemble already had a very good recall for all the classes.
            - paragraph [ref=f12e116]:
              - img "enter image description here" [ref=f12e117]
            - list [ref=f12e118]:
              - listitem [ref=f12e119]: Last competition days, we spent analyzing the predictions made for the ensemble both by submitting and also visually inspecting predicted bboxes. We found that our improved submissions were indeed improving for almost all classes including the easy and the rare ones.
            - paragraph [ref=f12e120]:
              - img "enter image description here" [ref=f12e121]
            - heading "Things didn't work" [level=2] [ref=f12e122]
            - list [ref=f12e123]:
              - listitem [ref=f12e124]:
                - text: "Multi-Label Classifier: We trained a multilabel classifier using as output the 14 classes. We used sigmoid as activation because we needed the probability of each disease and many images have more than one disease. The idea was to remove from the ensemble all the bboxes not predicted by this classifier model, This approach led to a reduction in performance. We also tried to switch the pooling layer and to use PCAM pooling (it is an attention pooling layer used in the"
                - link "Top1 Solution of CheXpert (opens in a new tab)" [ref=f12e125] [cursor=pointer]:
                  - /url: https://github.com/jfhealthcare/Chexpert
                  - text: Top1 Solution of CheXpert
                - text: ), but it didn't work either.
              - listitem [ref=f12e126]: "Bbox Filter: We trained an EfficientNetB6 which classifies whether the detected bboxes belong to a selected class or not just by seeing the crop selected by the ensemble. The model couldn't understand the difference between each disease, perhaps it needed more information on the whole image."
              - listitem [ref=f12e127]: "Usage of External Dataset: We tried to use the NIH dataset. We first trained a backbone as a Multi-Label Classifier using NIH classes, and then we transfer its weights to the detector's backbone. Finally, we trained only the detection heads using this competition's dataset. We couldn't detect any appreciable improvement in the particular detector score."
              - listitem [ref=f12e128]: "ClassWise Model: we trained different models, one for each detection class. We used clsX + cls14 as each model's dataset. In this case, each model had its own set of anchors prepared for detecting the class of interest. Some classes improved their CV performance but others didn't. Joining all the models we got a very good model, unfortunately, the validation split used in this model was different from the others and it was unreliable to add it to the Validated Stage so we decided to include it in the Partially Validated Stage, but still, didn't give any improvements. We had a final ensemble using this model, which wasn't finally selected, but it had the same score as our winning submission."
            - heading "Models we choose." [level=2] [ref=f12e129]
            - list [ref=f12e130]:
              - listitem [ref=f12e131]: "Best at local validation (around 0.47+ mAP on CV), Public: 0.300, private: 0.287"
              - listitem [ref=f12e132]: "Best at LB. Public: 0.354, private: 0.314"
              - listitem [ref=f12e133]: Our best submission in private was 0.321 which was 0.330 in Public
            - heading "Hardware we used" [level=2] [ref=f12e134]
            - list [ref=f12e135]:
              - listitem [ref=f12e136]: 4x Quadro GV100
              - listitem [ref=f12e137]: 4x Geforce GTX 1080
              - listitem [ref=f12e138]: 4x Titan X
              - listitem [ref=f12e139]: Ryzen 9 3950x
              - listitem [ref=f12e140]: Nvidia RTX 3080
              - listitem [ref=f12e141]: "Quadro RTX 6000 EDIT 1: The solution is reproducible by one GPU itself."

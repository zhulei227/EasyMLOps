          - generic [ref=f5e37]:
            - link [ref=f5e38] [cursor=pointer]:
              - /url: /competitions/petfinder-pawpularity-score
              - paragraph [ref=f5e40]: PetFinder.my - Pawpularity Contest
            - paragraph [ref=f5e41]: Solution Writeup · 1st place
        - separator [ref=f5e43]
        - generic [ref=f5e44]:
          - generic [ref=f5e46]:
            - paragraph [ref=f5e47]: I'm not home right now (actually in vacations) but wanted to share a macro vision of my solution. I will write in more details tomorrrow.
            - paragraph [ref=f5e48]:
              - text: I basically used three awesome great libraries,
              - link "PyTorch Image Models (opens in a new tab)" [ref=f5e49] [cursor=pointer]:
                - /url: https://github.com/rwightman/pytorch-image-models
                - text: PyTorch Image Models
              - text: (thanks to Ross Wightman),
              - link "RAPIDS (opens in a new tab)" [ref=f5e50] [cursor=pointer]:
                - /url: https://rapids.ai/
                - text: RAPIDS
              - text: cuml (thanks NVIDIA) and OpenAI
              - link "CLIP (opens in a new tab)" [ref=f5e51] [cursor=pointer]:
                - /url: https://github.com/openai/CLIP
                - text: CLIP
              - text: .
            - paragraph [ref=f5e52]: The solution is an ensemble of a SVR(tabular data) and image models.
            - list [ref=f5e53]:
              - listitem [ref=f5e54]:
                - paragraph [ref=f5e55]: "For the tabular SVR part the features were extracted from pretrained architectures using timm and openai clip libraries, then concatenated the embeddings of multiple pretrained models and fit a cuml SVR on the top of it. The resulting dataset have thousands of columns and only using cuml SVR I was able to fit that dataset in a reasonable amount of time. Better than that I extracted features from most of the models available in timm libraries and used forward model selection to choose the best models to pick for SVR. Extracted features SVR CV: 16.92"
              - listitem [ref=f5e56]:
                - paragraph [ref=f5e57]: "The Image part of the solution is an standard image regression approach, fit some Visions transformers and CNN models then ensemble the predictions. My best single model is a beit_large_patch16_224 with CV around 17.38. Image ensemble CV: 17.02"
            - paragraph [ref=f5e58]: "FInal solution is an ensemble of the two approaches. CV: 16.818 / Private LB: 16.8225 (local CV and Private LB are very close, not sure if it is just by luck)"
            - paragraph [ref=f5e59]: Huge thanks to Kaggle and Petfinder for make it happen. Also congrats to all prize winners, gold, silver and bronze medalists and everyone that enjoyed and contributed to this competition. This is very special to me since its my first solo win in an image competition.
            - paragraph [ref=f5e60]: Giba

      - generic [ref=f21e31]: 1st Place Solution - Part 2 — IEEE-CIS Fraud Detection
      - separator [ref=f21e32]
      - generic [ref=f21e34]:
        - generic [ref=f21e35]:
          - heading "1st Place Solution - Part 2" [level=1] [ref=f21e36]
          - generic [ref=f21e37]:
            - link [ref=f21e38] [cursor=pointer]:
              - /url: /competitions/ieee-fraud-detection
              - paragraph [ref=f21e40]: IEEE-CIS Fraud Detection
            - paragraph [ref=f21e41]: Solution Writeup · 1st place · Oct 8, 2019
        - separator [ref=f21e43]
        - generic [ref=f21e44]:
          - generic [ref=f21e46]:
            - paragraph [ref=f21e47]:
              - text: In "1st Place Solution - Part 1" posted
              - link "here (opens in a new tab)" [ref=f21e48] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/ieee-fraud-detection/discussion/111284
                - text: here
              - text: ", we discussed the benefits of classifying"
              - strong [ref=f21e49]: clients
              - text: (credit cards) instead of
              - strong [ref=f21e50]: transactions
              - text: in Kaggle's Fraud competition. Here we will discuss the technical details.
            - heading "Final Model" [level=2] [ref=f21e51]
            - paragraph [ref=f21e52]:
              - text: Our final model was a combination of 3 high scoring single models. CatBoost (Public/Private LB of 0.9639/0.9408), LGBM (0.9617/0.9384), and XGB (0.9602/0.9324). These models were diversified because Konstantin built the CAT and LGB while I built the XGB and NN. And we engineered features independently. (In the end we didn't use the NN which had LB 0.9432). XGB notebook posted
              - link "here (opens in a new tab)" [ref=f21e53] [cursor=pointer]:
                - /url: https://www.kaggle.com/cdeotte/xgb-fraud-with-magic-0-9600
                - text: here
              - text: .
            - paragraph [ref=f21e54]: One final submission was a stack where LGBM was trained on top of the predictions of CAT and XGB and the other final submission was an ensemble with equal weights. Both submissions were post processed by taking all predictions from a single client (credit card) and replacing them with that client's average prediction. This PP increased LB by 0.001.
            - heading "How to Find UIDs" [level=2] [ref=f21e55]
            - paragraph [ref=f21e56]:
              - text: We found UIDs in two different ways. (Specific details
              - link "here (opens in a new tab)" [ref=f21e57] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/ieee-fraud-detection/discussion/111510
                - text: here
              - text: ).
            - list [ref=f21e58]:
              - listitem [ref=f21e59]:
                - text: Wrote a script that finds UIDs
                - link "here (opens in a new tab)" [ref=f21e60] [cursor=pointer]:
                  - /url: https://www.kaggle.com/kyakovlev/ieee-uid-detection-v6
                  - text: here
              - listitem [ref=f21e61]:
                - text: Train our models to find UIDs
                - link "here (opens in a new tab)" [ref=f21e62] [cursor=pointer]:
                  - /url: https://www.kaggle.com/kyakovlev/ieee-basic-fe-part-1
                  - text: here
                - text: and
                - link "here (opens in a new tab)" [ref=f21e63] [cursor=pointer]:
                  - /url: https://www.kaggle.com/cdeotte/xgb-fraud-with-magic-0-9600
                  - text: here
            - paragraph [ref=f21e64]:
              - text: If you remember, Konstantin's original public FE kernel
              - link "here (opens in a new tab)" [ref=f21e65] [cursor=pointer]:
                - /url: https://www.kaggle.com/kyakovlev/ieee-fe-for-local-test
                - text: here
              - text: without UIDs achieves local validation AUC = 0.9245 and public LB 0.9485. His new FE kernel
              - link "here (opens in a new tab)" [ref=f21e66] [cursor=pointer]:
                - /url: https://www.kaggle.com/kyakovlev/ieee-basic-fe-part-1
                - text: here
              - text: achieves local validation AUC = 0.9377 and public LB 0.9617 by finding and using UIDs. Soon I will post my XGB kernel which finds UIDs with even less human assistance and proves to beat all other methods of finding UIDs. (XGB posted
              - link "here (opens in a new tab)" [ref=f21e67] [cursor=pointer]:
                - /url: https://www.kaggle.com/cdeotte/xgb-fraud-with-magic-0-9600
                - text: here
              - text: ). The purpose of producing UIDs by a script was for EDA, special validation tests, and post process. We did not add the script's UIDs to our models. Machine learning did better finding them on its own.
            - heading "EDA" [level=2] [ref=f21e68]
            - paragraph [ref=f21e69]:
              - text: EDA was daunting in this competition. There were so many columns to analyze and their meanings were obscured. For the first 150 columns, we used Alijs's great EDA
              - link "here (opens in a new tab)" [ref=f21e70] [cursor=pointer]:
                - /url: https://www.kaggle.com/alijs1/ieee-transaction-columns-reference
                - text: here
              - text: . For the remaining 300 columns, we used my V and ID EDA
              - link "here (opens in a new tab)" [ref=f21e71] [cursor=pointer]:
                - /url: https://www.kaggle.com/cdeotte/eda-for-columns-v-and-id
                - text: here
              - text: ". We reduced the number of V columns with 3 tricks. First groups of V columns were found that shared similar NAN structure, next we used 1 of 3 methods:"
            - list [ref=f21e72]:
              - listitem [ref=f21e73]: We applied PCA on each group individually
              - listitem [ref=f21e74]: We selected a maximum sized subset of uncorrelated columns from each group
              - listitem [ref=f21e75]: We replaced the entire group with all columns averaged.
            - paragraph [ref=f21e76]:
              - text: Afterward, these reduced groups were further evaluated using feature selection techniques below. For example, the block
              - code [ref=f21e77]: V322-V339
              - text: failed "time consistency" and was removed from our models.
            - heading "Feature Selection" [level=2] [ref=f21e78]
            - paragraph [ref=f21e79]: "Feature selection was important because we had many columns and preferred to keep our models efficient. My XGB had 250 features and would train 6 folds in 10 minutes. Konstantin will need to say what his models had. We used every trick we knew to select our features:"
            - list [ref=f21e80]:
              - listitem [ref=f21e81]: forward feature selection (using single or groups of features)
              - listitem [ref=f21e82]: recursive feature elimination (using single or groups of features)
              - listitem [ref=f21e83]: permutation importance
              - listitem [ref=f21e84]: adversarial validation
              - listitem [ref=f21e85]: correlation analysis
              - listitem [ref=f21e86]: time consistency
              - listitem [ref=f21e87]: client consistency
              - listitem [ref=f21e88]: train/test distribution analysis
            - paragraph [ref=f21e89]:
              - text: One interesting trick called "time consistency" is to train a single model using a single feature (or small group of features) on the first month of train dataset and predict
              - code [ref=f21e90]: isFraud
              - text: for the last month of train dataset. This evaluates whether a feature by itself is consistent over time. 95% were but we found 5% of columns hurt our models. They had training AUC around 0.60 and validation AUC 0.40. In other words some features found patterns in the present that did not exist in the future. Of course the possible of interactions complicates things but we double checked every test with other tests.
            - heading "Validation Strategy" [level=2] [ref=f21e91]
            - paragraph [ref=f21e92]: We never trusted a single validation strategy so we used lots of validation strategies. Train on first 4 months of train, skip a month, predict last month. We also did train 2, skip 2, predict 2. We did train 1 skip 4 predict 1. We reviewed LB scores (which is just train 6, skip 1, predict 1 and no less valid than other holdouts). We did a CV GroupKFold using month as the group. We also analyzed models by how well they classified known versus unknown clients using our script's UIDs.
            - paragraph [ref=f21e93]: For example when training on the first 5 months and predicting the last month, we found that our
            - list [ref=f21e94]:
              - listitem [ref=f21e95]: XGB model did best predicting known UIDs with AUC = 0.99723
              - listitem [ref=f21e96]: LGBM model did best predicting unknown UIDs with AUC = 0.92117
              - listitem [ref=f21e97]: CAT model did best predicting questionable UIDs with AUC = 0.98834
            - paragraph [ref=f21e98]: Questionable UIDs are transactions that our script could not confidently link to other transactions. When we ensembled and/or stacked our models we found that the resultant model excelled in all three categories. It could predict known, unknown, and questionable UIDs forward in time with great accuracy !!

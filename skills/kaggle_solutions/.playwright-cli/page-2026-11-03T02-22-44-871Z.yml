                    - paragraph [ref=f21e839]:
                      - text: "\"train/test distribution consistency\" is comparing the distribution (histogram) of a feature in the training set with its distribution (histogram) in the test set. For example"
                      - code [ref=f21e840]: TransactionDT
                      - text: has low values in train and high values in test. And the values do not overlap. This feature is bad (obviously) so we drop it. You can either inspect features manually or use a library like
                      - code [ref=f21e841]: from scipy.stats import ks_2samp
                      - text: . Documentation
                      - link "here (opens in a new tab)" [ref=f21e842] [cursor=pointer]:

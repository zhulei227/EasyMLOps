                        - text: here
                      - text: ", drop features with p=0."
                    - paragraph [ref=f21e843]: "\"client consistency\" is similar to \"time consistency\". Split your train dataset by UIDs. Put 80% of UIDs (clients i.e. credit cards) into a train subset and 20% UIDs into a holdout (validation set). Make sure that no UID (client/credit card) is in both sets. Then train models on the 80% train and predict the 20% unseen clients. This evaluates how well features can predict unseen clients (credit cards)."

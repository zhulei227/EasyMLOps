      - separator [ref=f38e32]
      - generic [ref=f38e34]:
        - generic [ref=f38e35]:
          - heading "#2 solution 🤖 Quantum Uncertainty 🤖" [level=1] [ref=f38e36]
          - generic [ref=f38e37]:
            - link [ref=f38e38] [cursor=pointer]:
              - /url: /competitions/champs-scalar-coupling
              - paragraph [ref=f38e40]: Predicting Molecular Properties
            - paragraph [ref=f38e41]: Solution Writeup · 2nd place · Dec 11, 2019
        - separator [ref=f38e43]
        - generic [ref=f38e44]:
          - generic [ref=f38e46]:
            - paragraph [ref=f38e47]: "We want to thank Kaggle and CHAMPs for organizing such an awesome competition:"
            - list [ref=f38e48]:
              - listitem [ref=f38e49]: No leakage.
              - listitem [ref=f38e50]:
                - text: Same distribution in train, private and public test (very stable CV vs. LB, public LB vs. private LB). This is very relevant in other competitions given so many participants when the 3 distributions are different some winners (not all, e.g.
                - link "CPMP approach to manually align test ~ train in the Microsoft malware comp (opens in a new tab)" [ref=f38e51] [cursor=pointer]:
                  - /url: https://www.kaggle.com/c/microsoft-malware-prediction/discussion/84069#latest-499864
                  - text: CPMP approach to manually align test ~ train in the Microsoft malware comp
                - text: ) are just lucky they fit private test distribution by chance; not the case here.
              - listitem [ref=f38e52]: Inspiring and useful science problem hopefully used for good purposes as described in the context (new drugs, etc.).
            - paragraph [ref=f38e53]:
              - text: Neither my teammate
              - link "@pavelgonchar (opens in a new tab)" [ref=f38e54] [cursor=pointer]:
                - /url: /pavelgonchar
                - text: "@pavelgonchar"
              - text: "nor I had any previous domain expertise and we made the decision early on that we would tackle this problem using a very pure deep learning way: letting the model build the features for us, not the other way around (b/c obviously we were at a disadvantage if we tried to become quantum experts in 1 month… hence our team name 🤖Quantum Uncertainty🤖 we didn't know if our yet-to-be-developed approach was going to work)."
            - paragraph [ref=f38e55]: "Our solution had two major parts: 1) the input representation and 2) deep learning architecture."
            - paragraph [ref=f38e56]:
              - strong [ref=f38e57]: Input representation
            - paragraph [ref=f38e58]: "This is in our opinion the key part: we take a molecule and a source atom and move it so the source atom is @ (0,0,0). For each molecule we create N molecule siblings (N being as many source atoms are defined for that molecule), and each molecule sibling is translated so its source is at (0,0,0)."
            - paragraph [ref=f38e59]:
              - text: The
              - code [ref=f38e60]: x
              - text: "(input) are three arrays of dimension 29 (maximum number of atoms):"
            - paragraph [ref=f38e61]:
              - text: 1)
              - code [ref=f38e62]: x,y,z
              - text: position of each atom, 2)
              - code [ref=f38e63]: atom type
              - text: index (C=0, H=1, etc…) 3)
              - code [ref=f38e64]: j-coupling type
              - text: index (1JHC=0,'2JHH=1,etc.)
            - paragraph [ref=f38e65]:
              - text: Padding is done by placing -1 in
              - code [ref=f38e66]: atom type
              - text: index and
              - code [ref=f38e67]: j-coupling type
              - text: for molecules which have less than 29 atoms.
            - paragraph [ref=f38e68]:
              - text: The
              - code [ref=f38e69]: "y"
              - text: (ground truth) is just an array of dimension 29 containing j-couplings located at target atom indices.
            - paragraph [ref=f38e70]: Note that there is no graph information nor any other manually engineered features.
            - paragraph [ref=f38e71]:
              - strong [ref=f38e72]: Data augmentation
            - paragraph [ref=f38e73]: "We did two types of data augmentation:"
            - list [ref=f38e74]:
              - listitem [ref=f38e75]: "Rotations: which worked and were useful in our first attempt model: pointnet-based, but proved worthless in the final models (atomic transformer)."
              - listitem [ref=f38e76]:
                - text: "J-coupling symmetry: as described"
                - link "in this discussion (opens in a new tab)" [ref=f38e77] [cursor=pointer]:
                  - /url: https://www.kaggle.com/c/champs-scalar-coupling/discussion/94706#latest-563148
                  - text: in this discussion
            - paragraph [ref=f38e78]:
              - strong [ref=f38e79]: "First attempt: Pointnet-inspired architecture (got up to -2.28200 LB)"
            - paragraph [ref=f38e80]:
              - text: "Our input representation is basically a point cloud: an unordered set of elements with absolute positions"
              - code [ref=f38e81]: x,y,z
              - text: and two attributes
              - code [ref=f38e82]: atom type
              - text: and
              - code [ref=f38e83]: j-coupling type
              - text: . We modified the
              - link "Pointnet (opens in a new tab)" [ref=f38e84] [cursor=pointer]:
                - /url: https://arxiv.org/abs/1612.00593
                - text: Pointnet
              - text: architecture to regress j-couplings. Training was a bit unstable and we tried many variations of the architecture, swapping FC layers by linear (fixed) projections (Hadamard), adding coulomb matrix as input, etc.
            - paragraph [ref=f38e85]: "While this worked OK and got us to -2.28200 LB (ensembling a few models) we felt that this architecture was limited by the extreme pooling/bottleneck operation so we decided to explore other architectures: meet the Atomic Transformer."
            - paragraph [ref=f38e86]:
              - strong [ref=f38e87]: "Final architecture: meet the Atomic Transformer"
            - paragraph [ref=f38e88]:
              - text: You may know that the recent NLP revolution is mostly due to the transformer architecture described in the
              - link "Attention is all you need paper (opens in a new tab)" [ref=f38e89] [cursor=pointer]:
                - /url: https://arxiv.org/abs/1706.03762
                - text: Attention is all you need paper
              - text: . The vanilla transformer architecture uses a very clever technique to add positional encodings that are needed for position-dependent input, such as language.
            - paragraph [ref=f38e90]:
              - text: Our input representation is a set, which means we can (and should) remove positional encoding. Prior to this competition we had no experience with transformers either but there's a section in
              - link "Lex Fridman MIT podcast interviewing Orion Vinyals (opens in a new tab)" [ref=f38e91] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=Kedt2or9xlo
                - text: Lex Fridman MIT podcast interviewing Orion Vinyals
              - text: where he mentions the inherent position invariance of a barebone transformer encoder layer. This immediately triggered the idea of using transformer layers (encoders) stacked taking as an input
              - code [ref=f38e92]: x,y,z
              - text: (normalized but otherwise as-is), and
              - code [ref=f38e93]: atom type
              - text: and
              - code [ref=f38e94]: j-coupling type
              - text: embeddings; just concatenated… nothing fancy.
            - paragraph [ref=f38e95]:
              - text: The dimension of the embeddings was such that the total dimension of the input vectors was
              - code [ref=f38e96]: d_model
              - text: (as normally reference in transformer literature). We started with 256 and got immediately great results surpassing our pointnet-inspired architecture so we followed this path.
            - paragraph [ref=f38e97]: We trained a total of 14 models, with varying dimensions from 512 to 2048 and layers from 6 to 24. Each model parameter size ranged from ~12M to ~100M (biggest model).
            - paragraph [ref=f38e98]: "We trained some models from scratch, others we fine-tuned. We also fine-tuned a few models on the troublesome j-couplings: reaching -2.12 CV on 1JHC on and -2.19 CV on 1JHN."
            - paragraph [ref=f38e99]:
              - text: Our best score is an ensemble of 14 models achieving private LB of -3.22349, and our best single model achieved private LB of -3.16234, again just with
              - code [ref=f38e100]: x,y,z
              - text: ","
              - code [ref=f38e101]: atom type
              - text: and
              - code [ref=f38e102]: j-coupling type
              - text: inputs (no QM9, etc.).
            - paragraph [ref=f38e103]:
              - strong [ref=f38e104]: What didn't work
            - paragraph [ref=f38e105]: "Many things! We tried:"
            - list [ref=f38e106]:
              - listitem [ref=f38e107]: Multi-task learning using contributions and other organization provided values.
              - listitem [ref=f38e108]: "Dropout: We tried multiple attempts to add dropout at various stages (embeddings, encoder layers, pre-decoder, etc.). None of them worked."
              - listitem [ref=f38e109]: "Knock-out: We added a variation in which as input we deleted 10% of the input atoms, the idea being that the model would build an internal representation of the missing atoms. Surprisingly this worked in that the model still converged nicely but failed to reduce train ~ val gap."
              - listitem [ref=f38e110]: "Rotations and TTA in Atomic Transformer: it didn't reduce train ~ val gap and didn't produce meaningful TTA gains."
              - listitem [ref=f38e111]: "Deep decoder: Our decoder is just a projection of ~ the model dimension to 1 (scalar coupling). We tried adding more expressive power to the decoder but this didn't help."
              - listitem [ref=f38e112]:
                - text: Fp16 training. This worked for models of dimensions 256 but as training evolved gave
                - code [ref=f38e113]: NaN
                - text: s despite numerous attempts to fix it.
            - paragraph [ref=f38e114]:
              - strong [ref=f38e115]: Source code
            - paragraph [ref=f38e116]: We will make source code available once we do clean up. It's a single jupyter notebook using FastAI. Be patient.
            - paragraph [ref=f38e117]:
              - strong [ref=f38e118]: Computational resources
            - paragraph [ref=f38e119]: "We had more ideas than computational resources, even if our computational resources were not tiny:"
            - list [ref=f38e120]:
              - listitem [ref=f38e121]: 3 x 2080 Ti + 128 Gb RAM + 16c32t processor
              - listitem [ref=f38e122]: 2 x 1080 Ti + 64 Gb RAM + 8c16t processor
              - listitem [ref=f38e123]: Rented 8+ 2080 Ti + 64 Gb RAM + 16c32t processor (multiple machines rented as needed)
            - paragraph [ref=f38e124]:
              - strong [ref=f38e125]: Final thoughts
            - paragraph [ref=f38e126]: "This was our most fun and hardest competition so far:"
            - list [ref=f38e127]:
              - listitem [ref=f38e128]: Challenging problem
              - listitem [ref=f38e129]:
                - text: Most teams in top 5 had domain experts (although we went
                - emphasis [ref=f38e130]: domainless
                - text: as part of our strategy)
              - listitem [ref=f38e131]: Hungry computational resources.
            - paragraph [ref=f38e132]:
              - text: "Even if we lost #1 position just a few hours before competition end we feel very excited we were able to achieve such"
              - link "useful results for the organizers (opens in a new tab)" [ref=f38e133] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/champs-scalar-coupling/discussion/98375#latest-569312
                - text: useful results for the organizers
              - text: . In retrospect we believe a single model of the Atomic Transformer may achieve ever better results with further training.
            - paragraph [ref=f38e134]: Best - Pavel & Andres
            - paragraph [ref=f38e135]: p.s. No graph NNs. We though graphs as manually engineered features that the model can infer by itself.

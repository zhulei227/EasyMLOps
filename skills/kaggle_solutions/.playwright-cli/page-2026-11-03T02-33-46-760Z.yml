    - generic [ref=f36e29]:
      - generic [ref=f36e31]: PDD Writeup — COVID19 Global Forecasting (Week 5)
      - separator [ref=f36e32]
      - generic [ref=f36e34]:
        - generic [ref=f36e35]:
          - heading "PDD Writeup" [level=1] [ref=f36e36]
          - generic [ref=f36e37]:
            - link [ref=f36e38] [cursor=pointer]:
              - /url: /competitions/covid19-global-forecasting-week-5
              - paragraph [ref=f36e40]: COVID19 Global Forecasting (Week 5)
            - paragraph [ref=f36e41]: Solution Writeup · 2nd place
        - separator [ref=f36e43]
        - generic [ref=f36e44]:
          - generic [ref=f36e46]:
            - paragraph [ref=f36e47]:
              - text: Thanks to my teammates
              - link "@dott1718 (opens in a new tab)" [ref=f36e48] [cursor=pointer]:
                - /url: /dott1718
                - text: "@dott1718"
              - text: and
              - link "@christofhenkel (opens in a new tab)" [ref=f36e49] [cursor=pointer]:
                - /url: /christofhenkel
                - text: "@christofhenkel"
              - text: for collaborating throughout the four competitions. As even the last week competition is already close to half-time in terms of scoring, we want to give a short overview over out solutions. We are really happy with our results across the four weeks, specifically as more optimistic models (predicting fewer cases and fatalities) performed better and our most pessimistic models in week 2 performed the worst.
            - paragraph [ref=f36e50]:
              - strong [ref=f36e51]: Week 1
            - paragraph [ref=f36e52]: Everyone went into this competition with a lot of fear and uncertainty about covid-19 and I think this also reflects in the models that were produced. Very little data was available and most countries were in earlier periods of severe exponential growth. We quite quickly figured that utilizing any ML model does not seem appropriate here due to lack of historical data. We thus crafted the basis for our main model that we utilized throughout all four weeks. For predicting confirmed cases, the model uses a constant growth rate that is reduced by a decay that is accelerating over time. For fatalities, we multiply predicted cases of a given time lag with a fatality rate for a given country, and also add a constant growth.
            - paragraph [ref=f36e53]: This model allowed us some flexibility also in choice of (hyper-)parameters. We ended up deciding on one optimistic and one pessimistic submission in week 1, where the optimistic one has lower growth rates and higher acceleration of the decay of this growth rate and the pessimistic one has it the other way around. For countries where we already have "sufficient" data above a certain threshold, we learn the growth over a certain time period, and for others we employ default growth rates.
            - paragraph [ref=f36e54]:
              - text: "Optimistic sub:"
              - link "https://www.kaggle.com/dott1718/cv19-by-growth-rate-v5-09?scriptVersionId=30833479 (opens in a new tab)" [ref=f36e55] [cursor=pointer]:
                - /url: https://www.kaggle.com/dott1718/cv19-by-growth-rate-v5-09?scriptVersionId=30833479
                - text: https://www.kaggle.com/dott1718/cv19-by-growth-rate-v5-09?scriptVersionId=30833479
              - text: "Pessimistic sub:"
              - link "https://www.kaggle.com/dott1718/cv19-by-growth-rate-v5-03-per-5?scriptVersionId=30833633 (opens in a new tab)" [ref=f36e56] [cursor=pointer]:
                - /url: https://www.kaggle.com/dott1718/cv19-by-growth-rate-v5-03-per-5?scriptVersionId=30833633
                - text: https://www.kaggle.com/dott1718/cv19-by-growth-rate-v5-03-per-5?scriptVersionId=30833633
            - paragraph [ref=f36e57]: The optimistic sub predicted globally 2.6 mio cases after 30 days and 120k fatalities after 30 days as of 22nd of April. The pessimistic one was way more doomsday and predicted 24 mio cases and 430k fatalities. The optimistic one ended 2nd on private LB and scored 1.07716 while the pessimistic one scored still 1.29940 and would have been 5th rank. This also gives you a good idea of the problems of this metric, because even if you are off that far globally from the actual numbers, if you get some low-case countries right, the metric improves drastically.
            - paragraph [ref=f36e58]:
              - text: Now looking back, I have to say that our global estimation here was really, really precise. I just checked worldometer data, and on 23nd of April the actual confirmed cases were
              - strong [ref=f36e59]: 2,722,000
              - text: and what we predicted was
              - strong [ref=f36e60]: 2,650,252
              - text: . I would have not thought that we can be so precise there, even if individual countries can be off.
            - paragraph [ref=f36e61]:
              - strong [ref=f36e62]: Week 2
            - paragraph [ref=f36e63]: Even more exponential short-term growth was observed in the pre-ceding week. We mostly re-utilized our models from week 1 and adapted them a bit and overfitted them thankfully on short-term growth patterns which made them quite pessimistic in retrospective. The second submissions blends a power law fit with exponential cutoff to the model and it is actually our better sub here.
            - paragraph [ref=f36e64]:
              - text: "Sub 1:"
              - link "https://www.kaggle.com/dott1718/cv19w2-2-sub?scriptVersionId=31270684 (opens in a new tab)" [ref=f36e65] [cursor=pointer]:
                - /url: https://www.kaggle.com/dott1718/cv19w2-2-sub?scriptVersionId=31270684
                - text: https://www.kaggle.com/dott1718/cv19w2-2-sub?scriptVersionId=31270684
              - text: "Sub 2:"
              - link "https://www.kaggle.com/philippsinger/cv19w2-pl4-sub?scriptVersionId=31271930 (opens in a new tab)" [ref=f36e66] [cursor=pointer]:
                - /url: https://www.kaggle.com/philippsinger/cv19w2-pl4-sub?scriptVersionId=31271930
                - text: https://www.kaggle.com/philippsinger/cv19w2-pl4-sub?scriptVersionId=31271930
            - paragraph [ref=f36e67]:
              - strong [ref=f36e68]: Week 3
            - paragraph [ref=f36e69]:
              - text: We saw that machine learning solutions slowly start to shine, specifically for short-term predictions and decided to one the one hand further tune our model and sub it, and as a second submission blend some of the public ML solutions in. In detail, we used subs from
              - link "@cpmpml (opens in a new tab)" [ref=f36e70] [cursor=pointer]:
                - /url: /cpmpml
                - text: "@cpmpml"
              - text: (+team),
              - link "@gaborfodor (opens in a new tab)" [ref=f36e71] [cursor=pointer]:
                - /url: /gaborfodor
                - text: "@gaborfodor"
              - text: and
              - link "@osciiart (opens in a new tab)" [ref=f36e72] [cursor=pointer]:
                - /url: /osciiart
                - text: "@osciiart"
              - text: "- so thanks to them! We heavily overweighted our model and the one from oscii in the final blend, so the weights were 8-8-1-1."
            - paragraph [ref=f36e73]:
              - text: "Single model sub:"
              - link "https://www.kaggle.com/philippsinger/cv19w3-2-v2-play-2-v3fix-sub-last6dayopt?scriptVersionId=31654736 (opens in a new tab)" [ref=f36e74] [cursor=pointer]:
                - /url: https://www.kaggle.com/philippsinger/cv19w3-2-v2-play-2-v3fix-sub-last6dayopt?scriptVersionId=31654736
                - text: https://www.kaggle.com/philippsinger/cv19w3-2-v2-play-2-v3fix-sub-last6dayopt?scriptVersionId=31654736
              - text: "Blend sub:"
              - link "https://www.kaggle.com/christofhenkel/cv19w3-v3fix-cpmp-oscii-belug-full-8118?scriptVersionId=31655753 (opens in a new tab)" [ref=f36e75] [cursor=pointer]:
                - /url: https://www.kaggle.com/christofhenkel/cv19w3-v3fix-cpmp-oscii-belug-full-8118?scriptVersionId=31655753
                - text: https://www.kaggle.com/christofhenkel/cv19w3-v3fix-cpmp-oscii-belug-full-8118?scriptVersionId=31655753
            - paragraph [ref=f36e76]: Our blend sub predicts 3,668,603 confirmed cases for 7th of May and 295,911 fatalities which is ~10 days in the future. I think globally this solution will also come quite close to reality. We are also currently ranked 3rd in the competition with trending upwards, even though the gap to 2nd might be too large.
            - paragraph [ref=f36e77]:
              - strong [ref=f36e78]: Week 4
            - paragraph [ref=f36e79]:
              - text: Again, we decided to improve our model and blend it with other solutions. The big change we did to our model was that we do not rely for fatality predictions anylonger on predictions on confirmed cases but rather also take the individual fatality curves for future predictions. We also blend our model now with solutions from
              - link "@osciiart (opens in a new tab)" [ref=f36e80] [cursor=pointer]:
                - /url: /osciiart
                - text: "@osciiart"
              - text: ","
              - link "@rohanrao (opens in a new tab)" [ref=f36e81] [cursor=pointer]:
                - /url: /rohanrao
                - text: "@rohanrao"
              - text: and
              - link "@david1013 (opens in a new tab)" [ref=f36e82] [cursor=pointer]:
                - /url: /david1013
                - text: "@david1013"
              - text: . Our two subs this time have different weights for the blends, usually overweighting our model. We also fully rely on our model predictions for Chinese countries.
            - paragraph [ref=f36e83]:
              - text: "Sub 1:"
              - link "https://www.kaggle.com/christofhenkel/cv19w4-full-pdd-oscii-david-vopa-sub1?scriptVersionId=32072839 (opens in a new tab)" [ref=f36e84] [cursor=pointer]:
                - /url: https://www.kaggle.com/christofhenkel/cv19w4-full-pdd-oscii-david-vopa-sub1?scriptVersionId=32072839
                - text: https://www.kaggle.com/christofhenkel/cv19w4-full-pdd-oscii-david-vopa-sub1?scriptVersionId=32072839
              - text: "Sub 2:"
              - link "https://www.kaggle.com/christofhenkel/cv19w4-full-pdd-oscii-david-vopa-sub2?scriptVersionId=32072928 (opens in a new tab)" [ref=f36e85] [cursor=pointer]:
                - /url: https://www.kaggle.com/christofhenkel/cv19w4-full-pdd-oscii-david-vopa-sub2?scriptVersionId=32072928
                - text: https://www.kaggle.com/christofhenkel/cv19w4-full-pdd-oscii-david-vopa-sub2?scriptVersionId=32072928
            - paragraph [ref=f36e86]: Sub 1 predicts globally on 14th of May 3,898,447 cases and 278,848 fatalities while sub 2 predicts 3,802,472 and 224,623 respectively. In general it seems that public subs tend to agree way more on cases and fatalities seems to drive most of the score differences. We are currently positioned 5th, but trending down a bit. Will be interesting to see how scores evolve.
            - paragraph [ref=f36e87]:
              - strong [ref=f36e88]: Learnings
            - paragraph [ref=f36e89]: "I am writing this write-up while hearing the news that Austria (the country I live in) removes many of the restrictions in place from May 1st onward. We have had one of the best curve flattenings globally, even though having huge exponential growth in the beginning and we quite overpredicted Austria from the start thankfully. The country implemented strong restrictions very early on and I believe they have helped a ton. This is something that we can learn from the most I feel like. Active cases (from worldemeters) looks like that for Austria:"
            - paragraph [ref=f36e90]
            - paragraph [ref=f36e91]: I really hope that this trend will not reverse again, many other countries also look that promising and we can only hope for a bright future.
            - paragraph [ref=f36e92]: Predicting these pandemics is very hard, mostly due to lack of data, very large uncertainty, difference in reporting, differences in public behavior, and so forth. Still, I believe the models produced in these competitions can be helpful in the future, even if it is only due to our better understanding how hard it is to predict it. A lot of personal judgement flows into these models and predictions, making them also very subjective and thus combining multiple models and opinions seems to be also worth-wile to follow up on in future.

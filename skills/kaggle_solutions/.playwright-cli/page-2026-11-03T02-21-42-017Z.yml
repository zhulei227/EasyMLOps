            - code [ref=f16e142]: "def remove_noisy2(df, thresholds): gap = np.abs(df[\"isup_grade\"] - df[\"probs_raw\"]) df_keeps = list() df_removes = list() for label, thresh in enumerate(thresholds): df_tmp = df[df.isup_grade == label].reset_index(drop=True) gap_tmp = gap[df.isup_grade == label].reset_index(drop=True) df_remove_tmp = df_tmp[gap_tmp > thresh].reset_index(drop=True) df_keep_tmp = df_tmp[gap_tmp <= thresh].reset_index(drop=True) df_removes.append(df_remove_tmp) df_keeps.append(df_keep_tmp) df_keep = pd.concat(df_keeps, axis=0) df_removed = pd.concat(df_removes, axis=0) return df_keep, df_removed def remove_noisy3(df, thresholds_rad, thresholds_ka): df_r = df[df.data_provider == \"radboud\"].reset_index(drop=True) df_k = df[df.data_provider != \"radboud\"].reset_index(drop=True) dfs = [df_r, df_k] thresholds = [thresholds_rad, thresholds_ka] df_keeps = list() df_removes = list() for df_tmp, thresholds_tmp in zip(dfs, thresholds): df_keep_tmp, df_remove_tmp = remove_noisy2(df_tmp, thresholds_tmp) df_keeps.append(df_keep_tmp) df_removes.append(df_remove_tmp) df_keep = pd.concat(df_keeps, axis=0) df_removed = pd.concat(df_removes, axis=0) return df_keep, df_removed # Change thresh each label each dataprovider thresholds_rad=[1.3, 0.8, 0.8, 0.8, 0.8, 1.3] thresholds_ka=[1.5, 1.0, 1.0, 1.0, 1.0, 1.5] df_keep, df_removed = remove_noisy3(df, thresholds_rad=thresholds_rad, thresholds_ka=thresholds_ka) show_keep_remove(df, df_keep, df_removed)"

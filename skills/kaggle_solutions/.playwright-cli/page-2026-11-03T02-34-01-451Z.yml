                  - paragraph [ref=f37e226]: Congrats again CPMP and team. Great job!!
                  - paragraph [ref=f37e227]: Can you describe the main models in your ensemble and their individual LB scores? Were their features developed separately or did your models share the same features? Lastly, were the models' features chosen based on the same local validation scheme?
                  - paragraph [ref=f37e228]: I'm particularly curious because I suspect our solution and your solution are very similar. But I think our models stacked a higher score. For the original competition deadline, we stacked a CAT LB 0.9620, LGBM LB 0.9610, and XGB 0.9600 and achieved LB 0.9664 then post process to LB 0.9674. (This solution wins the comp). In the extra 2 days, we mixed features between the models and did more convoluted stacking and ensembling to get to LB 0.9677.
                  - paragraph [ref=f37e229]: Our original models had features different from each other and were discovered using different local validation schemes (that emphasized different mixtures of seen versus unseen clients). I think this added diversity and allowed them to reach a higher score when stacked.

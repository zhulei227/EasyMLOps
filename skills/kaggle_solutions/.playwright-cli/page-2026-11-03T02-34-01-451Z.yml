      - generic [ref=f37e31]: 2nd Solution, CPMP View — IEEE-CIS Fraud Detection
      - separator [ref=f37e32]
      - generic [ref=f37e34]:
        - generic [ref=f37e35]:
          - heading "2nd Solution, CPMP View" [level=1] [ref=f37e36]
          - generic [ref=f37e37]:
            - link [ref=f37e38] [cursor=pointer]:
              - /url: /competitions/ieee-fraud-detection
              - paragraph [ref=f37e40]: IEEE-CIS Fraud Detection
            - paragraph [ref=f37e41]: Solution Writeup · 2nd place · Oct 8, 2019
        - separator [ref=f37e43]
        - generic [ref=f37e44]:
          - generic [ref=f37e46]:
            - paragraph [ref=f37e47]:
              - text: When Giba and I joined the team,
              - link "@sggpls (opens in a new tab)" [ref=f37e48] [cursor=pointer]:
                - /url: /sggpls
                - text: "@sggpls"
              - link "@tony321 (opens in a new tab)" [ref=f37e49] [cursor=pointer]:
                - /url: /tony321
                - text: "@tony321"
              - text: and
              - link "@krivoship (opens in a new tab)" [ref=f37e50] [cursor=pointer]:
                - /url: /krivoship
                - text: "@krivoship"
              - text: already had a solid position in top 10 and there were less than 10 days left. It is hard to add value in this case, and I decided to focus on adding diversity to the models they were blending. For that I started my own dataset and borrowed bits of theirs. Let me describe the steps I took.
            - paragraph [ref=f37e51]:
              - strong [ref=f37e52]: Data Cleaning
              - text: The data was a bit similar to Malware, with time stamped observations, and many features with lots of values present in test and not in train. I screened all features by looking at train vs test distributions, for raw feature and also frequency encoding of features. Here is an example for
              - code [ref=f37e53]: card1
              - text: .
              - img "card1 plot" [ref=f37e54]
              - text: Raw data is used on the left column, and feature encoding of it in the right column. Red is train, blue is test. Left row x axis is
              - code [ref=f37e55]: card1
              - text: . Top left y axis is frequency. Top left show frequency of each card1 value in train (red) and test (blue). Bottom left y axis is mean of target with a log transform. 0 is the average for train. Right column is the same, except card1 is replaced by log of its frequency.
            - paragraph [ref=f37e56]: We see that lots of card1 values only appear in test. If we use it directly it will lead to major drop in private LB. We also see that frequency encoding of card1 looks more balanced across train and test. FOr this feature I discarded the original one and kept the frequency encoding.
            - paragraph [ref=f37e57]: I did not merge values as I did in Malware, for lack of time. I am not sure it would have helped a lot, in hindsight.
            - paragraph [ref=f37e58]:
              - strong [ref=f37e59]: Cross Validation
            - paragraph [ref=f37e60]: Cross validation for time series is always tricky. Here is what I ended up with. I tried to mimic the fact that there is a significant time gap between train and test, and also that test can be several months away from train.
            - paragraph [ref=f37e61]: I run these folds, using months starting with with 0. The | indicates the train/val split 0 | 2 3 4 5 6 0 1 | 3 4 5 6 0 1 2 | 4 5 6 0 1 2 3 | 5 6 This makes me train 4 models for a given model type. I then average the auc score of each of these models on the corresponding validation data. This scheme or some variants were reused by my team mates for validating their models. The advantage is that we have folds that test long term forecast.
            - paragraph [ref=f37e62]: I used this CV to evaluate features, to evaluate HPO, and for feature selection. For submission I tried two ways. One, to extrapolate the number of trees from the CV runs. I just ran a linear regression on the log of trees, and predicted the value for full train. I also tried to use an unshuffled 8 fold CV and average all fold model predictions for test. Both ways were giving similar LB score. I probably have used both and blend the result, but I didn't…
            - paragraph [ref=f37e63]:
              - strong [ref=f37e64]: Feature Engineering
            - paragraph [ref=f37e65]:
              - text: I started by computing frequency encoding of all features, then used lightgbm with the above cross validation to select features using
              - link "permutation importance (opens in a new tab)" [ref=f37e66] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/ieee-fraud-detection/discussion/107877#latest-635386
                - text: permutation importance
              - text: "with some modification: I kept a feature only if permuting it did not improve any of the 4 model predictions. This removed some features. I repeated the process, using permutation importance to remove features until the feature list does not shrink anymore. With this I got 0.942 on public LB."
            - paragraph [ref=f37e67]: "The next level was to look for user id, and this is when I teamed. I was hoping my new team mates had sorted out the user id puzzle. They did. They actually had a number of different uids. I selected two of them defined as follows:"
            - code [ref=f37e69]:
              - generic [ref=f37e70]: "data['uid1']` = (data.day - data.D1).astype(str) +'_' + \\"
              - generic [ref=f37e71]: data.P_emaildomain.astype(str)
              - generic [ref=f37e72]: data['uid2'] = (data.card1.astype(str) +'_' + \
              - generic [ref=f37e73]: data.addr1.astype(str) +'_' + \
              - text: (
              - generic [ref=f37e74]: data.day - data.D1).astype(str) +'_' + \
              - generic [ref=f37e75]: data.P_emaildomain.astype(str))
            - paragraph [ref=f37e76]:
              - text: where
              - code [ref=f37e77]: data.day
              - text: is the number of days since the beginning, computed from
              - code [ref=f37e78]: TransactionDT
              - text: .
            - paragraph [ref=f37e79]: "I did not want to use these user ids directly for fear of overfitting (in hindsight this was a mistake, and in my last sub I just ran catboost using these as features and it led to my best sub). I rather used these uids to compute aggregate features from the sequence of time intervals for transactions for a given uid, and also for teh transaction amount. Here is one way I used:"
            - code [ref=f37e81]: "def add_gr(data, col): cols = data.columns gr = data.groupby(col) data[col+'_count'] = gr.TransactionID.transform('count').astype('int32') data[col+'_next_dt'] = gr.TransactionDT.shift(-1) data[col+'_next_dt'] -= data.TransactionDT data[col+'_mean_dt'] = gr[col+'_next_dt'].transform('mean').astype('float32') data[col+'_std_dt'] = gr[col+'_next_dt'].transform('std').astype('float32') data[col+'_median_dt'] = gr[col+'_next_dt'].transform('median').astype('float32') data[col+'_next_amt'] = gr.TransactionAmt.shift(-1) data[col+'_mean_amt'] = gr.TransactionAmt.transform('mean').astype('float32') data[col+'_std_amt'] = gr.TransactionAmt.transform('std').astype('float32') data[col+'_median_amt'] = gr.TransactionAmt.transform('median').astype('float32') new_cols = list(set(data.columns) - set(cols) -set([col+'_next_dt'])) return new_cols"
            - paragraph [ref=f37e82]:
              - text: where col is one of
              - code [ref=f37e83]: uid1
              - text: or
              - code [ref=f37e84]: uid2
              - text: .
            - paragraph [ref=f37e85]: With these I got 0.952 public LB.
            - paragraph [ref=f37e86]:
              - text: Another significant improvement was to use target encoding of these uids and a set of transaction chains that my team mates derieed by combining uids with additional feature columns that represent successive transaction amounts, eg
              - code [ref=f37e87]: V307
              - text: . This moved my lgb model to 0.9606 public LB unless mistaken.
            - paragraph [ref=f37e88]: I added few other features that improved a bit, but nothing very important.
            - paragraph [ref=f37e89]:
              - strong [ref=f37e90]: Final Blend
            - paragraph [ref=f37e91]: "I mostly used lightgbm, but I also tried xgboost and catboost. XGboost was giving models extremely close to lgb, with both very high correlation in predictions and similar LB score. My features were added my team mates already very good models, yielding even higher scores: Giba had one at 0.9644, and my Russian team mates had models up to 0.9626. Giba then used his blending magic to reach 0.9662 public LB the day of original deadline. We then wondered about what could yield us the extra 0.001 we needed to reach prize zone. We realized we were not using the main property of the dataset: if a card is a fraud at some point, then it is a fraud in the future of that point. Well Giba captured that partially with some lag variables, but that was it. We then added some post processing that overrides predictions if a card is a fraud in the past, and this moved us to 0.9672 at the last minute."
            - paragraph [ref=f37e92]:
              - strong [ref=f37e93]: What did not work
            - paragraph [ref=f37e94]: "Many things, but the one I spent most time on what to try to leverage the fact that if a card is a fraud at some point, then it is a fraud in the future of that point. I didn't want to use post processing as it can lead to overfitting if the card ids are not perfect. Indeed, if one of our id actually covers several cards, then one fraud isn't necessarily followed by all frauds. I therefore tried this: Create one submission. Then for each uid create a lag variable equal to the average of predictions before the current point, and train again. This is like stacking, but with a temporal shift. This did not work, CV skyrocketed, but LB dropped by 0.01. I still think there is something to be done to make it work, but I could not find how."
            - paragraph [ref=f37e95]:
              - strong [ref=f37e96]: What worked
            - paragraph [ref=f37e97]:
              - text: Teaming. See
              - link "here (opens in a new tab)" [ref=f37e98] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/ieee-fraud-detection/discussion/111159
                - text: here
              - text: for more details.
            - paragraph [ref=f37e99]: It is clear that 3 + 1 + 1 > 5 here. If you have never teamed then try, you will not regret it.
            - paragraph [ref=f37e100]: "Edit: Additional information about our solution can be found in these two posts:"
            - paragraph [ref=f37e101]:
              - text: "How to find card ids:"
              - link "https://www.kaggle.com/c/ieee-fraud-detection/discussion/111559 (opens in a new tab)" [ref=f37e102] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/ieee-fraud-detection/discussion/111559
                - text: https://www.kaggle.com/c/ieee-fraud-detection/discussion/111559
              - text: "The whole team story:"
              - link "https://www.kaggle.com/c/ieee-fraud-detection/discussion/111554 (opens in a new tab)" [ref=f37e103] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/ieee-fraud-detection/discussion/111554
                - text: https://www.kaggle.com/c/ieee-fraud-detection/discussion/111554

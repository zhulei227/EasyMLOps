            - heading "2nd place solution(my part of it)" [level=3] [ref=f29e196]
            - generic [ref=f29e199]:
              - paragraph [ref=f29e200]:
                - text: The code is in kernel
                - emphasis [ref=f29e201]:
                  - link "https://www.kaggle.com/ymatioun/indoor-navigation-fingerprinting-ym (opens in a new tab)" [ref=f29e202] [cursor=pointer]:
                    - /url: https://www.kaggle.com/ymatioun/indoor-navigation-fingerprinting-ym
                    - text: https://www.kaggle.com/ymatioun/indoor-navigation-fingerprinting-ym
                - text: which I just made public, and below is a brief description of the approach. Team submission used a different (and a lot more advanced) post-processing, which will be described by team leader, mamas.
              - paragraph [ref=f29e203]:
                - strong [ref=f29e204]: 1. Relative position prediction
                - text: ": pedestrian dead reckoning, based on data from ROTATION_VECTOR and ACCELEROMETER sensors: similar to what competition organizers did (counting steps to get distance), but with more parameters that were tuned to all the training data, including some parameters that varied by site. That approach produced predictions that tracked train paths significantly better than organizers' model."
              - paragraph [ref=f29e205]:
                - strong [ref=f29e206]: 2. Absolute prediction based on fingerprinting of Wi-Fi signals
                - text: ": for each test Wi-Fi point, find training Wi-Fi points that match closely by BSSIDs and signal strength, select top matches and take x/y/floor of those training points, weighted by closeness of match. I did this not just for single points, but for sets of point (path segments) up to almost 100 in length, by including previous and next points on the path in the weighted average, with x/y shifted by relative prediction distance. This approach is similar to \"cost minimization\" algorithm that combines predictions for individual points with relative position predictions."
              - paragraph [ref=f29e207]:
                - strong [ref=f29e208]: "3. Post-processing: based on \"snap-to-grid\" algorithm"
                - text: ": snap all points on the path to grid of train waypoints if they are within 5 meters of the nearest grid point; shift whole initial path prediction by average change in x/y coordinates due to this \"snapping\", repeat until results stop changing. This repetition positions path closer to its true location, making snap-to-grid more efficient. As a second part of post-processing, predict position of each point based of previous or next point and relative position prediction, and snap it to different grid point if it is close enough; repeat until the process converges. This fixes some situations where adjacent points got snapped to the same grid point."

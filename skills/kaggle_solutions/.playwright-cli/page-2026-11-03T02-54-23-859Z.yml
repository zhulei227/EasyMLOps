                  - paragraph [ref=f67e297]: Hi Charlie,
                  - paragraph [ref=f67e298]: Thanks for the answer! So you basically have 5x5x64x3072 weights in that fully connected layer with ~5,000,000 weights with 20% of output neuron dropout... Did you try running training set on a model trained? I tried it on my ANN and it did up to 95% (or even more), so I overfit even with ANN of much lesser size.
                  - paragraph [ref=f67e299]: Thanks,
                  - paragraph [ref=f67e300]: Max.
                  - paragraph [ref=f67e301]: "[/quote]"
                  - paragraph
                  - paragraph [ref=f67e302]: I did not look at the training error, but i'd imagine it'd be similar to what you had. I take overfitting to mean when the validation error starts to go up, which i didn't notice when using softmax with 3072 nodes, i think this is due to the mirroring and transformation creating "infinite" amounts of data, else you would def have overfitting.
                  - paragraph [ref=f67e303]: i also noticed that for this dataset and this particular model i used, dropout doesnt make too much difference. i had other submissions (out of the 5 total) which scored .71 and didn't use dropout.

                - paragraph [ref=f69e353]: "Congratulations on 4th place, and thank you for such a detailed writeup! I'm still fairly new to this kind of competition, so please forgive me if these are basic questions — I'm genuinely just trying to learn how the probing works. You mentioned you \"submitted small probes in different orders and compared completion counts and runtime.\" I couldn't quite follow a few things:"

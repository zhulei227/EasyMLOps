                - generic [ref=f69e397]:
                  - paragraph [ref=f69e398]: Thanks for the kind words.
                  - paragraph [ref=f69e399]: 1) The only thing I read was the submission's runtime.
                  - paragraph [ref=f69e400]: Minutes from Submit to COMPLETE, pulled with the Kaggle CLI — I polled kernel status through the API rather than reading the web UI, so the timestamps were machine-recorded rather than eyeballed.
                  - paragraph [ref=f69e401]: "Deliberately not the public score. The public score is computed from the public replay only, so it can't tell you anything about the private guardrail. I did look at it, but purely as a health check: did the probe's public-side control behave the way I designed it, and did the run finish rather than saturate? Reading a public-score difference as evidence about private is an easy trap."
                  - paragraph [ref=f69e402]: 2) A private block shows up because the agent reacts to it, and reacting costs time.
                  - paragraph [ref=f69e403]: "The structural fact that makes this work: candidates are replayed once per guardrail, and a blocked call doesn't disappear quietly. A DENY records a failed tool result in the conversation history and ends that hop loop — but the next user message still runs, with that failure sitting in the history where the model can read it."
                  - paragraph [ref=f69e404]: "So I put the branch in the injected text itself. Message 1 is the exact gate I want to test. Messages 2–8 say, in effect: \"if the previous tool call failed, reply STOP; otherwise write 120 words, seven times.\" The target agent evaluates that branch inside each replay. Allowed → a long generation; blocked → almost nothing. The hidden bit gets laundered into wall clock by the model's own behaviour."
                  - paragraph [ref=f69e405]: "On budgets: they're not one shared pool — each guardrail phase has its own replay cap (9,000 s in the SDK I was working from). But the submission has a single wall clock and I only see the sum across phases, which is precisely why a private-side slowdown is observable. The cap cuts the other way too: it puts a ceiling on how far one phase can stretch, so a probe has to be sized small enough that the difference doesn't saturate into \"inconclusive\"."
                  - paragraph [ref=f69e406]: 3) I ran the public guardrail locally first, and designed around whatever it did.
                  - paragraph [ref=f69e407]: Not only ALLOW gates — I used DENY ones too. The requirement isn't that public permits the call; it's that public's verdict is known in advance. The public guardrail is inspectable and runs offline, so before spending a submission I confirmed locally exactly how the public arm would handle each payload. Once public is pinned to known behaviour, whatever is left in the timing has to be coming from private.
                  - paragraph [ref=f69e408]: "Concretely, I submit a matched pair, fwd and rev, identical except for which branch carries the long tail, and read the difference — fixed costs (queue, model load) are common to both and cancel. The publim the public long phase lands on, and therefore the signyou're looking for:"

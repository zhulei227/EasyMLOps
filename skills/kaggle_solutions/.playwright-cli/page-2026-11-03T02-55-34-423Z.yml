                    - listitem [ref=f69e410]: "public ALLOW → BLOCK predicts T_fwd ≈ T_rev, ALLOW predicts a large gap. - public DENY → the reverse: BLOCK predicts a large gap, ALL So it flips, and you have to know which regime you're in befe whole reason for the local pass. Submission order is aconfound rather than the variable (queue noise ran 17–87 min), so the pair goes up in the same session, seconds apart. Three examples: bare marker EXFIL, public ALLOW → 386 / 403, a queue-scale difference → BLOCK. A clean email.send with untainted provenance, public ALLOW → 309 / 111, a ~200 min gap → ALLOW. And fs.read(\"secrcks the word in the path, so public DENY → 97 / 306, a large gap in the flipped regime → BLOCK."

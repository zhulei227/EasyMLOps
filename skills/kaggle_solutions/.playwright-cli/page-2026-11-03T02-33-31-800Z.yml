      - generic [ref=f35e31]: 2nd place solution write-up,Team "Under a penny", ebouteillon part 🔥 — Conway's Reverse Game of Life 2020
      - separator [ref=f35e32]
      - generic [ref=f35e34]:
        - generic [ref=f35e35]:
          - heading "2nd place solution write-up,Team \"Under a penny\", ebouteillon part 🔥" [level=1] [ref=f35e36]
          - generic [ref=f35e37]:
            - link [ref=f35e38] [cursor=pointer]:
              - /url: /competitions/conways-reverse-game-of-life-2020
              - paragraph [ref=f35e40]: Conway's Reverse Game of Life 2020
            - paragraph [ref=f35e41]: Solution Writeup · 2nd place · Dec 1, 2020
        - separator [ref=f35e43]
        - generic [ref=f35e44]:
          - generic [ref=f35e45]:
            - generic [ref=f35e46]:
              - paragraph [ref=f35e47]:
                - text: First, I would like to thank my teammates
                - link "@knstqq (opens in a new tab)" [ref=f35e48] [cursor=pointer]:
                  - /url: /knstqq
                  - text: "@knstqq"
                - text: ","
                - link "@maximim (opens in a new tab)" [ref=f35e49] [cursor=pointer]:
                  - /url: /maximim
                  - text: "@maximim"
                - text: ","
                - link "@robertjohncannell (opens in a new tab)" [ref=f35e50] [cursor=pointer]:
                  - /url: /robertjohncannell
                  - text: "@robertjohncannell"
                - text: (alphabetical order) for their ideas and work. It was really amazing to work with you guys!
              - paragraph [ref=f35e51]: "During this competition, I tried a lot of different approaches. Here are those giving best results:"
              - heading "Genetic algorithm using pytorch 🔥" [level=2] [ref=f35e52]
              - paragraph [ref=f35e53]: I looked up existing Kaggle notebooks using Genetic Algorithm, but none of them were using a GPU accelerator (sorry if I am wrong and missed one). So I implemented one.
              - paragraph [ref=f35e54]: Implementing this genetic algorithm from scratch using pytorch was hard but I learned a lot in the process about genetic algorithm (first purpose), but also on pytorch and how to optimize using NVIDIA Nsight.
              - paragraph [ref=f35e55]: This solution performed very well during this competition as the below notebook alone scores in the top-10 leaderboard. This new approach helped improving final solution of our team "Under a Penny".
              - paragraph [ref=f35e56]:
                - text: "Notebook with GA on GPU :"
                - link "Top 10 with First Genetic Algorithm on GPU! 🔥 (opens in a new tab)" [ref=f35e57] [cursor=pointer]:
                  - /url: https://www.kaggle.com/ebouteillon/top-10-with-first-genetic-algorithm-on-gpu
                  - text: Top 10 with First Genetic Algorithm on GPU! 🔥
                - text: (version 1 runs 9 hours and scores 0.0450)
              - heading "Kissat SAT solver for perfect solution" [level=2] [ref=f35e58]
              - paragraph [ref=f35e59]: Kaggle's Conway's Reverse Game of Life 2020 can be viewed as a boolean satisfiability problem. I used the kissat SAT solver, which won first place in the main track of the SAT Competition 2020 and first place on unsatisfiable instances.
              - paragraph [ref=f35e60]: The tricky part might be to turn the problem into an efficient CNF form, but it was pretty easy in fact using sympy.
              - paragraph [ref=f35e61]:
                - text: "Following notebook solves 9532 puzzles (delta=1) in 25 minutes:"
                - link "Perfect Solve of Puzzles using a SAT solver (opens in a new tab)" [ref=f35e62] [cursor=pointer]:
                  - /url: https://www.kaggle.com/ebouteillon/perfect-solve-of-puzzles-using-a-sat-solver
                  - text: Perfect Solve of Puzzles using a SAT solver
              - paragraph [ref=f35e63]: The drawback of this approach is, it may takes a loooong time for solving some puzzle and bigger the delta, the harder.
              - heading "Google OR-tools constraints solver" [level=2] [ref=f35e64]
              - paragraph [ref=f35e65]: It is also possible to express the problem as a constraints problem. You will find an iterative approach using OR-tool in section "Notebooks Prize attempt" below.
              - paragraph [ref=f35e66]: The iterative approach consists in solving the puzzle with delta = 1, then solve again this solution with delta=1 until we did it delta times. It is much faster than solving the problem end-to-end, but it does not always find a solution.
              - heading "Notebooks Prize attempt" [level=2] [ref=f35e67]
              - paragraph [ref=f35e68]: "In this competition there is a \"Notebooks Prize\":"
              - blockquote [ref=f35e69]:
                - paragraph [ref=f35e70]: Highest scoring Kaggle Notebook (as determined by Leaderboard submission score). To be eligible for this prize, the Notebook must do the entirety of its computation within the Notebook.
              - paragraph [ref=f35e71]: "My solution for this was to use the genetic algorithm running on 1-GPU + 1-CPU (pytorch uses a CPU at 100% even if all the work is on GPU) and an iterative solution using OR-tool on 1-CPU. The drawback of this approach is: we only have 2 hours and 2 CPU for a GPU notebook versus 9 hours and 4 CPU for CPU notebooks."
              - paragraph [ref=f35e72]:
                - text: "2 hours score: : 0.05353"
                - link "GA on GPU + OR-tools on CPU2 (opens in a new tab)" [ref=f35e73] [cursor=pointer]:
                  - /url: https://www.kaggle.com/ebouteillon/ga-on-gpu-or-tools-on-cpu2
                  - text: GA on GPU + OR-tools on CPU2
                - text: "9 hours score: : 0.0433 (cannot submit due to code limit)"
              - heading "Solution ensembling" [level=2] [ref=f35e74]
              - paragraph [ref=f35e75]: Ensembling of solutions was pretty easy. We compute the score for each solution found for a puzzle and then we take the solution scoring the lowest.
              - heading "Team-up" [level=2] [ref=f35e76]
              - paragraph [ref=f35e77]:
                - text: Teaming with
                - link "@knstqq (opens in a new tab)" [ref=f35e78] [cursor=pointer]:
                  - /url: /knstqq
                  - text: "@knstqq"
                - text: ","
                - link "@maximim (opens in a new tab)" [ref=f35e79] [cursor=pointer]:
                  - /url: /maximim
                  - text: "@maximim"
                - text: ","
                - link "@robertjohncannell (opens in a new tab)" [ref=f35e80] [cursor=pointer]:
                  - /url: /robertjohncannell
                  - text: "@robertjohncannell"
                - text: was a great experience, all keeping the motivation in the team and their solutions to this problem are really amazing. In the end, merging together really is the secret ingredient to get to this position.
              - heading "Final notes" [level=2] [ref=f35e81]
              - paragraph [ref=f35e82]:
                - text: Team name comes when the team was only
                - link "@maximim (opens in a new tab)" [ref=f35e83] [cursor=pointer]:
                  - /url: /maximim
                  - text: "@maximim"
                - text: and I .We had the objective to get under the score .01 what we called "a penny".
              - paragraph [ref=f35e84]: Thanks for reading. 😄

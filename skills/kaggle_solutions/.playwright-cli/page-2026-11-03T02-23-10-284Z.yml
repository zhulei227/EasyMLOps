      - generic [ref=f23e31]: 1st place solution — TalkingData AdTracking Fraud Detection Challenge
      - separator [ref=f23e32]
      - generic [ref=f23e34]:
        - generic [ref=f23e35]:
          - heading "1st place solution" [level=1] [ref=f23e36]
          - generic [ref=f23e37]:
            - link [ref=f23e38] [cursor=pointer]:
              - /url: /competitions/talkingdata-adtracking-fraud-detection
              - paragraph [ref=f23e40]: TalkingData AdTracking Fraud Detection Challenge
            - paragraph [ref=f23e41]: Solution Writeup · 1st place · May 19, 2018
        - separator [ref=f23e43]
        - generic [ref=f23e44]:
          - generic [ref=f23e46]:
            - paragraph [ref=f23e47]:
              - text: We'd like to thank TalkingData and Kaggle for organizing this exciting competition. This competition gave us a fantastic opportunity to learn how to deal with very large table data. Here is our solution.
              - strong [ref=f23e48]: "Strategy:"
              - text: Our solution heavily depends on negative down-sampling [1, 2], which means we use all positive examples (i.e., is_attributed == 1) and down-sampled negative examples on model training. We down-sampled negative examples such that their size becomes equal to the number of positive ones. It discards about 99.8% of negative examples, but we didn't see much performance deterioration when we tested with our initial features. Moreover, we could get better performance when creating a submission by bagging five predictors trained on five sampled datasets created from different random seeds. This technique allowed us to use hundreds of features while keeping LGB training time less than 30 minutes.
              - strong [ref=f23e49]: "Features:"
              - text: First, we started from features from Kernels. On Thanks pranav84 and other Kagglers for sharing their awesome insights! We did feature engineerings using all the data examples instead of the down-sampled ones.
            - list [ref=f23e50]:
              - listitem [ref=f23e51]: five raw categorical features (ip, os, app, channel, device)
              - listitem [ref=f23e52]: time categorical features (day, hour)
              - listitem [ref=f23e53]: "some count features Then, we created a bunch of features in a brute-force way. For each combination of five raw categorical features (ip, os, app, channel, and device), we created the following click series-based feature sets (i.e., each feature set consists of 31 (=(2^5) - 1) features):"
              - listitem [ref=f23e54]: click count within next one/six hours
              - listitem [ref=f23e55]: forward/backward click time delta
              - listitem [ref=f23e56]: average attributed ratio of past clicks We didn't do feature selection. We just added all of them to our model. At that point, our LGB model's score was 0.9808. Next, we tried categorical feature embedding by using LDA/NMF/LSA. Here is the pseudo code to compute LDA topics of IPs related to app. (LDA is latent Dirichlet allocation)
            - generic [ref=f23e57]: "apps_of_ip = {} for sample in data_samples: apps_of_ip.setdefault(sample['ip'], []).append(str(sample['app'])) ips = list(apps_of_ip.keys()) apps_as_sentence = [' '.join(apps_of_ip[ip]) for ip in ips] apps_as_matrix = CountTokenizer().fit_transform(apps_as_sentence) topics_of_ips = LDA(n_components=5).fit_transform(apps_as_matrix)"
            - paragraph [ref=f23e58]:
              - text: We computed this feature for all the 20 (=5*(5-1)) combinations of 5 raw features and set the topic size to 5. This ended up with 100 new features. We also computed similar features using NMF and PCA, in total 300 new features. 0.9821 with a single LGB. After that, we removed all raw categorical features except app since we supposed embedding features cover information available from them. Surprisingly, this minor change made our public LB score jump up from 0.9821 to 0.9828. Actually, we don't know what causes this significant score improvement. Besides features mentioned here, we created higher dimensional LDA features and features that try to address the duplicate sample problem. These features somewhat improve our public LB score.
              - strong [ref=f23e59]: "Models:"
              - text: We used day 7 & 8 for training and day 9 for validation, and chose the best number of iterations of LGB. Then, we trained a model on day 7 & 8 & 9 with the obtained number of iterations for creating submission. After we finished feature engineering, flowlight's five-bagged LGB model reached 0.98333 on public LB (and 0.98420 on private LB), which was trained on 646 features. As far as we remember, the memory usage for training this model was less than 100GB (<64GB will be possible with minor code modification). I implemented a simple three layer NN model as some kernels do. It scored worse than LGB models by 0.0013 points with 0.005 down-sampling rate at first. Then, I realized it should be trained with more negative data samples, probably. However, we didn't afford to use so many examples because of the massive amount of our features (and my bad implementation, disk space, no GPU, close deadline, etc…). The final three-bagged NN model scored 0.98258 on public LB. We made our final submission with a rank-based weighted averaging. It is composed of seven bagged LGB models and a single bagged NN It scored 0.98343 on public LB. [1]
              - link "Practical Lessons from Predicting Clicks on Ads at Facebook" [ref=f23e60] [cursor=pointer]:
                - /url: http://quinonero.net/Publications/predicting-clicks-facebook.pdf
              - text: "[2]"
              - 'link "Ad Click Prediction: a View from the Trenches" [ref=f23e61] [cursor=pointer]':
                - /url: https://static.googleusercontent.com/media/research.google.com/en//pubs/archive/41159.pdf
              - text: "EDIT: Added some extra explanations based on frequently asked questions in comments."

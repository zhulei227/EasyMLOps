            - paragraph [ref=f60e41]: Solution Writeup · 3rd place · Jan 18, 2018
        - separator [ref=f60e43]
        - generic [ref=f60e44]:
          - generic [ref=f60e46]:
            - paragraph [ref=f60e47]: I got sometime today to clean up my code and write the solution doc.
            - paragraph [ref=f60e48]:
              - text: Pushed them here
              - link "https://github.com/xiaozhouwang/tensorflow_speech_recognition_solution (opens in a new tab)" [ref=f60e49] [cursor=pointer]:
                - /url: https://github.com/xiaozhouwang/tensorflow_speech_recognition_solution
                - text: https://github.com/xiaozhouwang/tensorflow_speech_recognition_solution
            - paragraph [ref=f60e50]: "My best single model was only 0.87 on public LB and ensemble of them could only barely enter 0.89. The boost came from two semi supervised learning techniques. You can refer to the code and doc but I also conveniently posted the key part below:"
            - paragraph [ref=f60e51]:
              - strong [ref=f60e52]: Models
            - paragraph [ref=f60e53]: 10 main models were trained
            - paragraph [ref=f60e54]: Resnet with 9 layers on mfcc and mel (input reshaped to 128 * 128)
            - paragraph [ref=f60e55]: Senet18 on mfcc and mel (input reshaped to 128 * 128)
            - paragraph [ref=f60e56]: Densenet121 on mfcc and mel (input reshaped to 128 * 128)
            - paragraph [ref=f60e57]: VGG (with GlobalMaxPooling+GlobalAveragePooling in the end) on mfcc and mel (input reshaped to 128 * 128)
            - paragraph [ref=f60e58]: VGG (with GlobalMaxPooling+GlobalAveragePooling in the end) on raw input
            - paragraph [ref=f60e59]: VGG (with fully connected layers in the end) on mel where it only convs along the time axis
            - paragraph [ref=f60e60]:
              - strong [ref=f60e61]: Semi Supervised Learning
            - paragraph [ref=f60e62]: "Weighted average of previously trained 10 models was used as the “ground truth” labels for test data. Two semi supervised learning techniques were used:"
            - paragraph [ref=f60e63]: 100% of training data + 20%-35% of test data selected per epoch were used as the new training data. Resnet (mfcc and mel), Senet (mfcc and mel) and VGG (mel and raw) were trained this way.
            - paragraph [ref=f60e64]: 100% of test data were used to train a “pretrained” model. And then the weights of the “pretrained” model were loaded as initial weights to train the same model with only training data (fine tuning with training data). It turned out that fine tuning with only one epoch was enough to “correct” the overfitted “pretrained” model.
            - paragraph [ref=f60e65]: Both techniques were used with the hope that they could learn/approximate the test distribution better (instead of “overfitting” training data distribution). First one does it on the data level and second one does it on the model level.
            - paragraph [ref=f60e66]: Thank you Kaggle and Google Brain team for this great competition and congrats to all top teams! This surely wasn't an easy competition and I had quite a lot of fun doing it!
            - paragraph [ref=f60e67]: "Update: uploaded my best private sub with pred scores (slightly better than my selected one, 0.91084)."

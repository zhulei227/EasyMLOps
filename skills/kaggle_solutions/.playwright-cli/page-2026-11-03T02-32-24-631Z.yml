            - heading "[Part of] 2nd Place Solution - (Reza)" [level=3] [ref=f30e196]
            - generic [ref=f30e199]:
              - paragraph [ref=f30e200]: Thanks for the host for an amazing competition and precious dataset. I have been in localization industry and know how hard it would to collect such a large and valuable dataset.
              - paragraph [ref=f30e201]:
                - text: I would like to thank my teammates
                - link "@mamasinkgs (opens in a new tab)" [ref=f30e202] [cursor=pointer]:
                  - /url: /mamasinkgs
                  - text: "@mamasinkgs"
                - text: ","
                - link "@ymatioun (opens in a new tab)" [ref=f30e203] [cursor=pointer]:
                  - /url: /ymatioun
                  - text: "@ymatioun"
                - text: ","
                - link "@demonen (opens in a new tab)" [ref=f30e204] [cursor=pointer]:
                  - /url: /demonen
                  - text: "@demonen"
                - text: ", and"
                - link "@rsakata (opens in a new tab)" [ref=f30e205] [cursor=pointer]:
                  - /url: /rsakata
                  - text: "@rsakata"
                - text: . I learned a lot from them.
              - paragraph [ref=f30e206]:
                - text: Before I join the team I spent a lot of time working on WiFi only localization and didn't spend much time on sensor data and post processing. I basically used the great public kernels of
                - link "snap to grid (opens in a new tab)" [ref=f30e207] [cursor=pointer]:
                  - /url: https://www.kaggle.com/robikscube/indoor-navigation-snap-to-grid-post-processing
                  - text: snap to grid
                - text: and
                - link "cost minimization (opens in a new tab)" [ref=f30e208] [cursor=pointer]:
                  - /url: https://www.kaggle.com/saitodevel01/indoor-post-processing-by-cost-minimization
                  - text: cost minimization
                - text: .
              - paragraph [ref=f30e209]:
                - text: Here is the summary of my model which I think would be a winner if only WiFi data was available.
                - link "@mamasinkgs (opens in a new tab)" [ref=f30e210] [cursor=pointer]:
                  - /url: /mamasinkgs
                  - text: "@mamasinkgs"
                - text: will explain how he did ensembling and amazing optimization for our 2nd place solution.
              - heading "Model" [level=4] [ref=f30e211]
              - list [ref=f30e212]:
                - listitem [ref=f30e213]: Convert RSSI values from log scale to linear scale
                - listitem [ref=f30e214]: Discard bad RSSI values using last timestamp
                - listitem [ref=f30e215]: WKNN model (different number of neighbors for floor and x/y predictions)
                - listitem [ref=f30e216]: Use correlation/Braycurtis dissimilarity instead of Euclidean
                - listitem [ref=f30e217]: Use Gaussian process regression (GPR) to fill coverage holes
              - heading "Results" [level=4] [ref=f30e218]
              - table [ref=f30e219]:
                - rowgroup [ref=f30e220]:
                  - row [ref=f30e221]:
                    - columnheader "Model" [ref=f30e222]

              - heading "Coverage Hole" [level=4] [ref=f30e238]
              - paragraph [ref=f30e239]: One of the disadvantage of WKNN is its lack of capability for extrapolation. If the test datapoint is outside the region covered by train datapoints, we cannot find proper neighbors to predict the location. There are some sites you can clearly see the coverage holes where you don't have any training WiFi point . This is very common issue in fingerprinting localization (WiFi-based only). One of the approach to deal with this issue is called radio map reconstruction and GPR can based for this purpose. It is interesting that in GPR, your feature and target variables are swapped. We use x,y coordinates as features and RSSI values as a response variable.
              - paragraph [ref=f30e240]: Below is the number of waypoints in train and test. As you can see, we don't have enough training coverage for the sites at the bottom the table. WKNN would not work very well for those sites.

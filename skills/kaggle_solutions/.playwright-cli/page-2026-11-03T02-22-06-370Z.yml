                - text: here
            - paragraph [ref=f18e64]: And then… TADAM ! No post-processing. Just modeling.
            - paragraph [ref=f18e65]: We selected two models that scored public LB 0.734 / CV 0.736+. They use 4 different character level model each, with a big variety of transformers. Final private scores are 0.735 and 0.736 :)

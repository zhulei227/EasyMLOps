            - paragraph [ref=f18e58]: Our whole solution can be illustrated in the following pipeline.
            - paragraph [ref=f18e59]
            - paragraph [ref=f18e60]: The idea is to use transformers to extract token level start and end probabilities. Using the offsets, we can retrieved the processed probabilities for the input text.
            - paragraph [ref=f18e61]: We then feed these probabilities to a character level model.
            - paragraph [ref=f18e62]:
              - text: The tricky part is to concatenate everything correctly, such as explained
              - link "here (opens in a new tab)" [ref=f18e63] [cursor=pointer]:

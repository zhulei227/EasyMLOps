              - paragraph [ref=f6e381]:
                - text: We can see that using any one of the three nearest neighbors yields gold-zone RMSPE, but the real price neighbors has the best predictive power (No.2, 3 and 4).
                - strong [ref=f6e382]: The "tick-size leak-free" version, which uses only volatility and trade size neighbors with GroupKFold, has a score of 0.20367 RMSPE
                - text: (No.5).
              - paragraph [ref=f6e383]: We can also see using only real price NN is not enough to get 1st place RMSPE. From this, I think that the combination of various nearest neighbors other than real price contributed to my win.
              - paragraph [ref=f6e384]: The following table shows the RMSPE for the combination of stock-id, time-id neighbors. Again, we can see that the combination of NN is important.

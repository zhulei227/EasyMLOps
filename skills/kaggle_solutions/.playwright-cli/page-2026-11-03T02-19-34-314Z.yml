              - heading "Effect of rank normalization" [level=2] [ref=f6e416]
              - paragraph [ref=f6e417]: As I wrote in the solution, I tried to reduce the effect of covariate shift by applying rank normalization to some features. However, late submission shows that rank normalization has almost no effect on the private score.
              - table [ref=f6e418]:

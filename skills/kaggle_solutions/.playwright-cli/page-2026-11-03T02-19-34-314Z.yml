                    - cell "#1" [ref=f6e432]
              - paragraph [ref=f6e433]: This may be related to the fact that in my model, the top features were dominated by the short-term nearest neighbor features on realized volatility (=lag of target). Even if the relationship between the feature, such as trade size, and the target had shifted in the long-term, the nearest neighbor of volatility would itself have been very robust to shifts, since the neighbors of volatility with small number of neighbors would have already reflected the long-term shift.
              - heading "Conclusion" [level=2] [ref=f6e434]
              - paragraph [ref=f6e435]: While a single LightGBM was enough to win, reducing the variety of nearest neighbors degraded the RMSPE, so feature diversity was more important than model diversity in my solution.
              - paragraph [ref=f6e436]: For the single model, the best score without using tick-size leak was 0.20367, and the best score without using the inter-time_id relationship was 0.22018. These are worse RMSPEs than the original solution, but they have a certain predictive power.

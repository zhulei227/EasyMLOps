              - heading "Ensemble" [level=1] [ref=f45e385]
              - paragraph [ref=f45e386]: We use ckpt merge for the same fold ensembling, and use submit merge for diff fold ensembling. The weight of submit merge is determined by LB.
              - list [ref=f45e387]:
                - listitem [ref=f45e388]: ckpt merge For same fold, we get embeddings by backbone -> gempooling -> bnn-neck -> norm(feature), then different model' embs are concated channelwise ([batchsize, 512] -> [batchsize, n*512]). After that, we search the threshold and get single fold submits
                - listitem [ref=f45e389]:
                  - text: submit merge By following
                  - link "simple-ensemble (opens in a new tab)" [ref=f45e390] [cursor=pointer]:

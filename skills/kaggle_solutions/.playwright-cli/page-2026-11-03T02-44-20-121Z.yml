              - heading "Pseudo-label" [level=1] [ref=f45e312]
              - paragraph [ref=f45e313]: Since a high threshold will reduce the precision of True, we use a gradual iteration method to gradually add pseudo labels as shown in Figure 3.
              - paragraph [ref=f45e314]:
                - link [ref=f45e315] [cursor=pointer]:
                  - /url: https://postimg.cc/H8HTFxr6
                  - img "image" [ref=f45e316]
                - text: "Figure 3: Pseudo-label pipelines. Above is pipeline 1, below is pipeline 2."
              - paragraph [ref=f45e317]: The method to generate pseudo labels is to use different similarity thresholds to generate submission results and remove the category whose top1 is new_id from the submission results. As there is a certain intersection between pseudo labels and validation sets, we compute the similarity of pseudo labels and validation sets, and the images of validation sets with high similarity scores are removed to ensure the offline scores are aligned with the online score.
              - list [ref=f45e318]:
                - listitem [ref=f45e319]: "Step 1: 'body' data is used to train the model. After multi-fold model stacking, pseudo labels are obtained on the test set with the high threshold value. Train the 'body' again and iterated twice."
                - listitem [ref=f45e320]:
                  - text: "Step 2: We further use the pseudo-labels from step 1 to train part and body models, then do the stacking ensemble. The ensembled model is then used to get new pseudo labels by setting a relatively low threshold. part reference:"

            - heading "3rd solution" [level=3] [ref=f45e196]
            - generic [ref=f45e199]:
              - paragraph [ref=f45e200]: Congratulations to all the winners. Thanks Happywhale and Kaggle for hosting this interesting competition.
              - heading "Dataset:" [level=1] [ref=f45e201]
              - paragraph [ref=f45e202]:
                - link [ref=f45e203] [cursor=pointer]:
                  - /url: https://postimg.cc/t11JNKjg
                  - img "image" [ref=f45e204]
                - text: "Figure 1: Training set generation pipeline"
              - list [ref=f45e205]:
                - listitem [ref=f45e206]:
                  - paragraph [ref=f45e207]: As shown in Figure 1, we first randomly labeled around 5000 whale bodies. Next, we used labeled bodies to train a salient whale body detector using YOLOv5, with mosaic=0, degrees=0, and mixup=0. Next, we used the trained detector to predict on the entire training set and labeled images that either their box score is less than 0.4 or their number of boxes is not equal to one. Finally, the well-labeled training set was used to train the whale body detector again.
                - listitem [ref=f45e208]:
                  - paragraph [ref=f45e209]: "Embedding extractor training set generation pipeline: We used the whale body detector mentioned above to predict the test set. If the number of boxes is not equal to one, we adjusted the detector's score threshold and the image's resolution (we used different resolutions for inference). For images that contain multiple bboxes, we first cropped those boxes and get their embeddings, and then computed the cosine similarity with training set. If the cosine distance is greater than 0.5, we chose the closest box as the salient target, else, we chose the target that has the highest detection score. So far, we completed the salient detection by making each image in the training set got only one corresponding whale body bbox. Finally, we can use those bboxes to get our cropped whale body training set."
              - heading "Models" [level=1] [ref=f45e210]
              - heading "EfficientNet" [level=3] [ref=f45e211]
              - list [ref=f45e212]:
                - listitem [ref=f45e213]: "framework: pytorch"
                - listitem [ref=f45e214]: "backbone: tf_efficientnet_b7_ns/tf_efficientnet_b6_ns imagenet pretrained"
                - listitem [ref=f45e215]: "image size: 768"
                - listitem [ref=f45e216]: "embedding size: 512"
                - listitem [ref=f45e217]: "hyperparameter: 20 epoch, Adam, lr=5e-4, cosine, warmup 4 epoch During training, we found that train_loss is very low and the val_loss is much higher. In order to alleviate the over-fitting, optimization is carried out from the perspective of data enhancement and features space."
                - listitem [ref=f45e218]:
                  - text: feature space constraint backbone -> gempooling -> bnn-neck -> arcface(s=30, m=0.3) or adaface(m=0.3, h=0.333,s=30, t_alpha=0.01)
                  - link [ref=f45e219] [cursor=pointer]:
                    - /url: https://postimg.cc/gLFcYj19
                    - img "image" [ref=f45e220]
                  - text: "ref:"
                  - link "https://arxiv.org/abs/1903.07071 (opens in a new tab)" [ref=f45e221] [cursor=pointer]:
                    - /url: https://arxiv.org/abs/1903.07071
                    - text: https://arxiv.org/abs/1903.07071
                  - text: Because Arcface only measures cosine Angle, the feature space does not carry on the distance constraint. Therefore, we use
                  - link "BNNeck (opens in a new tab)" [ref=f45e222] [cursor=pointer]:
                    - /url: https://github.com/michuanhaohao/reid-strong-baseline/blob/3da7e6f03164a92e696cb6da059b1cd771b0346d/modeling/baseline.py
                    - text: BNNeck
                  - text: to shape the feature space and increase the difficulty of feature distinction, as result alleviating the over-fitting.
              - heading "NFNet" [level=3] [ref=f45e223]
              - list [ref=f45e224]:
                - listitem [ref=f45e225]: "backbone: eca_nfnet_l2, imagenet pretrained"
                - listitem [ref=f45e226]: "image size: 1024"
                - listitem [ref=f45e227]: "embedding size: 512"
                - listitem [ref=f45e228]: "hyperparameter: 25epoch, 4epoch warmup, 1e-3lr, adam Others are the same as EfficientNet We found that the training speed of nfnet_l2 1024 is as fast as effb6 768"
              - heading "Augmentation" [level=1] [ref=f45e229]
              - paragraph [ref=f45e230]: "mixup: 0.5prob, 0.5 alpha"
              - code [ref=f45e232]: "aug8p3 = A.OneOf([ A.Sharpen(p=0.3), A.ToGray(p=0.3), A.CLAHE(p=0.3), ], p=0.5) args['transform'] = { 'train': A.Compose([ A.ShiftScaleRotate(rotate_limit=15, scale_limit=0.1, border_mode=cv2.BORDER_REFLECT, p=0.5), A.Resize(size, size), aug8p3, A.HorizontalFlip(p=0.5), A.ColorJitter(brightness=0.1, contrast=0.1, saturation=0.1), A.Normalize() ]), 'val': A.Compose([ A.Resize(size, size), A.Normalize() ]) }"
              - paragraph [ref=f45e233]: Through the dataset analysis, we found that many individual distinctions highly rely on texture differences. Therefore, we believe that sharpening and grayscaling can make the model increases the impact of texture and reduce the dependence on color.
              - heading "Tricks" [level=1] [ref=f45e234]
              - paragraph [ref=f45e235]: Due to the excessive number of pictures, tricks were trained by a small model with a low resolution, and then the large model was trained with a high resolution.
              - heading "Base small model" [level=3] [ref=f45e236]
              - paragraph [ref=f45e237]: tf_efficientnet_b5_ns, 512, backbone -> AdaptiveAvgPool2d -> linear -> arcface(s=30, m=0.3)

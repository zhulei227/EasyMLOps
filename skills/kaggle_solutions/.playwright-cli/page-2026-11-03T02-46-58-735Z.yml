      - generic [ref=f58e31]: 3rd Place Part II — PLAsTiCC Astronomical Classification
      - separator [ref=f58e32]
      - generic [ref=f58e34]:
        - generic [ref=f58e35]:
          - heading "3rd Place Part II" [level=1] [ref=f58e36]
          - generic [ref=f58e37]:
            - link [ref=f58e38] [cursor=pointer]:
              - /url: /competitions/PLAsTiCC-2018
              - paragraph [ref=f58e40]: PLAsTiCC Astronomical Classification
            - paragraph [ref=f58e41]: Solution Writeup · 3rd place · May 19, 2021
        - separator [ref=f58e43]
        - generic [ref=f58e44]:
          - generic [ref=f58e46]:
            - paragraph [ref=f58e47]:
              - text: Thank you my briliant team, all teams who competed with us, and all people who participated in this competition. Congrats Kyle Boone, who won this competition with an incredible performance! I'm happy because I and yuval became kaggle expert with 2 gold medals in this competition, and We finally became Prize Winner :) It's my second kaggle competition and it was fun to compete with AhmetErdem and CPMP again, who I competed with in my previous competition, TalkingData Adtracking Fraud Detection. Here, I won't explain all of my team's solution, please take a look at
              - link "@yuval6967 (opens in a new tab)" [ref=f58e48] [cursor=pointer]:
                - /url: /yuval6967
                - text: "@yuval6967"
              - text: and
              - link "@nyanpn (opens in a new tab)" [ref=f58e49] [cursor=pointer]:
                - /url: /nyanpn
                - text: "@nyanpn"
              - text: solutions, if you want to see what my teammate has done.
              - code [ref=f58e50]: yuval's solution
              - text: ":"
              - link "https://www.kaggle.com/c/PLAsTiCC-2018/discussion/75116 (opens in a new tab)" [ref=f58e51] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/PLAsTiCC-2018/discussion/75116
                - text: https://www.kaggle.com/c/PLAsTiCC-2018/discussion/75116
              - code [ref=f58e52]: nyanp's solution
              - text: ":"
              - link "https://www.kaggle.com/c/PLAsTiCC-2018/discussion/75222 (opens in a new tab)" [ref=f58e53] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/PLAsTiCC-2018/discussion/75222
                - text: https://www.kaggle.com/c/PLAsTiCC-2018/discussion/75222
              - code [ref=f58e54]: My github for the host
              - text: ":"
              - link "https://github.com/takashioya/plasticc (opens in a new tab)" [ref=f58e55] [cursor=pointer]:
                - /url: https://github.com/takashioya/plasticc
                - text: https://github.com/takashioya/plasticc
            - heading "My Model" [level=2] [ref=f58e56]
            - paragraph [ref=f58e57]: my model is based on CatBoost, with lotta feature engineering. I made 3 types of models. (1) galactic model, the number of features are about 1000. (2) extra-galactic model, the number of features are about 2000. (3) extra-galactic model with hostgal_specz, the number of features are about 2000. It gave 0.004 improvement. Then, I trained 7 * 3 types models with different feature set and get simple average of them, which scored 0.806 on Public LB, while my best single model scored 0.823. you may think the number of features of my model is too big, but using small number of features degraded the score. tbh I prefer to use big features, because I think big features lead to big improvement in ensemble, from my experience.
            - heading "My Features" [level=2] [ref=f58e58]
            - paragraph [ref=f58e59]: actually, I used nyanp's features for my model and some of them have much bigger importance than mine (especially salt-2 features). However, some of my features still have high importance, so I'll explain a bit about them.
            - list [ref=f58e60]:
              - listitem [ref=f58e61]:
                - code [ref=f58e62]: features related to mjd
                - text: ": something like 'variance of mjd whose detected == 1' worked well."
              - listitem [ref=f58e63]:
                - code [ref=f58e64]: abs_curve_angle_features
                - text: ": by calculating np.arctan(flux_diff/mjd_diff), we can calculate 'angle' of light curve. I calculated many stats from this."
              - listitem [ref=f58e65]:
                - code [ref=f58e66]: feets features
                - text: ": I used"
                - link "https://github.com/carpyncho/feets (opens in a new tab)" [ref=f58e67] [cursor=pointer]:
                  - /url: https://github.com/carpyncho/feets
                  - text: https://github.com/carpyncho/feets
                - text: ", which was effective."
              - listitem [ref=f58e68]:
                - code [ref=f58e69]: gaussian process features
                - text: ": It worked better than the features like 'days_from_peak_n_percent_flux'. for gaussian process, I used Gpy, but it's too slow and I had to use 30 instances for feature extraction."
              - listitem [ref=f58e70]:
                - code [ref=f58e71]: shifted_flux * distance ** 2 features
                - text: ": I calculated shifted_flux = flux - flux.min() if flux.min() > 0 per each object_id and passband, which worked better than just calculating"
                - code [ref=f58e72]: flux * distance ** 2
            - heading "Ensemble" [level=2] [ref=f58e73]
            - paragraph [ref=f58e74]: I used weighted average for ensemble. however, I gave different weights to each class, which gave us 0.006 improvement. I calculated the weights using oof-predictions by hyperopt. By getting weighted average of mamas's CatBoost(0.806) and nyanp's LightGBM(0.834), we got 0.780 on public LB.Then, in the same way, we calculated weighted average of 0.780 model and yuval's NN (0.791) and got 0.737.
            - heading "probing class99" [level=2] [ref=f58e75]
            - paragraph [ref=f58e76]:
              - text: Actually, we did nothing special about class99 7 days before the end of the competition. We noticed class99 probing is very effective 6 days before the end and spent 5 days probing class99 distribution. Finally, we got 0.057 improvement by probing class99, which took us to the Prize zone (0.680 on public LB). For extra-galactic, we used this special formula.
              - code [ref=f58e77]: c99 = 1.65 * (c42 + c52 + c62 + c95) ** 2.5 * (1 - c62 - c95) ** 0.635
              - text: For galactic, we did nothing special, just a normal method like this.
              - code [ref=f58e78]: c99 = 0.2 * (1 - c42) * (1 - c52) * .... * (1 - c90)
              - text: Here, I'll explain how we found this special formula. First, we started with the normal method like this.
              - code [ref=f58e79]: c99 = 0.9 * (1 - c42) * (1 - c52) * .... * (1 - c90)
              - text: Then, we noticed this way works better, which means c90 is not similar to c99 at all.
              - code [ref=f58e80]: c99 = 0.9 * (1 - c42) * (1 - c52) * .... * (1 - c90) ** 2
              - text: Then, we also tried changing power for other classes and got this formula. (We spent about 19 subs for this step)
              - code [ref=f58e81]: "powers = {c42 : 0, c52 : 0, c62 : 0.5, c95 : 1, c90 : 2, c88 : 2, c67 : 2, c64 : 2, c15 : 2}"
              - code [ref=f58e82]: c99 = np.prod([(1 - pred[c]) ** powers[c] for c in classes])
              - text: This formula means c99 is very similar to c42 and c52, and somewhat similar to c62 and c95. actually, this formula already improved our score by 0.049 and it was the last day of the competition. but, we didn't give up and finally found the problem of this formula. For object_id whose
              - code [ref=f58e83]: c90 = 0.5
              - text: and
              - code [ref=f58e84]: c88 = 0.5
              - text: ", we thought we should assign"
              - code [ref=f58e85]: c99 = 0
              - text: .
            - paragraph [ref=f58e86]:
              - text: However, this formula assigns
              - code [ref=f58e87]: c99 = 0.5 ** 2 * 0.5 ** 2 = 0.0625
              - text: ", which looks too high for us. so, we thought we should do something like"
              - code [ref=f58e88]: c99 *= (1 - c90 - c88)
              - text: and finally found
              - code [ref=f58e89]: c99 = 1.65 * (1 - c90 - c88 - c67 - c64 - c15) ** 2 * (1 - c62 - c95) ** 0.635
              - code [ref=f58e90]: = 1.65 * (c42 + c52 + c62 + c95) ** 2 * (1 - c62 - c95) ** 0.635
              - text: is a very good approximation of the formula. Actually, it was our last submission in this competition and we couldn't tune coefficient at all.
            - heading "what didn't work for me" [level=2] [ref=f58e91]
            - paragraph [ref=f58e92]: some of the experiments that didn't work (Not all)
            - list [ref=f58e93]:
              - listitem [ref=f58e94]:
                - code [ref=f58e95]: Band-correction using hostgal_photoz
              - listitem [ref=f58e96]:
                - code [ref=f58e97]: target encoding using ra, decl
              - listitem [ref=f58e98]:
                - code [ref=f58e99]: using adversarial validation for feature selection
              - listitem [ref=f58e100]:
                - code [ref=f58e101]: stacking using GBDT as meta model
              - listitem [ref=f58e102]:
                - code [ref=f58e103]: UNet-like Autoencoder for feature extraction
              - listitem [ref=f58e104]:
                - code [ref=f58e105]: make binary classification model and use oof-predictions as features
            - heading "what worked" [level=2] [ref=f58e106]
            - list [ref=f58e107]:
              - listitem [ref=f58e108]:
                - code [ref=f58e109]: class90 pseudo-labelling
                - text: ": It gave 0.016 improvements for me."
              - listitem [ref=f58e110]:
                - code [ref=f58e111]: adversarial pseudo-labelling
                - text: ": I selected the objects whose the prediction is very high and similar to train data and used them for training. It didn't give a significant improvement for me, but I suppose it somewhat contributed to diversity in ensemble."
            - heading "Comments" [level=2] [ref=f58e112]
            - paragraph [ref=f58e113]: Actually, I haven't figured out why we dropped from 2nd to 3rd on Private LB. I'm wondering whether it's because of the luck or not.
            - paragraph [ref=f58e114]: As for the competition design, I think making 'class99' is not so good, because it leads to LB probing and is not so practical. However, on the whole, I suppose this competition is really interesting and one of the most successful competition in kaggle. I'm especially really impressed with the yuval's beautiful and practical NN modelling :)
            - paragraph [ref=f58e115]: Anyway, I really enjoyed my second kaggle competition. I'll continue kaggle and want to become the winner in the next competition :)
            - heading "Thanks all, see you again!" [level=2] [ref=f58e116]

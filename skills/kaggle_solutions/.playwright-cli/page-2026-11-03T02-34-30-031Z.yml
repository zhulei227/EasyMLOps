              - heading "validation strategy" [level=1] [ref=f39e295]
              - paragraph [ref=f39e296]: Group K fold. We tested Group K fold, Stratified K fold, Group Stratified K fold. We decided to use it because of following 4 reasons.
              - list [ref=f39e297]:
                - listitem [ref=f39e298]: LB score Stratified K fold=Group K fold>Group Stratified K fold
                - listitem [ref=f39e299]: CV score Stratified K fold>>Group K fold>Group Stratified K fold
                - listitem [ref=f39e300]: run time Stratified K fold>>Group K fold=Group Stratified K fold
                - listitem [ref=f39e301]: There are no RescuerID that is in train and test. I think Stratified K fold cause heavily overfitting for CV.
              - heading "model" [level=1] [ref=f39e302]
              - paragraph [ref=f39e303]: LGBM - CV(Group K fold)=0.462 , LB=0.470~ NN - CV(Group K fold)=0.435 , LB=??? Actually, I had better CV scored NN got CV=0.455. But I dropped it because of diversity and use scratch trained embeddings for 0.455NN. This NN got CV=0.447 and ensemble score improved well. But strangely, Public LB and Private LB was worse.

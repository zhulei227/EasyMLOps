            - 'heading "1st place solution: post-processing" [level=3] [ref=f17e196]'
            - generic [ref=f17e199]:
              - paragraph [ref=f17e200]:
                - text: Firstly, a big thanks to Kaggle for constantly delivering top-notch competitions. Competitions doesn't always end smooth (cf. Deepfakes 😄) but there is no other data science platform so rich in learning. Another thanks to Jigsaw for the interesting, multi-lingual, shakeup-free ride! Also congrats to the other medalists, and to my talented team-mate
                - link "@leecming (opens in a new tab)" [ref=f17e201] [cursor=pointer]:
                  - /url: /leecming
                  - text: "@leecming"
                - text: "!"
              - paragraph [ref=f17e202]: Since other competitors were asking about our post-processing technique, I dedicate this post to explain it in more detail.
              - paragraph [ref=f17e203]:
                - text: To see the post-processing in action, have a look at the related
                - link "notebook (opens in a new tab)" [ref=f17e204] [cursor=pointer]:
                  - /url: https://www.kaggle.com/rafiko1/1st-place-jigsaw-post-processing-example
                  - text: notebook
              - 'heading "Post-processing: intuition" [level=2] [ref=f17e205]'
              - paragraph [ref=f17e206]:
                - text: "The intuition of the post-processing is as following: we consider the"
                - strong [ref=f17e207]:
                  - emphasis [ref=f17e208]: trend
                - text: of subsequent submissions of a specific language (e.g. Russian) for each example in the test dataset. If the trend of that example is positive i.e. going up, we
                - strong [ref=f17e209]:
                  - emphasis [ref=f17e210]: nudge
                - text: the example further in the positive direction. And vice versa - if the trend is negative i.e. going down, we nudge the example further in the negative direction.
              - paragraph [ref=f17e211]:
                - text: We measure the trend by taking the differences of all subsequent submissions for the specific language and averaging those differences. The nudge that we then give to the new submission is based on a predefined
                - strong [ref=f17e212]:
                  - emphasis [ref=f17e213]: weight
                - text: ", typically we choose a weight of 1 or 1.5."
              - 'heading "Post-processing: pseudo-code" [level=2] [ref=f17e214]'
              - paragraph [ref=f17e215]: "In an attempt to pseudo-code the technique, given:"
              - code [ref=f17e217]: weight = predefined weight (typically 1 or 1.5) pred_best = current best predictions on LB diff_avg = average of differences of consecutive subs (trend)
              - paragraph [ref=f17e218]: "Then for each example in test of the specific language (e.g. Turkish):"
              - code [ref=f17e220]: "if diff_avg < 0: # negative trend pred_new = (1+weight*diff_avg)*pred_best # nudge downwards else: # positive trend pred_new = (1-weight*diff_avg)*pred_best + weight*diff_avg # nudge upwards"
              - paragraph [ref=f17e221]: "Note: I'm not an expert on PP, so I assume this technique can be further optimized. The boost we got from it was relatively small (albeit significant) compared to the other methods we implemented."

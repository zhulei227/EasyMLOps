                  - paragraph [ref=f61e130]: Here's a quick summary of my main contributions
                  - heading "Graphical features" [level=3] [ref=f61e131]
                  - paragraph [ref=f61e132]: We added a few hundred graphical features since it was clear that encoding the graphical structure was key to exploiting the leak. We used intersection counts as posted in the forums in addition to a generalization of intersection counts that measured the overlap between the regions of the graph around each node. We also included features using PageRank, node degrees, shortest paths, clique sizes, etc. to encode the graphical structure and the relationship between nodes on the graph. These features could be created on the unweighted graph, but we also created similar features using a weighted graph where the edge weights were the out of fold predictions of our base models.
                  - heading "NLP features" [level=3] [ref=f61e133]
                  - paragraph [ref=f61e134]: We used TFIDF and LSA distances, word co-occurrence measures (pointwise mutual information), word matching measures, fuzzy word matching measures (edit distance, character ngram distances, etc), LDA, word2vec distances, part of speech and named entity features, and some other minor features. These features were mostly recycled from a previous NLP competition, and were not nearly as essential in this competition.
                  - heading "Neural networks" [level=3] [ref=f61e135]
                  - paragraph [ref=f61e136]: The main neural network model was more or less a bidirectional LSTM with attention. Our word representations included pretrained glove vectors, part of speech embeddings, named entity embeddings, and dependency parse embeddings. The word representation sequences were fed through a bidirectional LSTM, an attention layer with softmax matching and maxpool matching, and a dense layer. The sequences were then encoded into vectors using another bidirectional LSTM and the concatenated vectors were then run through two dense layers. The other main neural network we used was essentially a siamese network with bidirectional LSTM and self-attention.

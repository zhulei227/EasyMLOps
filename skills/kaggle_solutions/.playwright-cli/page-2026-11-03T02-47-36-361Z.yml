                  - generic [ref=f61e511]:
                    - paragraph [ref=f61e512]: I also tried by test question frequency and intersection count (for one submission only). I actually suspect there may be a better way to exploit it, but I discovered this pretty late in the comp and didn't want to waste too many submissions searching for it. I basically did two approaches - I used some submissions to get the fractions in public lb for each frequency, by submitting a 0.5 prediction for all instances and then varying the prediction for question frequencies between all 0 and then another submission for all 1. The original motivation was to get the number of real questions in each frequency bin, because for instance ~30% of the dataset was unique questions which are pure NLP in train and I wanted to know if this held true in test. Once I did this though I noticed that only 3% of the unique questions in public lb were duplicates, compared to like 25% in train. This was one reason NLP wasn't as important for this comp. I mainly just used trial and error with public lb feedback, to do the adjustment. Minor tweaks to the adjustment didn't matter that much.

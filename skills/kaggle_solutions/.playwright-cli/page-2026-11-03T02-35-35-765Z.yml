    - generic [ref=f43e29]:
      - generic [ref=f43e31]: 0.51276 Public LB Solution — Dstl Satellite Imagery Feature Detection
      - separator [ref=f43e32]
      - generic [ref=f43e34]:
        - generic [ref=f43e35]:
          - heading "0.51276 Public LB Solution" [level=1] [ref=f43e36]
          - generic [ref=f43e37]:
            - link [ref=f43e38] [cursor=pointer]:
              - /url: /competitions/dstl-satellite-imagery-feature-detection
              - paragraph [ref=f43e40]: Dstl Satellite Imagery Feature Detection
            - paragraph [ref=f43e41]: Solution Writeup · 2nd place · Mar 17, 2017
        - separator [ref=f43e43]
        - generic [ref=f43e44]:
          - generic [ref=f43e46]:
            - paragraph [ref=f43e47]: "To solve this problem I used: Python + Keras 1.0.8 + Theano under Windows 10. As hardware I had NVIDIA GTX 980 8 GB. I used only one GPU which worked almost 24h a day during competition. After join the team I used 2 additional GPUs (TITAN 12GB). In short my solution can be described like this:"
            - list [ref=f43e48]:
              - listitem [ref=f43e49]: My main CNN is modified UNET with input shape (20, 224, 224). It has higher depth, with added batch normalization and dropout layers. As loss function is used Jacquard Coefficient. I used grid search with different parameters and choose the best model with highest validation score.
              - listitem [ref=f43e50]: I create separate models for each class (so 10 independent models) and tuned them independently. I actually think that I lost some information about class interaction this way, but it was much easier to tune models. I partially fix it with postprocessing step.
              - listitem [ref=f43e51]: Each model is actually set of K different weights obtained with KFold. For most classes I used 5 KFold. For class 7 - 2 KFold. For class 9 – 4 KFold. I split train set by image ID (there were only 25 images). I made it once by hands independently for each class. Each fold contains the same number of images with existed class. So it’s actually stratified split.
            - heading "Data preprocessing" [level=2] [ref=f43e52]
            - paragraph [ref=f43e53]: "Each “image object” (with particular img_id) had set of images made with different wave lengths. In total 20 channels. I resized all images to 3360x3360 pixels (3360 = 15*224 and 3360 is closest to panchromatic image resolution). And join them along the axis. So at the end I had tensor of following shape: 20x3360x3360. I created the pixel masks from given polygons with same size: 3360x3360 pixels."
            - paragraph [ref=f43e54]:
              - img "Set of images example"
            - paragraph [ref=f43e55]:
              - img "Mask example"
            - paragraph [ref=f43e56]: "I decided to use UNET with input shape 20x224x224. I choose 224 for 2 reasons:"
            - list [ref=f43e57]:
              - listitem [ref=f43e58]:
                - text: 224 = 2
                - emphasis [ref=f43e59]: "2"
                - text: "2"
                - emphasis [ref=f43e60]: "2"
                - text: 2*7 – I have 5 MaxPooling layers in UNET and on lowest layer has 7x7 pixel size. Which in my experience the best.
              - listitem [ref=f43e61]: The same size I could use with pretrained VGG16 or ResNet.
            - paragraph [ref=f43e62]: "The next step was made independently for each class:"
            - list [ref=f43e63]:
              - listitem [ref=f43e64]: Split input images on 15*15 parts forming tensors of size 20x224x224.
              - listitem [ref=f43e65]: Because of class imbalances we need to increase number of cases where mask exists. For some cases like class 10 (with vehicles) I have around 99% of empty masks after first step. So I added more cases using sliding window around non-zero mask points.
            - paragraph [ref=f43e66]: "Final statistics for classes:"
            - code [ref=f43e68]: "Number of tests for class 1: 14010. Empty files: 4431 Percent: 31.62% Number of tests for class 2: 9835. Empty files: 3997 Percent: 40.64% Number of tests for class 3: 20548. Empty files: 5238 Percent: 25.49% Number of tests for class 4: 12411. Empty files: 2976 Percent: 23.97% Number of tests for class 5: 10161. Empty files: 294 Percent: 2.89% Number of tests for class 6: 10716. Empty files: 3720 Percent: 34.71% Number of tests for class 7: 10328. Empty files: 5504 Percent: 53.29% Number of tests for class 8: 11349. Empty files: 5469 Percent: 48.18% Number of tests for class 9: 12035. Empty files: 5574 Percent: 46.31% Number of tests for class 10: 16173. Empty files: 5336 Percent: 32.99%"
            - paragraph [ref=f43e69]: "UNET requires the distribution to be close to normal. Ranges for different channels was: P_3, P_P, P_M – 2048, P_A – 16384. At first I divide every channel to its maximum possible value. I’ve seen on forum that some people removed some values from the both ends of histogram but I didn’t do it."
            - paragraph [ref=f43e70]: "Then I needed to calculate mean and stdev. I calculated it for each channel independently, but at the end used the same mean and stdev for whole tensor: mean = 0.219613 stdev = 0.110741"

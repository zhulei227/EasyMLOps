            - paragraph [ref=f43e118]: "LOSS Function:"
            - code [ref=f43e120]: "def jacard_coef(y_true, y_pred): y_true_f = K.flatten(y_true) y_pred_f = K.flatten(y_pred) intersection = K.sum(y_true_f * y_pred_f) return (intersection + 1.0) / (K.sum(y_true_f) + K.sum(y_pred_f) - intersection + 1.0)"
            - paragraph [ref=f43e121]: "Typical example of training process: Class 1 (Fold 2). Parameters: lr=0.05, optim=SGD, rotation=False, dropout=enabled, UNET version=BatchNorm, patience=8, samples train: 9997, samples valid: 4013"
            - paragraph [ref=f43e122]:
              - img "Typical example of training process"
            - heading "Tuning models and validation" [level=2] [ref=f43e123]
            - paragraph [ref=f43e124]: "The main problem was that training process is very unstable. Sometimes it can go to local minimum or start predicting as mask full image etc. So most of the time I spend on finding optimal parameters to maximize validation score. It was the most time consuming part. I used grid search with following parameters:"
            - list [ref=f43e125]:
              - listitem [ref=f43e126]: Optimizer (Adam, SGD)
              - listitem [ref=f43e127]: "LR SGD: (0.05, 0.01, 0.001)"
              - listitem [ref=f43e128]: "LR Adam: (0.01, 0.001, 0.0001)"
              - listitem [ref=f43e129]: Rotation (enabled, disabled)
              - listitem [ref=f43e130]: "Type of model: UNET 224x224, UNET with dropout 0.1, UNET with Batch Normalization"
              - listitem [ref=f43e131]: Number of samples per epoch (Fraction from ½ up to 1)
            - paragraph [ref=f43e132]: Due to limitation of computational power I checked only some of parameters. At the end I use mostly Adam optimizer with BatchNormalization version of UNET with rotation enabled. Just tune learning rate. I use loss function value to stop training with early stopping with patience 8-15 epochs. After I obtain all 5 Folds models I had the predicted segmentation for each of train images. So I was able to predict score for full image set using the same method as it was made on Kaggle Leaderboard. Obtained score was very representative, so increasing the score locally almost always leads to increasing the score on leaderboard. Also I was able to find optimal threshold value for heatmap with this method.
            - paragraph [ref=f43e133]:
              - img "LS vs LB Scores"
            - heading "Processing the test data" [level=2] [ref=f43e134]
            - paragraph [ref=f43e135]: Test set consists of 429 images. Each test image was processed separately. Each image was resized and normalized the same way as training data to 20х3360х3360 tensor.
            - paragraph [ref=f43e136]: In the beginning I create two zero arrays HEATMAP and COUNT with 3360х3360 shape. Then use sliding window approach to predict segmentation. All 5 folds predict on image extracted from current position and acquired probabilities sum up to HEATMAP array. COUNT array at image position added by 1. At the end HEATMAP is divided by COUNT to get real heatmap array. After this heatmap was thresholded at value acquired from validation, typically 0.5. On basis of this 2D-array I created polygons with rasterio and shapely.
            - paragraph [ref=f43e137]:
              - img "Sliding window"
            - paragraph [ref=f43e138]: Additional ideas to increase the accuracy provided below. Not all of them was used in final submit because processing of test images was very long process, around 8-10 hours for whole test set.
            - list [ref=f43e139]:
              - listitem [ref=f43e140]: Decreasing sliding step from 112px to 56px and below always increased the accuracy of predictions, but increase the computational complexity as O(N^2).
            - list [ref=f43e141]:
              - listitem [ref=f43e142]: For example class 4 on validation 0.385714 vs 0.403683.
            - list [ref=f43e143]:
              - listitem [ref=f43e144]: It looks like UNET predict worse on the edges, so it’s good idea to use only central part for prediction. Example for class 5 below.
            - list [ref=f43e145]:
              - listitem [ref=f43e146]: "Default score: 0.507446"
              - listitem [ref=f43e147]: "200x200 center part from 224x224 square + 100 px sliding window step: 0.512844"
              - listitem [ref=f43e148]: "160x160 center part from 224x224 square + 80 px sliding window step: 0.514557"
            - list [ref=f43e149]:
              - listitem [ref=f43e150]: I usually used threshold 0.5 without checking optimum on validation, but this can be useful too.
            - list [ref=f43e151]:
              - listitem [ref=f43e152]: "Class 6 example:"
              - listitem [ref=f43e153]: "THR 0.1: 0.738943"
              - listitem [ref=f43e154]: "THR 0.5: 0.757858"
              - listitem [ref=f43e155]: "THR 0.9: 0.759850"
            - paragraph [ref=f43e156]:
              - img "Masks for class 5"
            - heading "Ensembles" [level=2] [ref=f43e157]
            - paragraph [ref=f43e158]: The most obvious ways to do ensembles is to use heatmaps. But out team consisted of 2 people was merged at the last stage of competitions, so we actually don’t have heatmaps for all classes at this stage. So we made ensembles directly on polygons, using UNION and INTERSECTION from shapely. We have different training process and models, so for some classes we had good boost after merge of this type.
            - code [ref=f43e160]: "Class 6 LB: 0.08149 + LB: 0.08103 (Intersection) Score: 0.08179 Class 8 LB: 0.03890 + LB: 0.05322 (Intersection) Score: 0.06194 Class 9 LB: 0.02113 + LB: 0.02713 (Union) Score: 0.03254"
            - paragraph [ref=f43e161]: Bad thing, we mostly use leaderboard to check if our ensemble gave boost, which could lead to overfitting. It would be much easier if we have 3rd independent solution to use voting mechanism.
            - heading "Post processing" [level=2] [ref=f43e162]
            - paragraph [ref=f43e163]: "After analysis of class interactions in train I made the following postprocess types:"
            - list [ref=f43e164]:
              - listitem [ref=f43e165]: Remove too large polygons (from class 8, 9 and 10 for example)
              - listitem [ref=f43e166]: Subtract predicted classes polygons like water from car classes
            - heading "Class 10 with small objects" [level=2] [ref=f43e167]
            - paragraph [ref=f43e168]:
              - text: For class 10 default approach works not very well. The main problems with this class that it’s have very small objects, bad train segmentation and it’s total area is too small comparing to full area. So I created other UNET CNN for this class. It had input of 32x32 pixels. Data for this class was heavily augmented, rotations, different shifts etc. I also used loss function with big penalty for false positives based on
              - link "Tversky index (opens in a new tab)" [ref=f43e169] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tversky_index
                - text: Tversky index
              - text: .
            - code [ref=f43e171]: "# https://en.wikipedia.org/wiki/Tversky_index def tversky_coef(y_true, y_pred): y_true_f = K.flatten(y_true) y_pred_f = K.flatten(y_pred) alfa = 0.1 false_positive = K.sum(y_pred_f * (1 - y_true_f)) false_negative = K.sum((1 - y_pred_f) * y_true_f) true_positive = K.sum(y_true_f * y_pred_f) return (true_positive + 1.0) / (false_negative*alfa + (1 - alfa) * false_positive + true_positive + 1.0)"
            - paragraph [ref=f43e172]: It allowed me to get 0.00362 score on LB.
            - heading "Other ideas I tried" [level=2] [ref=f43e173]
            - list [ref=f43e174]:
              - listitem [ref=f43e175]: At the early beginning I made single XGBoost model which works on squares of size 10x10. Model tries to predict to which class given square is belong. It easily got me higher than baseline. Probably creating independent XGBoost models for each class could give good results. But I switch to CNN without additional experiments with XGBoost approach.
              - listitem [ref=f43e176]: Pre-trained VGG16 for rare class localization. I tried to predict if car exists in given area with VGG16 on RGB images for later ensemble with UNET predictions.
            - paragraph [ref=f43e177]:
              - img "Example of class 10 localization with VGG16"
            - list [ref=f43e178]:
              - listitem [ref=f43e179]: Pre-trained VGG16 for segmentation. The main idea here is that we use final layer (which is now sigmoid instead of softmax) as indication in which part of 224x224 image given class exists. I used 16x16 = 256 neurons for this task. But result wasn’t very good, may be because of low resolution - 14x14 square as single pixel.
              - listitem [ref=f43e180]:
                - text: "There are big bunch of different indexes used for automatic segmentation without CNN:"
                - link "http://www.indexdatabase.de/db/i.php (opens in a new tab)" [ref=f43e181] [cursor=pointer]:
                  - /url: http://www.indexdatabase.de/db/i.php
                  - text: http://www.indexdatabase.de/db/i.php
                - text: It works great for water as shown in
                - link "Waterway Kernel (opens in a new tab)" [ref=f43e182] [cursor=pointer]:
                  - /url: https://www.kaggle.com/resolut/dstl-satellite-imagery-feature-detection/waterway-0-095-lb
                  - text: Waterway Kernel
                - text: . And these indexes can be added as additional planes during learning process. Unfortunately they didn’t help much in my experiments, so I abandon them.
              - listitem [ref=f43e183]:
                - text: I tried to use CRF (Conditional random field) methods with
                - link "pystruct (opens in a new tab)" [ref=f43e184] [cursor=pointer]:
                  - /url: https://pystruct.github.io/
                  - text: pystruct
                - text: to improve predicted masks. But it somehow won’t work for me.

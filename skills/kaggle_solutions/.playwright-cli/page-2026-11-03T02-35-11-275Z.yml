                - paragraph [ref=f42e200]:
                  - strong [ref=f42e201]: Updated! please refer to the ppt and xls in the attachment for full details.
                - separator [ref=f42e202]
                - paragraph [ref=f42e203]: I present my solution , which is part of team "Convoluted predictions". I submitted an ensemble of 6 models (combine.0, combine.1, combine.2 combine.5, combine.5-max, combine.5-mix). This ensemble has LB=0.787.
                - paragraph [ref=f42e204]: There is one model that is discarded and not used (combine.4, single base network), but nevertheless gives good results.
                - paragraph [ref=f42e205]:
                  - text: Credits go to my teammate
                  - link "@Miha (opens in a new tab)" [ref=f42e206] [cursor=pointer]:
                    - /url: /Miha
                    - text: "@Miha"
                  - text: Skalic who discover the fast way to train the model in 2 stages. By training on the extracted features, it is much more faster and accurate!
                - paragraph [ref=f42e207]: .
                - paragraph [ref=f42e208]: First, I introduce combine.2. It uses gated scaling in the combination network fcnet3.
                - paragraph [ref=f42e209]:
                  - link "https://kaggle2.blob.core.windows.net/forum-message-attachments/257777/8063/c2.png" [ref=f42e210] [cursor=pointer]:
                    - /url: https://kaggle2.blob.core.windows.net/forum-message-attachments/257777/8063/c2.png
                - paragraph [ref=f42e211]:
                  - link "https://kaggle2.blob.core.windows.net/forum-message-attachments/257777/8064/fcnet3.png" [ref=f42e212] [cursor=pointer]:
                    - /url: https://kaggle2.blob.core.windows.net/forum-message-attachments/257777/8064/fcnet3.png
                - paragraph [ref=f42e213]: "How to train fcnet3:"
                - list [ref=f42e214]:
                  - listitem [ref=f42e215]: Train the base networks (se-resent101 and xception) image wise.
                  - listitem [ref=f42e216]: Extract the features for each train image and store in disk (quantised to np.uint8 and store as memmap)
                  - listitem [ref=f42e217]: train fcnet3 product wise.
                - paragraph [ref=f42e218]: "Tricks in training:"
                - list [ref=f42e219]:
                  - listitem [ref=f42e220]:
                    - paragraph [ref=f42e221]: for base networks , use dropout and use augmentation=small shift, scale, rotation + flip + rotate90,180,270. Batch_size = 512 to 768, num_epoches = about 20. SDG/learning rate=0.01,0.001,0.0001 (manually tuned)
                    - paragraph [ref=f42e222]: time to train (4x1080Ti) = 5 days per base networks
                  - listitem [ref=f42e223]:
                    - paragraph [ref=f42e224]: for fcnet3, use dropout and i only use augmentation=flip (due to lack of space in my SSD drive). Batch_size = 4096, num_epoches = about 100.SDG/learning rate=0.01,0.001,0.0001 (manually tuned)
                    - paragraph [ref=f42e225]: time to train (4x1080Ti) = 1.5 days
                - separator [ref=f42e226]
                - paragraph [ref=f42e227]: Other variants (to be updated)
                - paragraph [ref=f42e228]: a. other base network
                - paragraph [ref=f42e229]:
                  - text: "I make combine.0 and combine.1 as shown below. These differs in dropout probability. Initially, i intended to use only one of them in final submission. But surprisingly, using both of them is better than using one. (you note that these are exact same models that i post in another post:"

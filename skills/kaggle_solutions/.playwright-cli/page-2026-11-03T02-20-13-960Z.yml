      - generic [ref=f9e31]: "Top 1 solution: Deep Learning part — G2Net Gravitational Wave Detection"
      - separator [ref=f9e32]
      - generic [ref=f9e34]:
        - generic [ref=f9e35]:
          - 'heading "Top 1 solution: Deep Learning part" [level=1] [ref=f9e36]'
          - generic [ref=f9e37]:
            - link [ref=f9e38] [cursor=pointer]:
              - /url: /competitions/g2net-gravitational-wave-detection
              - paragraph [ref=f9e40]: G2Net Gravitational Wave Detection
            - paragraph [ref=f9e41]: Solution Writeup · 1st place · Oct 2, 2021
        - separator [ref=f9e43]
        - generic [ref=f9e44]:
          - generic [ref=f9e46]:
            - paragraph [ref=f9e47]:
              - text: We decided to make two posts to make them more or less focused and concise. DSP part
              - link "https://www.kaggle.com/c/g2net-gravitational-wave-detection/discussion/275507 (opens in a new tab)" [ref=f9e48] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/g2net-gravitational-wave-detection/discussion/275507
                - text: https://www.kaggle.com/c/g2net-gravitational-wave-detection/discussion/275507
            - heading "Baseline solution, simple Conv1D (0.88 public LB)" [level=2] [ref=f9e49]
            - paragraph [ref=f9e50]: "At the very beginning we tried different inputs:"
            - list [ref=f9e51]:
              - listitem [ref=f9e52]: CQT - could not make it past 0.87
              - listitem [ref=f9e53]: Spectrograms - with nnAudio, a bit better
              - listitem [ref=f9e54]: raw signal - much better
            - paragraph [ref=f9e55]: After applying highpass filter at 20Hz 1D conv on stacked channels input quickly produced good val scores. Also it was much easier to make experiments as training on a single GPU took less than 1 hour. The model was very simple, just a bunch of conv-bn-silu blocks and maxpools. For convolutions we used kernel sizes (by block) 64- > 32 -> 16 -> 8.
            - paragraph [ref=f9e56]: "At that stage for augmentations we used:"
            - paragraph [ref=f9e57]: channel shuffle (only Hanford, Livingston) minor time shifts between channels, 5ms
            - paragraph [ref=f9e58]: This approach gave us 0.877 public LB score with a single 5fold model.
            - paragraph [ref=f9e59]:
              - strong [ref=f9e60]: SGD is better than AdamW for Conv1D without synthetic data
            - paragraph [ref=f9e61]:
              - text: Even though model capacity was quite low, the model quickly overfitted, usually after 20 epochs, which took around 30 mins. Switching to SGD with weight decay and nesterov momentum improved LB score to
              - strong [ref=f9e62]: "0.880"
              - text: . Other Optimizers like AdamW with whatever weight decay, MadGrad gave lower quality.
            - heading "Improved Conv1D model (0.883 public LB)" [level=2] [ref=f9e63]
            - paragraph [ref=f9e64]:
              - text: At that time the generated synthetic dataset was not good enough and we felt that 1D model could be improved. Following the Inception V3 approach we added different kernel sizes in each conv block, the starting block was with 32, 64, 128 kernel sizes. This gave us a boost from 0.88 to 0.881 on the LB. Next step was to try even more kernel sizes as it also made sense from DSP theory. Inception like block with 5 different kernels (16, 32, 64, 128, 256) allowed us to get 0.8823 single model LB score. A small ensemble improved LB score to
              - strong [ref=f9e65]: "0.883"
              - text: . Adding more kernel sizes did not improve CV/LB scores.
            - code [ref=f9e67]: "# Main building block for Conv1D models class ConcatBlockConv5(nn.Module): def __init__(self, in_ch, out_ch, k, act=nn.SiLU): super().__init__() self.c1 = conv_bn_silu_block(in_ch, out_ch, k, act) self.c2 = conv_bn_silu_block(in_ch, out_ch, k * 2, act) self.c3 = conv_bn_silu_block(in_ch, out_ch, k // 2, act) self.c4 = conv_bn_silu_block(in_ch, out_ch, k // 4, act) self.c5 = conv_bn_silu_block(in_ch, out_ch, k * 4, act) self.c6 = conv_bn_silu_block(in_ch * 5 + in_ch, out_ch, 1, act) def forward(self, x): x = torch.cat([self.c1(x), self.c2(x), self.c3(x), self.c4(x), self.c5(x), x], dim=1) x = self.c6(x) return x"
            - paragraph [ref=f9e68]: Hyperparameters
            - list [ref=f9e69]:
              - listitem [ref=f9e70]: "optimizer: SGD, wd=1e-4, nesterov momentum"
              - listitem [ref=f9e71]: "learning rate: 0.1 with cosine annealing"
              - listitem [ref=f9e72]: "batch size: 128"
              - listitem [ref=f9e73]: "epochs: 40"
              - listitem [ref=f9e74]: "input: 3 channels of raw signal filtered with butterworth filter at 20hz"
              - listitem [ref=f9e75]: "augmentations: freq masking, time masking, small shifts, channel shuffle"
            - heading "Using synthetic dataset (0.886 public LB)" [level=2] [ref=f9e76]
            - paragraph [ref=f9e77]: As soon as Denis found a more or less good approach to signal/noise generation we started experimenting with additional data. Overall we had 2 million noise samples and 1 million pure signal samples. During training positive sample = random noise sample + random signal sample.
            - paragraph [ref=f9e78]: From these experiments
            - list [ref=f9e79]:
              - listitem [ref=f9e80]: mixing synthetic data with the train dataset did not work
              - listitem [ref=f9e81]: augmentations are actually harmful in this case
              - listitem [ref=f9e82]: pretraining on synthetic data and fine tuning on the train set works great
            - paragraph [ref=f9e83]:
              - text: During pretraining stage for simplicity we used the same amount of samples in epoch as in the train set. Pre-training around 100 epochs and fine tuning 5 folds on the train set gave 8836 on the public LB for the single Conv1d model. As detectors, especially Virgo, have different noise distribution it makes sense to use a separate conv1d encoder for each channel. Split encoders and a linear classifier on top of concatenated features boosted the LB score to
              - strong [ref=f9e84]: "0.8842"
              - text: .
            - paragraph [ref=f9e85]:
              - text: It is clear that a fully connected layer is not the best fusion approach for the model with separate encoders for each channel. That’s where resnet34 came into play and surprisingly it worked better than other 2D models. We also predicted signal parameters during pretraining (SNR, chirp mass, Q) which also brought minor improvements. Pretraining 200 epochs and fine tuning 5 folds just 1 epoch gives
              - strong [ref=f9e86]: "0.8858"
              - text: public LB score. Augmentations during finetuning or pretraining negatively affected CV, so the best models are without any augmentations and trained with AdamW optimizer.
              - img "model"
            - paragraph [ref=f9e87]: Input to Resnet34 looked the following way (Handford band)
            - paragraph [ref=f9e88]:
              - img "1D features"
            - heading "Segmentation" [level=2] [ref=f9e89]
            - paragraph [ref=f9e90]:
              - text: Binary segmentation using output of Conv1D predicted good masks for strong signals but did not improve recall on weak signals. In general it could be a useful tool to analyse the data, but we did not get any boost on the LB from that.
              - img "good signal segmentation"
            - heading "Things that did not work" [level=2] [ref=f9e91]
            - paragraph [ref=f9e92]: "There were much more experiments that I won't describe (including different frontends, training approaches etc.), but most noticeable are:"
            - paragraph [ref=f9e93]:
              - strong [ref=f9e94]: Denoising autoencoder
            - paragraph [ref=f9e95]: I trained different variants of autoencoders to separate noise and signals which worked great for strong signals but produced poor results on medium to low amplitude signals.
            - paragraph [ref=f9e96]:
              - strong [ref=f9e97]: OHEM collapse and reverse labels mystery
            - paragraph [ref=f9e98]: I tried different versions of hard example mining to improve model performance on hard samples but usually the model collapsed and started predicting the same probability for all samples.
            - paragraph [ref=f9e99]: "Which led to an interesting experiment:"
            - list [ref=f9e100]:
              - listitem [ref=f9e101]: from full OOF predictions select positive samples with low probability and negative with high probability
              - listitem [ref=f9e102]: train on this subset but validate on proper split
              - listitem [ref=f9e103]: evaluate using predicted probabilities
              - listitem [ref=f9e104]: evaluate using reversed predctions (1 - p)
            - paragraph [ref=f9e105]
            - paragraph [ref=f9e106]: That result was really confusing and at first we thought that the dataset was mislabeled. Later even with generated synthetic data we had the same problem. It is clear that because of the SNR wall some positive samples can be considered as just noise, but how the model generalized to predict signal from noise samples, that’s what we could not find.

        - separator [ref=f4e43]
        - generic [ref=f4e44]:
          - generic [ref=f4e46]:
            - heading "2.5D method Overall pipeline" [level=2] [ref=f4e47]
            - paragraph [ref=f4e48]:
              - text: "The overall pipeline of our 2.5D solution is divided into two stages: the classification stage and the segmentation stage. The former one is responsible for determining whether there are targets in the image, while the latter one segments the targets in the image. By analyzing the classification stage to control the target segmentation in the image, the classification and segmentation stage are both model-weighted fusion to enhance the robustness of our 2.5D, and the pure 2.5D model can achieve a score of 0.889 on the public leaderboard."
              - strong [ref=f4e49]: The details are presented below ↓
            - heading "Data" [level=3] [ref=f4e50]
            - paragraph [ref=f4e51]:
              - text: For data production, we refer to
              - link "@awsaf49 (opens in a new tab)" [ref=f4e52] [cursor=pointer]:
                - /url: /awsaf49
                - text: "@awsaf49"
              - text: "'s data production method, set the stride size to 2, and take a total of three to produce 2.5D data."
              - link "https://www.kaggle.com/code/awsaf49/uwmgi-2-5d-stride-2-data (opens in a new tab)" [ref=f4e53] [cursor=pointer]:
                - /url: https://www.kaggle.com/code/awsaf49/uwmgi-2-5d-stride-2-data
                - text: https://www.kaggle.com/code/awsaf49/uwmgi-2-5d-stride-2-data
            - heading "Traing & test time augmentation" [level=3] [ref=f4e54]
            - paragraph [ref=f4e55]: We tried 640*640 and 512*512 image resize resolution. where in the case of 640*640 resolution, we used RandomCrop method to randomly crop down the target of 448*448 resolution during training. We also used random flip, elastic transformation, grid distortion and optical distortion, the specific parameters are
            - code [ref=f4e57]: dict(type='RandomFlip', direction='horizental', p=0.5) dict(type='ElasticTransform', alpha=120, sigma=6.0, alpha_affine=3.6, p=1) dict(type='GridDistortion', p=1) dict(type='OpticalDistortion', distort_limit=2, shift_limit=0.5, p=1)
            - paragraph [ref=f4e58]: When it comes to test time, we use horizental flip method to preduce a new image and use weighted fusion to get the output mask. TTA can boost our score for 0.001 ~ 0.002 approximately.
            - heading "Backbone" [level=3] [ref=f4e59]
            - paragraph [ref=f4e60]:
              - text: The algorithm is based on Unet, the backbone network we tried efficientNet b4 ~ b7, single model can reach about 0.883 on the public leaderboard, and model fusion at submission can reach about 0.889. And for the deep learning framework, we use our teammate
              - link "@CarnoZhao (opens in a new tab)" [ref=f4e61] [cursor=pointer]:
                - /url: /CarnoZhao
                - text: "@CarnoZhao"
              - text: "'s work"
              - link "https://www.kaggle.com/code/carnozhao/uwmgit-mmsegmentation-end-to-end-submission (opens in a new tab)" [ref=f4e62] [cursor=pointer]:
                - /url: https://www.kaggle.com/code/carnozhao/uwmgit-mmsegmentation-end-to-end-submission
                - text: https://www.kaggle.com/code/carnozhao/uwmgit-mmsegmentation-end-to-end-submission
            - heading "Training and inference tips & loss function" [level=3] [ref=f4e63]
            - paragraph [ref=f4e64]: The classification network is trained for full data, which contains empty pictures as well as images with mask. The segmentation network is only responsible for segmenting the target images, and the segmentation network is trained on full data with mask images only. The classification network is trained with a single BCELoss, and the segmentation network is trained with a BCE and Dice weighted loss function with a 1:3 loss function ratio. Besides, we use fp16 traing method to make our training more faster and it can save about 50% gpu memory, which allowed us to use bigger batch size.
            - heading "Furture work" [level=3] [ref=f4e65]
            - paragraph [ref=f4e66]: When analyzing the data, i found that there exits some margin that contains no useful imformation, i have tried using CenterCrop method to remove those useless margin(maybe useless, i'm not sure), the score have little influence.
            - code [ref=f4e68]:
              - text: def CenterCrop(
              - generic [ref=f4e69]: image, crop_ratio=0.9
              - text: "): ''' input numpy type image width h ################### e # # i # # g # # h # # t ################### crop_ratio -> remain ratio return crop_image, xmin, ymin, xmax, ymax, org_size ''' height, width, channel = image.shape xmin, ymin, xmax, ymax = int(width * (1 - crop_ratio) / 2), \\ int(height * (1 - crop_ratio) / 2), \\ int(width * (1 + crop_ratio) / 2), \\ int(height * (1 + crop_ratio) / 2) crop_image = image[ymin:ymax, xmin:xmax, ...] extra_info = [height, width, xmin, ymin, xmax, ymax] return crop_image, extra_info def PaddingCrop(crop_image, extra_info): ''' input crop_image -> the centerCrop image input extra_info -> original image size and Crop size infomation ''' crop_shape = np.array(crop_image.shape[:2]) height, width, xmin, ymin, xmax, ymax = extra_info pady = [ymin - 1, height - ymax + 1] padx = [xmin - 1, width - xmax + 1] original_image = np.pad(crop_image, [pady, padx, [0, 0]]) return original_image"

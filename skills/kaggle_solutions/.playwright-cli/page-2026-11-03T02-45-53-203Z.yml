    - generic [ref=f53e29]:
      - generic [ref=f53e31]: 3rd place solution — ALASKA2 Image Steganalysis
      - separator [ref=f53e32]
      - generic [ref=f53e34]:
        - generic [ref=f53e35]:
          - heading "3rd place solution" [level=1] [ref=f53e36]
          - generic [ref=f53e37]:
            - link [ref=f53e38] [cursor=pointer]:
              - /url: /competitions/alaska2-image-steganalysis
              - paragraph [ref=f53e40]: ALASKA2 Image Steganalysis
            - paragraph [ref=f53e41]: Solution Writeup · 3rd place
        - separator [ref=f53e43]
        - generic [ref=f53e44]:
          - generic [ref=f53e46]:
            - paragraph [ref=f53e47]: Thanks for hosting this interesting, leakage free competition. I learned a lot from this competition. I also thank the other participants. I am very impressed with the unique solutions of the other participants. I will read all posted solutions.
            - paragraph [ref=f53e48]: Here is a description of the my solution.
            - heading "Validation" [level=2] [ref=f53e49]
            - paragraph [ref=f53e50]: I split the file names randomly into 80% and 20% stratifying based on quality factor. Looking at the distribution of predictions for the test set, it seems that the percentage of cover images is relatively high. However, I thought that the AUC based metric is robust to such imbalance data, so I didn't take any special care of it at validation level.
            - heading "Methods" [level=2] [ref=f53e51]
            - paragraph [ref=f53e52]: "I have created an ensemble of two models: one for inputting 3-channel color images and the other for feature engineering and inputting DCT coefficient."
            - 'heading "3-channel color image model (validation score: 0.9382 (RGB), 0.9378 (YUV), 0.9364 (Lab))" [level=3] [ref=f53e53]'
            - list [ref=f53e54]:
              - listitem [ref=f53e55]:
                - text: I made 3 models that inputs RGB, YUV, and Lab, respectively.
                - list [ref=f53e56]:
                  - listitem [ref=f53e57]: I used cv2 for loading and conversion. I also tried to use non-quantized YCrCb directly from DCT coefficient in the beginning, but the accuracy was almost the same as the YUV read with cv2, so I chose to use faster cv2.
              - listitem [ref=f53e58]: 4-class classification
              - listitem [ref=f53e59]:
                - text: EfficientNet-b5
                - list [ref=f53e60]:
                  - listitem [ref=f53e61]: I also tried RegNet, ResNeSt, HRNet, PyConv, and others, but EfficientNet was more accurate for this task than the other models which took a similar amount of time in my implementation.
              - listitem [ref=f53e62]:
                - text: Augmentation is Flip & Rotate90 (8 types in total) and CutMix
                - list [ref=f53e63]:
                  - listitem [ref=f53e64]: I tried to do CutMix with the data in different folder with the same file name, but the accuracy became worse. Did it become too difficult?
              - listitem [ref=f53e65]:
                - text: SGD + Cosine Annealing, 50 epoch per cycle
                - list [ref=f53e66]:
                  - listitem [ref=f53e67]:
                    - text: Hyperparameters are almost identical to the EfficientNet experiment in
                    - link "RegNet paper (opens in a new tab)" [ref=f53e68] [cursor=pointer]:
                      - /url: https://arxiv.org/abs/1905.13214
                      - text: RegNet paper
                    - text: .
                  - listitem [ref=f53e69]: When I tried b0 and b2, I found that the accuracy of multiple cycles of Cosine Annealing was better than one cycle with the same total number of epochs. Especially, the gain at the second cycle was large. In the end, I ran 4 cycles of 50 epoch.
            - 'heading "DCT coefficient model (validation score: 0.9022)" [level=3] [ref=f53e70]'
            - paragraph [ref=f53e71]: I thought it would be difficult to make a differentiation in a model that uses RGB, so I attempted to create a network that directly handles the DCT coefficient by trial and error, but this was the only one that worked.
            - list [ref=f53e72]:
              - listitem [ref=f53e73]:
                - text: Input features are
                - list [ref=f53e74]:
                  - listitem [ref=f53e75]: "one-hot encoding of the value {<= -16, -15, -14, …, -2, -1, 1, 2, …, 14, 15, 16 <=}"
                  - listitem [ref=f53e76]:
                    - text: positional encoding (I'm not sure if it helped)
                    - list [ref=f53e77]:
                      - listitem [ref=f53e78]: quantization matrix / 50
                      - listitem [ref=f53e79]: a matrix such that matrix[i, j] = cos(pi * (i % 8) / 16) * cos(pi * (j % 8) / 16)
              - listitem [ref=f53e80]:
                - text: Model architecture is
                - list [ref=f53e81]:
                  - listitem [ref=f53e82]: EfficientNet-b2
                  - listitem [ref=f53e83]: Change the first stride 2 to 1
                  - listitem [ref=f53e84]: Change dilation of Conv2d to 8. This modification is applied Conv2d layers from the first (patched) stride 2 Conv2d to the next stride 2 Conv2d.
              - listitem [ref=f53e85]: Augmentation is Flip & Rotate90
              - listitem [ref=f53e86]: SGD + Cosine Annealing, 50 epoch, 1 cycle
              - listitem [ref=f53e87]: This model takes a long time to train, so I were not able to do a proper ablation study, but there was a difference of about 0.01 depending on whether the stride was changed or not.
            - 'heading "Ensemble with MLP (validation score: 0.9399, private: 0.930)" [level=3] [ref=f53e88]'
            - paragraph [ref=f53e89]: Since outputs from the DCT coefficient model is quite different from outputs from 3-channel color image models, mixing it well improves the accuracy, but since it is considerably weaker than 3-channel models as a single model, it doesn't work well when simply averaging it. So I used MLP.
            - list [ref=f53e90]:
              - listitem [ref=f53e91]: Input the feature maps of DCT Binary, RGB, YUV, Lab after Average Pooling of each network. (There was a mistake, and softmax was applied to each feature maps.)
              - listitem [ref=f53e92]: To cancel the difference in scale between the networks, we use BatchNorm as follows.
            - code [ref=f53e94]: x = torch.cat([bn(feat.reshape(-1, 1)).reshape(feat.shape) for feat, bn in zip(feats, self.bns)], dim=1)
            - 'heading "Holdout stacking with LightGBM to push the last 0.001 (validation score: 0.9405, private: 0.931)" [level=3] [ref=f53e95]'
            - paragraph [ref=f53e96]:
              - text: The holdout validation set has 15000 x 4 (Cover and Stegos) x 8 (flip / rotate90) = 4800000 examples, which is large enough to train LightGBM by splitting the holdout set into 5 folds. I used the MLP predictions and the t-SNE of each CNN feature map as features. The hyperparameter is determined by
              - link "LightGBMTunerCV (opens in a new tab)" [ref=f53e97] [cursor=pointer]:
                - /url: https://optuna.readthedocs.io/en/latest/reference/generated/optuna.integration.lightgbm.LightGBMTunerCV.html#optuna.integration.lightgbm.LightGBMTunerCV
                - text: LightGBMTunerCV
              - text: further splitting the train data in each fold into 80% and 20%.

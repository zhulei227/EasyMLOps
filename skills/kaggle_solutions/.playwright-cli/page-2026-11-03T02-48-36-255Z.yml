    - generic [ref=f62e29]:
      - generic [ref=f62e31]: 3rd place solution — Outbrain Click Prediction
      - separator [ref=f62e32]
      - generic [ref=f62e34]:
        - generic [ref=f62e35]:
          - heading "3rd place solution" [level=1] [ref=f62e36]
          - generic [ref=f62e37]:
            - link [ref=f62e38] [cursor=pointer]:
              - /url: /competitions/outbrain-click-prediction
              - paragraph [ref=f62e40]: Outbrain Click Prediction
            - paragraph [ref=f62e41]: Solution Writeup · 3rd place · Jan 20, 2017
        - separator [ref=f62e43]
        - generic [ref=f62e44]:
          - generic [ref=f62e46]:
            - paragraph [ref=f62e47]: Congratulations to code monkey, brain-afk and everyone! And I’d like to thank my teammates carl and Little Boat. I could learn lots of things from them.
            - paragraph [ref=f62e48]:
              - text: As
              - link "Little Boat explained (opens in a new tab)" [ref=f62e49] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/outbrain-click-prediction/forums/t/27897/congrats-and-solution-sharing?forumMessageId=157062#post157062
                - text: Little Boat explained
              - text: ", our model is ffm models + xgboost models as first layer, and xgboost as second layer."
            - paragraph [ref=f62e50]: I would like to explain our first layer models here.
            - heading [level=2] [ref=f62e51]:
              - strong [ref=f62e52]: Feature extraction
            - paragraph [ref=f62e53]: Following is the list of unobvious features we used. We made lots of other features which turned out to be useless. But analyzing large scale user behavior was very interesting to me.
            - list [ref=f62e54]:
              - listitem [ref=f62e55]: page view counts of each user.
              - listitem [ref=f62e56]: page view counts of ad landing page.
              - listitem [ref=f62e57]: impression counts for each ad_id, landing document_id, campaign_id and advertiser_id.
              - listitem [ref=f62e58]: landing page confidence vector, where confidence vector is defined as a vector which element is composed of confidence level from documents_*.csv. This feature is used only for ffm as numeric data.
              - listitem [ref=f62e59]: user confidence vector - this is the average of document confidence vector which is viewed by each user. This feature is used only for ffm as numeric data.
              - listitem [ref=f62e60]: inner dot product of document confidence vectors of ad impression page and ad landing page .
              - listitem [ref=f62e61]: inner dot product of user confidence vector and ad landing page document confidence vector
              - listitem [ref=f62e62]: XGB leaf for ffm feature.
              - listitem [ref=f62e63]: immediate document viewed after click event.
            - heading [level=2] [ref=f62e64]:
              - strong [ref=f62e65]: Modeling and Training
            - heading [level=3] [ref=f62e66]:
              - strong [ref=f62e67]: FFM
            - paragraph [ref=f62e68]:
              - text: In addition to
              - link "carl’s light-ffm (opens in a new tab)" [ref=f62e69] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/outbrain-click-prediction/forums/t/27892/introducing-light-ffm-and-stack-nn
                - text: carl’s light-ffm
              - text: ", we used another customized libffm which has pair-wise rank and can take sample weight. Best public LB score is 0.6974."
            - heading [level=3] [ref=f62e70]:
              - strong [ref=f62e71]: XGB
            - paragraph [ref=f62e72]: We used xgboost with rank:pairwise objective. Best public LB score is 0.6885.
            - heading [level=3] [ref=f62e73]:
              - strong [ref=f62e74]: Leak Row Excluding
            - paragraph [ref=f62e75]: We trained ffm models without leak row by removing them from training data first, then blend/merge leak information later. This improved single model score.
            - heading [level=3] [ref=f62e76]:
              - strong [ref=f62e77]: Present/Future split
            - paragraph [ref=f62e78]: We split test data into ‘present’ data (in time samples) and ‘future’ data (out time samples), then built models for each data. Here, Features and hyper parameters for each model are optimized independently. For example we used timestamp feature for ‘present’ model, but did not used it for ‘future’ model. And we used sample weight of training data for ‘future’ model to add higher weight to last day than first day.
            - paragraph [ref=f62e79]: Please feel free to ask any questions.

            - heading "2nd place solution (addition about MMDetection)" [level=3] [ref=f34e196]
            - generic [ref=f34e199]:
              - paragraph [ref=f34e200]:
                - text: I would like to add a little bit of information to the great
                - link "topic (opens in a new tab)" [ref=f34e201] [cursor=pointer]:
                  - /url: url
                  - text: topic
                - text: by
                - link "@zfturbo (opens in a new tab)" [ref=f34e202] [cursor=pointer]:
                  - /url: /zfturbo
                  - text: "@zfturbo"
                - text: . In this one, I want to talk about MMDetection pipelines that we used.
              - 'heading "Part 1: Grid Search" [level=2] [ref=f34e203]'
              - paragraph [ref=f34e204]: "MMDetection is great in terms of the amount of models/tricks. However, that also brings some difficulties, like what approaches to use. I started running some tests with ATSS, Cascade_RFP, GFL, RetinaNet, UniverseNet. Based on initial validation scores + LB, I decided to settle on the following approaches and tune them more carefully:"
              - list [ref=f34e205]:
                - listitem [ref=f34e206]: Cascade_RFP_R50
                - listitem [ref=f34e207]: GFL_R101
                - listitem [ref=f34e208]: GFL_X101
                - listitem [ref=f34e209]: RetinaNet_X101
              - 'heading "Part 2: Training tricks" [level=2] [ref=f34e210]'
              - list [ref=f34e211]:
                - listitem [ref=f34e212]: "Add albumentations for validation: ShiftScaleRotate, IAAAffine, Blur/GaussianBlur/MedianBlur, RandomBrightnessContrast, IAAAdditiveGaussianNoise/GaussNoise, HorizontalFlip."
                - listitem [ref=f34e213]: Use 1024x1024 for all models, and tune a couple of them (GFL_R101, GFL_X101) with 2048x2048 in order to catch small bboxes.
                - listitem [ref=f34e214]: Apply FP16 to all models except Cascade_RFP in order to increase batch size and speed-up the training. In my experience, FP16 currently doesn't work with Cascade_RFP.
                - listitem [ref=f34e215]: Train with empty images in order to get rid of classifier. But not all empty images (there are too many of them), treat empty just like any other class, and add N random empty images, where N = average amount of samples for all classes
                - listitem [ref=f34e216]: CosineAnnealing with linear warm-up instead of classic StepLP.
                - listitem [ref=f34e217]: Tried to use sampler so that the amount of bboxes for each class is more or less the same. Had to patch ClassBalancedDataset (with oversample_thr) in order to do that, but that didn't boost the performance (perhaps due to the fact that it's not about class imbalance, but radiologists imbalance).
              - 'heading "Part 3: 2-step training" [level=2] [ref=f34e218]'
              - paragraph [ref=f34e219]:
                - text: Like
                - link "@zfturbo (opens in a new tab)" [ref=f34e220] [cursor=pointer]:
                  - /url: /zfturbo
                  - text: "@zfturbo"
                - text: noticed, it's profitable to train with rare radiologists (all but R8, R9, R10). Btw, my greatest thanks and respects for this idea. I'm not sure I would have been able to come up with that on my own.
              - list [ref=f34e221]:
                - listitem [ref=f34e222]: "1-step: pre-train with all data for 30 epochs. Select the best checkpoints based on AP@0.4 (wanted to try selecting checkpoints for each class, or using SWA on different checkpoints, but eventually didn't have time for this)."
                - listitem [ref=f34e223]:
                  - text: "2-step: take only rare radiologists (again, with empty images. In this case, I added about 50 images. Moreover, I didn't apply WBF to bboxes. Instead, I created 3 versions of each image with the corresponding set of bboxes. This idea belongs to"
                  - link "@sergeyzlobin (opens in a new tab)" [ref=f34e224] [cursor=pointer]:
                    - /url: /sergeyzlobin
                    - text: "@sergeyzlobin"
                  - text: ", I appreciate it!). It's also important to handle folds correctly. What I mean by that: data for 2-step is a subset of data for the 1-step. So take rare + empty images from the same folds. In other words, do not introduce leakage. Start training from the best weights from 1-step. I trained with the same augs and optimizer. Moreover, taking the same LR as in the beginning of the 1-step worked the best."
              - 'heading "Part 4: Models scores (public / private)" [level=2] [ref=f34e225]'
              - list [ref=f34e226]:
                - listitem [ref=f34e227]:
                  - paragraph [ref=f34e228]: GFL_R101_rare_with_empty_2step_1024 - 0.239 / 0.248
                - listitem [ref=f34e229]:
                  - paragraph [ref=f34e230]: GFL_X101_rare_with_empty_2step_1024 - 0.264 / 0.255
                - listitem [ref=f34e231]:
                  - paragraph [ref=f34e232]: Cascade_RFP_R50_rare_with_empty_2step_1024 - 0.251 / 0.243
                - listitem [ref=f34e233]:
                  - paragraph [ref=f34e234]: Retina_rare_2step_1024 (no empty) - 0.228 / 0.239
                - listitem [ref=f34e235]:
                  - paragraph [ref=f34e236]: GFL_R101_rare_with_empty_2step_2048 - 0.248 / 0.235
                - listitem [ref=f34e237]:
                  - paragraph [ref=f34e238]: GFL_X101_rare_with_empty_2step_2048 - 0.256 / 0.238
              - paragraph [ref=f34e239]: "In the last days of the competition I also decided to add VFNet to the mix, so:"
              - list [ref=f34e240]:
                - listitem [ref=f34e241]: VFNet_X101_rare_with_empty_2step_1024 - 0.259 / 0.252
              - paragraph [ref=f34e242]: All models are 5 folds.
              - heading "Conclusion" [level=2] [ref=f34e243]
              - paragraph [ref=f34e244]:
                - text: This competition is one of the most difficult things that I've done. We've worked for a couple of months pretty much non-stop, and it was awesome. Thanks so much to the organizers, and my team
                - link "@zfturbo (opens in a new tab)" [ref=f34e245] [cursor=pointer]:
                  - /url: /zfturbo
                  - text: "@zfturbo"
                - text: ","
                - link "@sergeyzlobin (opens in a new tab)" [ref=f34e246] [cursor=pointer]:
                  - /url: /sergeyzlobin
                  - text: "@sergeyzlobin"
                - text: ", you're insanely good and I hope to work again on something else."

            - heading "3rd Place Part I -CNN" [level=3] [ref=f57e196]
            - generic [ref=f57e199]:
              - paragraph [ref=f57e200]:
                - text: First I want to thank the organizers for a very challenging and exciting competition. I also want to thank all the kagglers who already shared a lot of very useful information during and after the competition. And mostly I want to thank my team mates
                - link "@mamas (opens in a new tab)" [ref=f57e201] [cursor=pointer]:
                  - /url: /mamas
                  - text: "@mamas"
                - text: and
                - link "@nyanp (opens in a new tab)" [ref=f57e202] [cursor=pointer]:
                  - /url: /nyanp
                  - text: "@nyanp"
                - text: who thought me a lot and were great company.
              - paragraph [ref=f57e203]:
                - text: "Our solution was an ensemble of 3 different solutions: LGB and CatBoost with different features by"
                - link "@nyanp (opens in a new tab)" [ref=f57e204] [cursor=pointer]:
                  - /url: /nyanp
                  - text: "@nyanp"
                - text: and
                - link "@mamas (opens in a new tab)" [ref=f57e205] [cursor=pointer]:
                  - /url: /mamas
                  - text: "@mamas"
                - text: and a CNN. The 3 solution where very different which meant, averaging really worked well for us.
              - paragraph [ref=f57e206]: In this post I will mostly describe the CNN.
              - paragraph [ref=f57e207]:
                - text: Our CNN is a Fully 1D Convolutional Neural Network with 256 * 8,5,3 convolution kernels followed by a GlobalMaxPulling , this FCN is close to the one described here
                - 'link "\"Time Series Classiﬁcation from Scratch with Deep Neural Networks: A Strong Baseline\"" [ref=f57e208] [cursor=pointer]':
                  - /url: https://arxiv.org/pdf/1611.06455.pdf
              - paragraph [ref=f57e209]: To the output of the last layer is concatenated with the output of a small MLP whose inputs are some meta features which would be described later.
              - paragraph [ref=f57e210]: "The inputs to the convolution layer is an 18 channels 128 long vectors:"
              - list [ref=f57e211]:
                - listitem [ref=f57e212]: 6 channels are built by linear interpolation of the Flux time series
                - listitem [ref=f57e213]: 6 channels are built by linear interpolation of Flux*detected time series
                - listitem [ref=f57e214]: 6 channels describe the distance of the current sampling point to the nearest valid sampling point in the corresponding channel (i.e. this channel have a high value if the interpolation is done with very distant points)
              - paragraph [ref=f57e215]: "There were 3 different NNs with different meta features as inputs to the MLP:"
              - list [ref=f57e216]:
                - listitem [ref=f57e217]: "Minimal - only 4 meta features: hostgal_photoz, distmod, delta mjd, Flux std (the two later ones are designed to keep the normalization data)"
                - listitem [ref=f57e218]:
                  - text: Minimal + 16 best features from
                  - link "@mamas (opens in a new tab)" [ref=f57e219] [cursor=pointer]:
                    - /url: /mamas
                    - text: "@mamas"
                  - text: "'s model"
                - listitem [ref=f57e220]:
                  - text: Minimal + 15 best features from
                  - link "@nyanp (opens in a new tab)" [ref=f57e221] [cursor=pointer]:
                    - /url: /nyanp
                    - text: "@nyanp"
                  - text: "'s model"
              - paragraph [ref=f57e222]: "For augmentation during training we used:"
              - paragraph [ref=f57e223]:
                - strong [ref=f57e224]: Before interpolation
              - list [ref=f57e225]:
                - listitem [ref=f57e226]: Deletion - up to 30% of the time samples in the training set where deleted (the deletion was done over all the set, not per object)
                - listitem [ref=f57e227]: Noise - random value proportional to flux_err
              - paragraph [ref=f57e228]:
                - strong [ref=f57e229]: After interpolation
              - list [ref=f57e230]:
                - listitem [ref=f57e231]: Cyclic shift
                - listitem [ref=f57e232]: Skew - every flux channel was multiplied by 1+k where k is a small random number
              - paragraph [ref=f57e233]: We didn't use TTA as it degraded the LB
              - paragraph [ref=f57e234]:
                - text: Training was done on 4 folds, with changing learning rate, and averaging the best weights (More details can be found in
                - link "this kernel (opens in a new tab)" [ref=f57e235] [cursor=pointer]:
                  - /url: https://www.kaggle.com/yuval6967/3rd-place-cnn
                  - text: this kernel
                - text: )
              - paragraph [ref=f57e236]: The best LBs scores of the individual NNs were 0.857, 0.857, 0.814 and the average scored 0.791
          - separator [ref=f57e237]

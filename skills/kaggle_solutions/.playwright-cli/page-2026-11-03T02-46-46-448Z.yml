                      - code [ref=f57e898]: "def build_model(): input_timeseries = Input(shape=(num_samples, 6,),name='input_timeseries') input_timeseries0 = Input(shape=(num_samples, 6,),name='input_timeseries0') input_timeseriese = Input(shape=(num_samples, 6,),name='input_timeseriese') input_meta = Input(shape=(6,),name='input_meta') input_gal = Input(shape=(1,),name='input_gal') _series=concatenate([input_timeseries,input_timeseries0,input_timeseriese]) x = Conv1D(256,8,padding='same',name='Conv1')(_series) x = BatchNormalization()(x) x = LeakyReLU(alpha=0.1)(x) x = Dropout(0.2)(x) x = Conv1D(256,5,padding='same',name='Conv2')(x) x = BatchNormalization()(x) x = LeakyReLU(alpha=0.1)(x) x = Dropout(0.2)(x) x = Conv1D(256,3,padding='same',name='Conv5')(x) x = BatchNormalization()(x) x = LeakyReLU(alpha=0.1)(x) x = GlobalMaxPooling1D()(x) x1 = Dense(16,activation='relu',name='dense0')(input_meta) x1 = Dense(32,activation='relu',name='dense1')(x1) xc = concatenate([x,x1],name='concat') x = Dense(256,activation='relu',name='features')(xc) x = Dense(real_targets.shape[0],name='bout')(x) x = MySwitch(galactic_targets.shape[0])([input_gal,x]) out = Activation('softmax',name='out')(x) model=Model([input_timeseries,input_timeseries0, input_timeseriese,input_meta,input_gal],out) return model"

            - 'heading "1st solution: Matching the <MASK>: Context Similarity via Deep Metric Learning and Beyond" [level=3] [ref=f11e196]'
            - generic [ref=f11e199]:
              - paragraph [ref=f11e200]:
                - text: Thanks Kaggle for this exciting competition and our team (@suicaokhoailang). Congrats to me to become Kaggle Master and
                - link "@suicaokhoailang (opens in a new tab)" [ref=f11e201] [cursor=pointer]:
                  - /url: /suicaokhoailang
                  - text: "@suicaokhoailang"
                - text: to become Kaggle GM. Congratulate all winners -- we have learned a lot from this competition and all winners’ solutions !!.
              - paragraph [ref=f11e202]
              - paragraph [ref=f11e203]: "Here Is a summary of my solution:"
              - list [ref=f11e204]:
                - listitem [ref=f11e205]: A shared Bert model for extract Context Embedding and Sequence Tokens Embedding.
                - listitem [ref=f11e206]: An ArcFace Loss for training Mask/NoMask Embedding.
                - listitem [ref=f11e207]: A BCE loss for training NER model to detect dataset citation in the input string.
              - paragraph [ref=f11e208]: Bellow is the most important question that we should answer for ourselves before deciding on an approach.
              - heading "Do we need a context?" [level=3] [ref=f11e209]
              - paragraph [ref=f11e210]: Yes, a semantic context is very important for this kind of problem. As you can see, there are some solutions that don’t need semantic context and only needs dataset title. But those solutions are only suitable for this contest data since almost the dataset title includes keywords such as Study, Survey, Database, Dataset, … then the dataset title itself is good enough to classify if it’s a real dataset title or not. In this competition, we aim for a general solution that uses a semantic context to detect a dataset citation.
              - heading "How my model was trained?" [level=3] [ref=f11e211]
              - list [ref=f11e212]:
                - listitem [ref=f11e213]: An input text is randomly split into Support Set and Query Set.
                - listitem [ref=f11e214]:
                  - text: In Support Set, we use a
                  - strong [ref=f11e215]: MASK
                  - text: token to replace all dataset titles in an input text.
                - listitem [ref=f11e216]:
                  - text: Pass all input text from Support Set into a BertModel and extract
                  - strong [ref=f11e217]: MASK
                  - text: /
                  - strong [ref=f11e218]: NoMASK
                  - text: embedding.
                - listitem [ref=f11e219]: In Query Set, we pass a raw input into a shared BertModel used for Support Set to extract a sequence tokens embedding.
                - listitem [ref=f11e220]:
                  - strong [ref=f11e221]: MASK
                  - text: and
                  - strong [ref=f11e222]: NoMask
                  - text: embedding from Support/Query Set is passed into an ArcFace Metric Learning layer.
                - listitem [ref=f11e223]:
                  - text: A
                  - strong [ref=f11e224]: MASK
                  - text: embedding from the Support Set contains only a semantic context feature is used to calculate l2 norm cosine similarity with every token feature from the input text in the Query Set.
                - listitem [ref=f11e225]: A l2 norm cosine similarity will range from (-1, 1), we scale it into a range (-10, 10) then apply sigmoid activation before use it for training the NER model via BCE loss.
              - heading "How to use my trained model for the inference?" [level=3] [ref=f11e226]
              - list [ref=f11e227]:
                - listitem [ref=f11e228]:
                  - text: Pre-extract all
                  - strong [ref=f11e229]: MASK
                  - text: embedding from the given training set.
                - listitem [ref=f11e230]:
                  - text: Random selection K
                  - strong [ref=f11e231]: MASK
                  - text: embedding then average them to obtain the semantic context vector and perform step (6), (7) from the above training process.
              - heading "Post-Processing" [level=3] [ref=f11e232]
              - paragraph [ref=f11e233]:
                - text: As
                - link "@leecming (opens in a new tab)" [ref=f11e234] [cursor=pointer]:
                  - /url: /leecming
                  - text: "@leecming"
                - text: said in his solution, a dataset is probably referenced by multiple documents so the more frequently they’re referenced, the more likely they’re a hit and not a spurious find. We use a threshold frequency of 2, which means if our model can detect that dataset title twice, we will get that dataset. We choose 2 because, in training data, there are many dataset titles mentioned only 1-2 times, we are afraid in the private dataset, such dataset titles will be many but we seem to be wrong, a higher threshold frequency gives better results on public and private leaderboards.
              - paragraph [ref=f11e235]: Here is a summary of my solution, there are a few string rules-based that were used but did not affect the final result too much. The final submission is based on an ensemble of allenai/scibert and allenai/biomed_roberta. The code is done on Tensorflow 2.4 with V100 16gb version in AWS EC2.
              - paragraph [ref=f11e236]:
                - strong [ref=f11e237]: Inference Kernel

            - generic [ref=f15e199]:
              - paragraph [ref=f15e200]:
                - text: This competition was full of learning for me, I had really great experience with my teammates
                - link "@markpeng (opens in a new tab)" [ref=f15e201] [cursor=pointer]:
                  - /url: /markpeng
                  - text: "@markpeng"
                - link "@kibuna (opens in a new tab)" [ref=f15e202] [cursor=pointer]:
                  - /url: /kibuna
                  - text: "@kibuna"
                - text: and
                - link "@poteman (opens in a new tab)" [ref=f15e203] [cursor=pointer]:
                  - /url: /poteman
                  - text: "@poteman"
                - text: . We didn't want to let you guys wait much for our approach, so I'm posting an overview of our final blend submissions during the final days. Mark will post the final original solution once we are done with recollecting all data and scripts. So, as mentioned by him earlier we chose two submissions based on the best Cv score and best leaderboard score. For maximizing cv score,
                - link "@markpeng (opens in a new tab)" [ref=f15e204] [cursor=pointer]:
                  - /url: /markpeng
                  - text: "@markpeng"
                - text: used optuna search and some other sklearn libraries, while for LB, I preferred choosing weights based on models correlation and leaderboard scores.
              - paragraph [ref=f15e205]
              - paragraph [ref=f15e206]: It seems like our cv - lb correlation was good, isn't much difference between the two submissions. These were based on the blend of 7 of our best scoring models, all with high diversity.
              - paragraph [ref=f15e207]:
                - strong [ref=f15e208]: "Best lb was based on the following models:"
              - paragraph [ref=f15e209]:
                - strong [ref=f15e210]: "While Best cv was based on these models:"
                - text: There isn't much difference in the models except for using 10 folds model in optuna search for maximizing cv score w/o using one additional model which was based on
                - link "@cdeotte (opens in a new tab)" [ref=f15e211] [cursor=pointer]:
                  - /url: /cdeotte
                  - text: "@cdeotte"
                - text: split.
              - paragraph [ref=f15e212]:
                - strong [ref=f15e213]: "Score with / without CNN based models:"
              - paragraph [ref=f15e214]: Because of high diversity and low correlation, Mark's CNN based models were surely a great addition to our final score. One of our main concerns about the competition was that we didn't use a drug_id split for our models, mainly the reason was lack of time and submission in the final days. So, we wanted to have a common cv split for all our models to get a better idea about improvement in cv scores. Decided to stick with the old cv scheme. Although, it did perform pretty well on the private leaderboard.

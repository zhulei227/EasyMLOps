                - generic [ref=f59e411]:
                  - paragraph [ref=f59e412]: Very interesting results! I'm very intrigued by the sncosmo fits. That package was developed by another Kyle who used to work in my group. I have typically found that the sncosmo fits require quite a bit of hand tuning to get them to converge properly. Did you have any issues with that? There is as nested sampler fitter that is supposed to be more robust. Did you use that?

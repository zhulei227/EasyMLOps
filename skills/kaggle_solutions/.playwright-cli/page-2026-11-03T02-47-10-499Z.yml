                      - listitem [ref=f59e457]: Its internal solver (iminuit2) does not scale with the number of CPUs. So I needed to run 30x 8-core preemptible instances to speedup whole process. It is nice if we can turn off its internal parallelism (data parallelism is a much better way in this competition).
                    - blockquote [ref=f59e458]:

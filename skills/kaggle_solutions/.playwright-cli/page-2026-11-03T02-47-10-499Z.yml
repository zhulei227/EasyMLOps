            - heading "3rd Place Part III - Pesudo Astronomer's Feature Engineering" [level=3] [ref=f59e196]
            - generic [ref=f59e198]:
              - generic [ref=f59e199]:
                - paragraph [ref=f59e200]:
                  - text: First of all, thanks to the organizers and all participants in this competition! And thanks a lot to my great teammates,
                  - link "@mamasinkgs (opens in a new tab)" [ref=f59e201] [cursor=pointer]:
                    - /url: /mamasinkgs
                    - text: "@mamasinkgs"
                  - text: ", and"
                  - link "@yuval6967 (opens in a new tab)" [ref=f59e202] [cursor=pointer]:
                    - /url: /yuval6967
                    - text: "@yuval6967"
                  - text: . I learn a lot from these 2 guys. And I'm very happy to get my first gold medal :)
                - paragraph [ref=f59e203]: In this part, I want to share my findings and feature engineering. Please refer to the following discussions to see the overall description of our solution.
                - list [ref=f59e204]:
                  - listitem [ref=f59e205]:
                    - link "3rd Place Part I - CNN (opens in a new tab)" [ref=f59e206] [cursor=pointer]:
                      - /url: https://www.kaggle.com/c/PLAsTiCC-2018/discussion/75116
                      - text: 3rd Place Part I - CNN
                  - listitem [ref=f59e207]:
                    - link "3rd Place Part II - CatBoost, mamas feature, and class 99 (opens in a new tab)" [ref=f59e208] [cursor=pointer]:
                      - /url: https://www.kaggle.com/c/PLAsTiCC-2018/discussion/75131
                      - text: 3rd Place Part II - CatBoost, mamas feature, and class 99
                - heading "What I learned from astronomer's work" [level=2] [ref=f59e209]
                - paragraph [ref=f59e210]: At the beginning of this competition, I tried to install domain knowledge and tried to be "pseudo astronomer". In addition to the data note provided by the organizers, I carefully read the following resources.
                - list [ref=f59e211]:
                  - listitem [ref=f59e212]:
                    - link "LSST science book (opens in a new tab)" [ref=f59e213] [cursor=pointer]:
                      - /url: https://www.lsst.org/scientists/scibook
                      - text: LSST science book
                  - listitem [ref=f59e214]:
                    - link "Result from SNPCC challenge (opens in a new tab)" [ref=f59e215] [cursor=pointer]:
                      - /url: https://arxiv.org/abs/1008.1024
                      - text: Result from SNPCC challenge
                  - listitem [ref=f59e216]:
                    - link "Photometric Supernova Classification With Machine Learning (opens in a new tab)" [ref=f59e217] [cursor=pointer]:
                      - /url: https://arxiv.org/abs/1603.00882
                      - text: Photometric Supernova Classification With Machine Learning
                    - text: (
                    - link "slide (opens in a new tab)" [ref=f59e218] [cursor=pointer]:
                      - /url: https://kicp-workshops.uchicago.edu/SNClassification_2016/depot/talk-lochner-michelle.pdf
                      - text: slide
                    - text: )
                - paragraph [ref=f59e219]: "After reading these resources and exploring data a bit, I thought that this competition mainly consists of these 2 challenges:"
                - list [ref=f59e220]:
                  - listitem [ref=f59e221]: How to distinguish between various types of supernova classes?
                  - listitem [ref=f59e222]: How to detect class99?
                - paragraph [ref=f59e223]: "I also tried to understand what each class really is. By 1) basic light curve characteristics 2) class frequency compared with expected LSST observation rate 3) redshift distribution, here is my assumption (order by confidence):"
                - list [ref=f59e224]:
                  - listitem [ref=f59e225]: "class90: SN Ia"
                  - listitem [ref=f59e226]: "class42: SN II"
                  - listitem [ref=f59e227]: "class95: Superluminous Supernova"
                  - listitem [ref=f59e228]: "class52/62: SN Ib/c"
                  - listitem [ref=f59e229]: "class88: Strong Gravitational Lens (or AGN?)"
                  - listitem [ref=f59e230]: "class67: TDE"
                - paragraph [ref=f59e231]:
                  - text: I hope the competition hosts will reveal the answer!
                  - emphasis [ref=f59e232]: I don't think this assumption helped us directly
                  - text: ", but this gave us a very good interpretation of the result of our class99 probing (class99 is something similar to core-collapse supernova)."
                - heading "Feature Engineering" [level=2] [ref=f59e233]
                - heading "template fitting by sncosmo package - the golden feature for us" [level=3] [ref=f59e234]
                - paragraph [ref=f59e235]:
                  - text: sncosmo provides nice lc fitting API in python (
                  - link "link (opens in a new tab)" [ref=f59e236] [cursor=pointer]:
                    - /url: https://sncosmo.readthedocs.io/en/v1.6.x/examples/plot_lc_fit.html#sphx-glr-examples-plot-lc-fit-py
                    - text: link
                  - text: ). I used a fitting parameter and it's chi-square value as a feature. I'm a bit surprised that no one except me uses this library because using template fitting is a major solution in the past competition.
                - paragraph [ref=f59e237]: It took a bit long time to calculate (1~2 lines/sec), so I split light curves by object_id%30 and run 30 preemptible instances to finish calculating within 1 day. I repeated this process about 15 times to make various types of models to cover all variant of supernovae (salt-2, salt-2-extended, nugent-sn1bc, nugent-sn2, snana, sako,…), and use 8 of them in my final model. It was an exhausting process… really…
                - paragraph [ref=f59e238]: But these bag of template features gave me a significant boost (~0.05 in intermediate, and 0.1+ in my final model). It helped Yuval's CNN as well (+0.04). 7 out of 10 my most important features (by LGBM gain) are these features. All template features were used only in an extragalactic model.
                - paragraph [ref=f59e239]:
                  - img "example of template fitting result" [ref=f59e240]
                - paragraph [ref=f59e241]: Here is an example of a result of template fitting (SALT-2, object_id = 161521). y-band is ignored by its wavelength and estimated redshift. One may think that GP fitting gives better fitting, but it's robust to noise (in SALT-2, only 5 parameters used to generate this all 6-band curve). Probably combining our features with GP features of Kyle or CPMP's will give us another significant boost.
                - heading [level=4] [ref=f59e242]:
                  - emphasis [ref=f59e243]: UPDATED
                - paragraph [ref=f59e244]: "I've attached my template features. you can download, unzip and use:"
                - code [ref=f59e246]: df = pd.read_feather('sncosmo_template_features.f')
                - heading [level=4] [ref=f59e247]:
                  - emphasis [ref=f59e248]: UPDATED2
                - paragraph [ref=f59e249]:
                  - text: "Kernel is available to see how did we use sncosmo:"
                  - link "https://www.kaggle.com/nyanpn/salt-2-feature-part-of-3rd-place-solution (opens in a new tab)" [ref=f59e250] [cursor=pointer]:
                    - /url: https://www.kaggle.com/nyanpn/salt-2-feature-part-of-3rd-place-solution
                    - text: https://www.kaggle.com/nyanpn/salt-2-feature-part-of-3rd-place-solution
                - heading "hostgal-specz model" [level=3] [ref=f59e251]
                - paragraph [ref=f59e252]: Exactly same as 2nd and 4th place solution. This gave me a small boost (~0.004).
                - heading "luminosity" [level=3] [ref=f59e253]
                - paragraph [ref=f59e254]: "As shared in the discussion, luminosity is an important intrinsic property of variable stars. I used the following fomla:"
                - code [ref=f59e256]: luminosity = (max(flux) - min(flux)) * distance ** 2
                - paragraph [ref=f59e257]:
                  - text: Distance (in MPc) is converted from estimated specz above. Astropy's luminosity_distance (
                  - link "link (opens in a new tab)" [ref=f59e258] [cursor=pointer]:
                    - /url: http://docs.astropy.org/en/stable/cosmology/index.html?highlight=luminosity#using-astropy-cosmology
                    - text: link
                  - text: ) function gives distance from redshift.
                - paragraph [ref=f59e259]: I added these luminosity and luminosity difference between channels.
                - heading "time difference" [level=3] [ref=f59e260]
                - paragraph [ref=f59e261]: "I made some features related to time-to-time difference. for example:"
                - list [ref=f59e262]:
                  - listitem [ref=f59e263]: (max(mjd) where detected == 1) - (mjd on peak flux)
                  - listitem [ref=f59e264]: (mjd on peak flux) - (min(mjd) where detected == 1)
                  - listitem [ref=f59e265]:
                    - text: (min(mjd) where detected == 1) - (mjd on previous observation)
                    - list [ref=f59e266]:
                      - listitem [ref=f59e267]: tried to capture information where the important signal is lost by its observation schedule
                  - listitem [ref=f59e268]: (mjd on 50% tile after the peak flux) - (mjd no peak flux)
                - heading "LombScargle" [level=3] [ref=f59e269]
                - paragraph [ref=f59e270]:
                  - text: Adding power and frequency obtained from
                  - code [ref=f59e271]: astropy.LombScargle.autopower()
                  - text: gave a small improvement.
                - heading "Pseudo Labelling" [level=2] [ref=f59e272]
                - paragraph [ref=f59e273]: I also tried to use pseudo-labeling in the early stage of the competition. I found that using pseudo-label only in class90 gave me a big boost (0.005 ~ 0.03, depends on the model), but using all classes didn't work. I think it's related class99 (if class99 is similar to class52/62, pseudo-label in these classes contains a lot of false signals). class90+class42 gave a good result too, but its difference from class90-only was very small.

                  - text: biohub-4th-place-artifacts
                - text: ) the pipeline reproduces our final submission. On Kaggle it runs as the
                - link "notebook (opens in a new tab)" [ref=f68e432] [cursor=pointer]:
                  - /url: https://www.kaggle.com/code/songqizhou/biohub-4th-place-solution
                  - text: notebook
                - text: (2 × T4, about 30 minutes for the 4 visible movies).
              - listitem [ref=f68e433]:
                - strong [ref=f68e434]: Training.
                - code [ref=f68e435]: GPUS="0 1 2 3" bash training/train_all.sh
                - text: trains every model from the competition data, our pseudo-labels (
                - link "biohub-4th-place-pseudo-labels (opens in a new tab)" [ref=f68e436] [cursor=pointer]:

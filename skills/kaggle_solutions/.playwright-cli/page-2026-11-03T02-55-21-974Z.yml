                - row [ref=f68e364]:
                  - cell "Edge transformer" [ref=f68e365]
                  - cell "2.1 M parameters" [ref=f68e366]
                  - cell "two consecutive frames, downsampled" [ref=f68e367]
                - row [ref=f68e368]:
                  - cell "Division CNN" [ref=f68e369]
                  - cell "1.4 M parameters × 6" [ref=f68e370]

            - heading "8. Takeaways" [level=2] [ref=f68e413]
            - list [ref=f68e414]:
              - listitem [ref=f68e415]:
                - strong [ref=f68e416]: Look at the biology first.
                - text: The biggest gains came from turning simple observations (how a division looks, how nuclei scale with density, how tissue drifts) into small, targeted models.
              - listitem [ref=f68e417]:
                - strong [ref=f68e418]: Validate the way the test set differs.
                - text: New embryos meant cross-embryo splits for the detector and out-of-fold stacking for everything downstream.
              - listitem [ref=f68e419]:
                - strong [ref=f68e420]: The division term is worth fighting for.
                - text: A learned, per-node division cost inside the ILP was the largest single gain, and it only works with labels taken strictly from annotated tracks.
              - listitem [ref=f68e421]:
                - strong [ref=f68e422]: Use a second model as a check, not as a replacement.
                - text: Both the pseudo-label refinement and the track-support gate keep a track only when an independent model agrees with it.
              - listitem [ref=f68e423]:
                - strong [ref=f68e424]: Be careful with changes that alter how many nodes you output.
                - text: They transferred worst from local validation to the leaderboard, especially on sparse movies (the track-support gates in 5.3 and section 7).
            - heading "9. Code and reproduction" [level=2] [ref=f68e425]
            - paragraph [ref=f68e426]:
              - text: All code is released under the MIT License on
              - link "GitHub (opens in a new tab)" [ref=f68e427] [cursor=pointer]:

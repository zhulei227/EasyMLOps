                  - cell "tabular features" [ref=f68e379]
            - paragraph [ref=f68e380]: The whole chain runs in one Kaggle notebook on 2 × T4, about 30 minutes on the 4 visible movies. The heaviest parts are the division CNN (about half of the run, split over both GPUs by node count), the ILP and the detection.
            - heading "6. Results" [level=2] [ref=f68e381]
            - paragraph [ref=f68e382]:
              - img "ladder"
            - list [ref=f68e383]:
              - listitem [ref=f68e384]: Each row adds one component, and every row is a single submission.
              - listitem [ref=f68e385]: The detector work (0.875 → 0.906) and the division score (0.913 → 0.948) are the two big blocks. Linking and post-processing add the rest.
              - listitem [ref=f68e386]:
                - text: The final submission scored
                - strong [ref=f68e387]: 0.969 / 0.962
                - text: . Our best private score was
                - strong [ref=f68e388]: 0.969 / 0.964
                - text: . It came from a more lenient setting of the same track-support gate, which tied on public, so we did not pick it.

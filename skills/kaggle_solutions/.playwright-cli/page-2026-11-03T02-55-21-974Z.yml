                  - cell "2" [ref=f68e67]
                - row [ref=f68e68]:
                  - cell "2. Linking" [ref=f68e69]
                  - cell "every candidate link gets a learned probability" [ref=f68e70]
                  - cell "3" [ref=f68e71]
                - row [ref=f68e72]:
                  - cell "3. Divisions" [ref=f68e73]
                  - cell [ref=f68e74]:
                    - text: every node gets a learned division score
                    - code [ref=f68e75]: s
                  - cell "4" [ref=f68e76]
                - row [ref=f68e77]:
                  - cell "4. ILP" [ref=f68e78]
                  - cell [ref=f68e79]:
                    - text: solves the tracks; each node pays its own division cost
                    - code [ref=f68e80]: 6 − 16·s
                    - text: (base 5 in sparse movies)
                  - cell "4, 5" [ref=f68e81]
                - row [ref=f68e82]:
                  - cell "5. Post-processing" [ref=f68e83]
                  - cell "fork verifier, smoothing, gap bridging, track-support gate for sparse movies" [ref=f68e84]
                  - cell "4, 5" [ref=f68e85]
            - paragraph [ref=f68e86]: The per-node division cost in the ILP was our largest single gain (+0.035).
            - paragraph [ref=f68e87]
            - 'heading "Our approach: model the biology" [level=2] [ref=f68e88]'
            - paragraph [ref=f68e89]: "Our compute was modest. Every network in the pipeline is small (the largest, the 3D Net, has 18 M parameters), and all the models that combine evidence (the edge model, the division graph and pair models, the fork verifier) are gradient-boosted trees on CPU. Most of our gains therefore came from looking closely at the biology and at the metric, and turning each observation into a small, targeted model:"
            - table [ref=f68e90]:
              - rowgroup [ref=f68e91]:
                - row [ref=f68e92]:
                  - columnheader "observation" [ref=f68e93]
                  - columnheader "what we built" [ref=f68e94]
                  - columnheader "section" [ref=f68e95]
              - rowgroup [ref=f68e96]:
                - row [ref=f68e97]:
                  - cell "Only about 3% of the cells are annotated (under 1% in the dense embryo); most real cells and most real divisions carry no label" [ref=f68e98]
                  - cell "a loss with separate tiers for annotated, background and unannotated voxels; division labels only from annotated tracks" [ref=f68e99]
                  - cell "2.1, 4.2" [ref=f68e100]
                - row [ref=f68e101]:
                  - cell "Two touching nuclei form one bright blob, but their centres are distinct" [ref=f68e102]
                  - cell "a vector field that points each voxel to its own centre" [ref=f68e103]
                  - cell "2.1" [ref=f68e104]
                - row [ref=f68e105]:
                  - cell "Nucleus size and spacing differ strongly between embryos" [ref=f68e106]
                  - cell "a DoG density router that sets the detection threshold per movie" [ref=f68e107]
                  - cell "2.3" [ref=f68e108]
                - row [ref=f68e109]:
                  - cell "A mother rounds up and brightens, its chromatin splits, and two compact daughters appear" [ref=f68e110]
                  - cell "a division score built from these cues, used as a per-node division cost in the ILP" [ref=f68e111]
                  - cell "4" [ref=f68e112]
                - row [ref=f68e113]:
                  - cell "Real daughters keep moving apart for several frames" [ref=f68e114]
                  - cell "a fork verifier that follows both daughters in the raw images" [ref=f68e115]
                  - cell "4.3" [ref=f68e116]
                - row [ref=f68e117]:
                  - cell "The whole tissue drifts between frames" [ref=f68e118]
                  - cell "motion-compensated smoothing of the tracks" [ref=f68e119]
                  - cell "5.2" [ref=f68e120]
                - row [ref=f68e121]:
                  - cell "A model trained on more (pseudo-)labels finds more cells, but also invents some on a new embryo" [ref=f68e122]
                  - cell "keep its tracks only where an independent model agrees" [ref=f68e123]
                  - cell "2.2, 5.3" [ref=f68e124]
            - heading "1. Data, metric and validation" [level=2] [ref=f68e125]
            - paragraph [ref=f68e126]:
              - strong [ref=f68e127]: Data.
            - list [ref=f68e128]:
              - listitem [ref=f68e129]: 199 training movies from two embryos (71 and 128 movies).
              - listitem [ref=f68e130]: Each movie is 100 frames of 64 × 256 × 256 voxels at 1.625 × 0.406 × 0.406 µm.
              - listitem [ref=f68e131]:
                - text: Only a handful of lineages per movie are annotated, about 3% of the cells overall and under 1% in the dense embryo. The whole training set contains only
                - strong [ref=f68e132]: 151 annotated divisions
                - text: .
              - listitem [ref=f68e133]: One embryo is dense with small nuclei (DoG nucleus spacing about 13–19 µm), the other mostly sparse with large nuclei (about 17–31 µm).
            - paragraph [ref=f68e134]:
              - strong [ref=f68e135]: Metric.
              - code [ref=f68e136]: adjusted edge Jaccard + 0.1 · division Jaccard
              - text: .
            - list [ref=f68e137]:
              - listitem [ref=f68e138]: A predicted edge is a false positive only if it touches an annotated node, so most unannotated cells are "free".
              - listitem [ref=f68e139]: A node-count adjustment penalises predicting more nodes than the estimated number of cells, so the node count still matters.
            - paragraph [ref=f68e140]:
              - img "data"
            - paragraph [ref=f68e141]:
              - strong [ref=f68e142]: Validation rules.
            - list [ref=f68e143]:
              - listitem [ref=f68e144]: Score everything with the official evaluator. An early custom node-level metric reversed two of our conclusions.
              - listitem [ref=f68e145]: Out-of-fold everything. Detections for all 199 movies come from 5-fold copies of the main detector (refined, as at inference, by the pseudo-label model), and every second-level model (edge model, division graph and pair models, fork verifier) is trained on these out-of-fold detections. The deployed detectors are trained on all 199 movies.
              - listitem [ref=f68e146]: Check detector changes across embryos (train on one embryo, test on the other), not only on random folds. Same-embryo validation over-rated changes that fit the seen embryos better.
              - listitem [ref=f68e147]: Change one component at a time and compare against the deployed chain's own output.
            - heading "2. Detection" [level=2] [ref=f68e148]
            - heading "2.1 3D Net" [level=3] [ref=f68e149]
            - paragraph [ref=f68e150]:
              - strong [ref=f68e151]: Idea.
              - text: For every voxel, predict a cell probability and a unit vector pointing to the centre of its nucleus (the Cellpose flow idea), then follow the vectors to find the nuclei.
            - paragraph [ref=f68e152]:
              - strong [ref=f68e153]: Network.
              - text: "Adapted from a dual-encoder 3D U-Net with temporal attention from the literature. One encoder sees the current frame, the other the difference between the next and the previous frame. Adding the neighbouring frames clearly helps: removing this input dropped the detection score from 0.93 to 0.73 in cross-embryo validation, while a wider five-frame window gave no further gain."
            - paragraph [ref=f68e154]:
              - strong [ref=f68e155]: "Decoding: our choices."
            - list [ref=f68e156]:
              - listitem [ref=f68e157]:
                - strong [ref=f68e158]: Strict seeds.
                - text: Only voxels with probability > 0.97 are followed (0.99 in sparse movies, section 2.3), so dim background rarely turns into a nucleus.
              - listitem [ref=f68e159]:
                - strong [ref=f68e160]: Short, binned convergence.
                - text: Seeds move 40 steps of 0.5 µm. Seeds whose end points fall into the same 1 µm cell form one nucleus; duplicates are left to the NMS.
              - listitem [ref=f68e161]:
                - strong [ref=f68e162]: Probability-ranked, adaptive NMS.
                - text: "Nuclei are ranked by their highest probability, and the NMS radius is set per movie: 4 µm, or 7 µm when the median nearest-neighbour distance is ≥ 10 µm (large nuclei)."
            - paragraph [ref=f68e163]:
              - img "3D Net outputs"
            - paragraph [ref=f68e164]:
              - strong [ref=f68e165]: "Loss: our choices."
              - text: "The vector field gets an L1 loss and the probability a weighted BCE with three tiers: annotated nuclei, confident background, and everything else (only a very weak push towards background). What matters is how the tiers are built:"
            - list [ref=f68e166]:
              - listitem [ref=f68e167]:
                - strong [ref=f68e168]: Tier normalisation.
                - text: Each tier's weight is divided by its voxel count, so the weights set how much each tier counts as a whole. With per-voxel weights the few annotated voxels carried less than 0.5% of the loss, and the probability head collapsed towards zero.
              - listitem [ref=f68e169]:
                - strong [ref=f68e170]: Where the vectors are supervised.
                - text: An annotation owns the voxels that are nearest to it, within 5.5 µm and among the brightest 5% of the frame, plus a 2 µm core that is always kept. The cap keeps an unannotated neighbour from being pulled into the region.
              - listitem [ref=f68e171]:
                - strong [ref=f68e172]: Local background.
                - text: A voxel is confident background only if it is darker than 0.4 × the local maximum within 3.5 µm, so the rim of a real cell in a dense frame is not labelled background.
            - paragraph [ref=f68e173]: "We trained three 3D Nets:"
            - table [ref=f68e174]:
              - rowgroup [ref=f68e175]:
                - row [ref=f68e176]:
                  - columnheader "model" [ref=f68e177]
                  - columnheader "training data" [ref=f68e178]
                  - columnheader "role" [ref=f68e179]
              - rowgroup [ref=f68e180]:
                - row [ref=f68e181]:
                  - cell "3D Net-128 (XY pooled by 2)" [ref=f68e182]
                  - cell "ground truth" [ref=f68e183]
                  - cell "main detector" [ref=f68e184]
                - row [ref=f68e185]:
                  - cell "3D Net-128-PL" [ref=f68e186]
                  - cell "ground truth + pseudo-labels" [ref=f68e187]
                  - cell "refines the nodes (2.2)" [ref=f68e188]
                - row [ref=f68e189]:
                  - cell "3D Net-64 (XY pooled by 4)" [ref=f68e190]
                  - cell "ground truth" [ref=f68e191]
                  - cell "independent check in sparse movies (5.3)" [ref=f68e192]
            - paragraph [ref=f68e193]:
              - strong [ref=f68e194]: Training.
              - text: "The deployed models are trained on all 199 movies with learning rate 3e-4. Each detector is trained several times (five folds for the out-of-fold detections plus the final model), so with our limited GPU compute we kept every run short: 10 epochs for the 128 models, using the"
              - strong [ref=f68e195]: average of the epoch 7–10 weights
              - text: ", and 50 for the 64 model, which is about four times cheaper per epoch. We do not claim that 10 epochs is optimal: many teams train for hundreds. In our runs, however, recall on unseen embryos peaked early in training, so our short-trained detector leans towards recall and predicts somewhat more nodes than there are cells (about 9% more). Much of the rest of the pipeline is about removing those extra nodes downstream: the strict seed threshold, the pseudo-label check (2.2), the ILP with its short-track filter and the track-support gate (5.3). In that sense, several of these steps compensate for short training; with more GPU compute we would rather put that effort into the detector itself, which would be the more elegant route."
            - paragraph [ref=f68e196]:
              - strong [ref=f68e197]: Resolution.
              - text: "In a quick check on one random fold with the same simple linker, the 128 × 128 XY grid scored 0.856 against 0.853 for the 64 × 64 grid: at 64 crowded nuclei merge in dense tissue. In sparse movies, however, the 64 grid did best locally. Rather than switching detectors per movie, which changes the node count, we use 3D Net-64 as an independent check there (5.3). Full resolution (256 × 256) costs 4.4× the compute of 128 and needs a smaller batch. We could train it only once, on one fold and for 10 epochs; that single short run showed no clear gain, and whether it pays off when trained to convergence remains open."
            - paragraph [ref=f68e198]:
              - strong [ref=f68e199]: No heatmap detector.
              - text: The public heatmap U-Net needs several hundred epochs to converge, which was beyond our compute, so we could not train our own folds of it. Its public weights were trained on all 199 training movies, so we had no way to cross-validate an ensemble with them. Without a reliable local score, the risk outweighed the expected gain for us, and we left it out.
            - paragraph [ref=f68e200]:
              - strong [ref=f68e201]: No test-time augmentation for the 3D Net.
              - text: 4- or 8-view TTA multiplies the cost of every validation run. A quick test on our chain gave no reliable gain (within noise locally, lower on the leaderboard), so we left it out. Other teams report gains from TTA, so this may depend on the pipeline.
            - heading "2.2 Pseudo-label refinement" [level=3] [ref=f68e202]
            - paragraph [ref=f68e203]:
              - strong [ref=f68e204]: Problem.
              - text: "The ground-truth-only model is conservative: few false tracks, but it misses dim nuclei in some frames. A model trained with pseudo-labels finds more nuclei, but used alone it also invents tracks on a new embryo (−0.003 to −0.004 on the leaderboard)."
            - paragraph [ref=f68e205]:
              - strong [ref=f68e206]: Pseudo-labels.
              - text: "The out-of-fold detections of all 199 movies, plus the detections on one unlabelled external embryo: 102 windows of the public Ultrack"
              - code [ref=f68e207]: zebrafish_embryo
              - text: light-sheet volume (Royer Lab, CZ Biohub). 3D Net-128-PL is trained on ground truth plus these pseudo-labels.
            - paragraph [ref=f68e208]:
              - strong [ref=f68e209]: Method.
              - text: "Use the pseudo-label model's nodes, but only on tracks the ground-truth model agrees with:"
            - list [ref=f68e210]:
              - listitem [ref=f68e211]: Run both models on the movie.
              - listitem [ref=f68e212]:
                - text: A pseudo-label node is
                - strong [ref=f68e213]: confirmed
                - text: if it is matched one-to-one to a ground-truth-model node within 6 µm in the same frame.
              - listitem [ref=f68e214]: Link the pseudo-label nodes frame to frame into tracks (Hungarian matching, 7 µm gate).
              - listitem [ref=f68e215]:
                - text: Keep a track only if
                - strong [ref=f68e216]: at least 50% of its nodes are confirmed
                - text: . The output is the pseudo-label nodes of the kept tracks.
            - paragraph [ref=f68e217]:
              - img "pseudo-label refinement"
            - paragraph [ref=f68e218]:
              - strong [ref=f68e219]: Effect.
              - text: "Frames where the ground-truth model missed a nucleus are filled in, and tracks it never saw disappear: +0.004 on public and +0.011 on private, for the cost of one extra training run rather than an ensemble."
            - heading "2.3 Density-aware threshold (DoG router)" [level=3] [ref=f68e220]
            - paragraph [ref=f68e221]:
              - strong [ref=f68e222]: Problem.
              - text: In sparse movies, large nuclei produce extra seeds at the normal threshold.
            - paragraph [ref=f68e223]:
              - strong [ref=f68e224]: Method.
            - list [ref=f68e225]:
              - listitem [ref=f68e226]: A simple rule-based DoG blob tracker counts nuclei and gives each movie a nucleus spacing.
              - listitem [ref=f68e227]: Movies with spacing ≥ 19.7 µm are re-detected with a stricter seed threshold (0.99 instead of 0.97).
            - paragraph [ref=f68e228]:
              - strong [ref=f68e229]: Why DoG.
              - text: Our first version used the detector's own node count to decide. But a detector's count drifts on an unseen embryo, and a router should not depend on the model it routes. The detector-independent DoG router gained +0.002 on public with no change in local validation.
            - heading "3. Linking" [level=2] [ref=f68e230]
            - heading "3.1 Candidate links" [level=3] [ref=f68e231]
            - paragraph [ref=f68e232]: "For every node at frame t: all nodes at t+1 within 10 µm and its 5 nearest successors. In addition, every node at t+1 is linked to its 3 nearest predecessors."
            - heading "3.2 Evidence for each link" [level=3] [ref=f68e233]
            - list [ref=f68e234]:
              - listitem [ref=f68e235]:
                - strong [ref=f68e236]: Geometry (26 features).
                - text: Displacement, distance ranks and gaps among competing candidates in both directions, nearest-neighbour distances, detection confidence and cluster size, the residual against the node's velocity from a first frame-to-frame matching pass, the residual against the local tissue flow (median displacement of the first-pass links shorter than 6 µm within three nearest-neighbour distances), and whether the nodes continue into the past / future.
              - listitem [ref=f68e237]:
                - strong [ref=f68e238]: Transformer probability.
                - text: We retrained the competition baseline's linker architecture (a temporal U-Net encoder plus a node transformer that scores all node pairs of two consecutive frames) on all 199 movies. It is run in both directions; the two softmax-normalised probabilities and their weighted harmonic mean are features.
              - listitem [ref=f68e239]:
                - strong [ref=f68e240]: Cell embedding.
                - text: A small 3D CNN encodes a 16 × 32 × 32 raw patch around each node. It is trained with InfoNCE so that the same annotated cell at t and t+1 is closer than its competing candidates. The cosine similarity of the two ends of a link is a feature.
            - heading "3.3 Edge model" [level=3] [ref=f68e241]
            - paragraph [ref=f68e242]:
              - text: LightGBM on all of the above (47 features), trained on out-of-fold detections, gives the link probability
              - code [ref=f68e243]: p
              - text: used everywhere downstream.
            - paragraph [ref=f68e244]:
              - strong [ref=f68e245]: Lesson.
              - text: Out-of-fold stacking under-values evidence from models trained on all data. Locally we could only use fold versions of the transformer, trained on less data, and its feature looked worth almost nothing. On the leaderboard, the version trained on all 199 movies was worth +0.005.
            - heading "4. Divisions" [level=2] [ref=f68e246]
            - heading "4.1 Why a per-node division cost" [level=3] [ref=f68e247]
            - paragraph [ref=f68e248]: "In the ILP a division means that one node keeps two outgoing edges. The second daughter's edge is usually weak: that daughter is further away and looks different from its mother. With one global division cost, the solver either never opens forks, or opens false ones wherever two cells sit close together."
            - paragraph [ref=f68e249]:
              - text: We therefore give
              - strong [ref=f68e250]: each node its own division cost
              - text: ","
              - code [ref=f68e251]: cost = 6 − 16·s
              - text: (
              - code [ref=f68e252]: 5 − 16·s
              - text: in sparse movies), where
              - code [ref=f68e253]: s
              - text: is the learned probability that the node is a dividing mother. Forks open only where the evidence supports them.
            - paragraph [ref=f68e254]:
              - img "division prior in the ILP"
            - heading [level=3] [ref=f68e255]:
              - text: 4.2 The division score
              - code [ref=f68e256]: s
            - paragraph [ref=f68e257]: "Divisions are rare and subtle. The mother rounds up and brightens, its chromatin splits, and two compact, bright daughters appear that keep moving apart for a few frames:"
            - paragraph [ref=f68e258]
            - paragraph [ref=f68e259]:
              - strong [ref=f68e260]: Labels.
              - text: "For the division CNN and the graph model, a node with two annotated children is positive and a node with one annotated child is negative; unannotated nodes are never used as negatives, because most real divisions are unannotated. The pair model takes its negatives from 200 random nodes per movie, which are rarely dividing. For the same reason, hard-negative mining hurt badly: the \"hardest negatives\" are mostly real, unannotated divisions."
            - paragraph [ref=f68e261]:
              - strong [ref=f68e262]: Three scorers.
            - table [ref=f68e263]:
              - rowgroup [ref=f68e264]:
                - row [ref=f68e265]:
                  - columnheader "scorer" [ref=f68e266]
                  - columnheader "input" [ref=f68e267]
                  - columnheader "model" [ref=f68e268]
              - rowgroup [ref=f68e269]:
                - row [ref=f68e270]:
                  - cell "Division CNN" [ref=f68e271]
                  - cell "5-frame crop (t−2 … t+2) of 9 × 33 × 33 voxels around the node" [ref=f68e272]
                  - cell "6 CNNs (3 seeds, with and without copy-paste augmentation), 4 flips" [ref=f68e273]
                - row [ref=f68e274]:
                  - cell "Graph model" [ref=f68e275]
                  - 'cell "53 features of the node in the candidate graph: its best links and how contested they are, where its candidate daughters are (distance, opposite sides, symmetry), whether they continue, motion, local density, the CNN score" [ref=f68e276]'
                  - cell "CatBoost" [ref=f68e277]
                - row [ref=f68e278]:
                  - cell "Pair model" [ref=f68e279]
                  - cell "candidate (mother, daughter, daughter) triplets with 174 image features, plus graph, embedding and link features of both daughter edges" [ref=f68e280]
                  - cell "LightGBM + CatBoost" [ref=f68e281]
            - paragraph [ref=f68e282]: "How the pair model works:"
            - list [ref=f68e283]:
              - listitem [ref=f68e284]: "For every node, candidate daughter pairs are taken from the next frame: both within 13.5 µm, sisters 4.5–17 µm apart, the mother near their midpoint, the daughters on opposite sides."
              - listitem [ref=f68e285]: "The 174 image features follow the biology: the mother's brightness, texture, compactness and size over her last 7 frames, the intensity drop at her position at the split, both daughters over their first 3 frames, sister separation and its growth, movement along the division axis."
              - listitem [ref=f68e286]: A node's score is its best pair.
            - paragraph [ref=f68e287]:
              - text: The final score is
              - code [ref=f68e288]: s = max(pair model, graph model)
              - text: ", which added +0.003 on public and +0.010 on private over the graph model alone."
            - heading "4.3 Divisions inside and after the ILP" [level=3] [ref=f68e289]
            - list [ref=f68e290]:
              - listitem [ref=f68e291]:
                - strong [ref=f68e292]: Relaxed admission.
                - text: A link enters the ILP graph if
                - code [ref=f68e293]: p > 0.3 − 0.5·s
                - text: ", so likely mothers keep their weaker second link."
              - listitem [ref=f68e294]:
                - strong [ref=f68e295]: Second-daughter rescue.
                - text: For nodes with
                - code [ref=f68e296]: s ≥ 0.2
                - text: ", links that are not the node's best link take"
                - code [ref=f68e297]: max(p, transformer probability)
                - text: ", because the transformer is often more confident about the second daughter."
              - listitem [ref=f68e298]:
                - strong [ref=f68e299]: Fork verifier.
                - text: "After the ILP, both daughters of every fork are traced in the raw images from 3 frames before to 5 frames after the fork (motion-compensated DoG peak search). 157 features describe their separation over time, peak quality and displacement. A CatBoost model removes the weaker daughter edge when its score is below 0.25, unless the two daughters clearly move apart along the fork axis. +0.002 on public (private unchanged), and +0.003 more on public from tuning the threshold (private −0.001). Its training rows are the forks of a tracking run on the training movies, candidate division events labelled by the annotations, and 409 hand labels: candidate divisions that our models proposed in 39 training movies, each checked by eye (274 divisions, 135 rejections). Trained on the official annotations only, with its threshold re-chosen (0.40), it scores 0.0017 lower on the public and 0.0006 higher on the private leaderboard."
              - listitem [ref=f68e300]:
                - strong [ref=f68e301]: Division base cost.
                - text: The optimum is broad, around 5–6; dense movies use 6, sparse movies 5.
            - paragraph [ref=f68e302]:
              - strong [ref=f68e303]: Effect.
              - text: Turning on the division score took the leaderboard from
              - strong [ref=f68e304]: 0.913 to 0.948 (+0.035 on both public and private)
              - text: .
            - heading "5. Tracking and post-processing" [level=2] [ref=f68e305]
            - heading "5.1 ILP" [level=3] [ref=f68e306]
            - paragraph [ref=f68e307]: "tracksdata with the SCIP solver, one movie per process:"
            - list [ref=f68e308]:
              - listitem [ref=f68e309]:
                - text: edge reward
                - code [ref=f68e310]: p
                - text: ;
              - listitem [ref=f68e311]: appearance cost 0.5, disappearance cost 3.2;
              - listitem [ref=f68e312]:
                - text: per-node division cost
                - code [ref=f68e313]: 6 − 16·s
                - text: ", or"
                - code [ref=f68e314]: 5 − 16·s
                - text: in sparse movies (section 4).
            - heading "5.2 Cleaning the tracks" [level=3] [ref=f68e315]
            - list [ref=f68e316]:
              - listitem [ref=f68e317]:
                - strong [ref=f68e318]: Short-track filter.
                - text: Isolated single nodes are removed.
              - listitem [ref=f68e319]:
                - strong [ref=f68e320]: Motion-compensated smoothing.
                - text: The per-frame tissue translation is estimated from confident non-division links. Coordinates are then smoothed along each track with a local line fit (±3 frames) after removing that translation.
              - listitem [ref=f68e321]:
                - strong [ref=f68e322]: Gap bridging.
                - text: A track ending at t and a nearby track starting at t+2 or t+3 are joined through linearly interpolated nodes (+0.002).
            - heading "5.3 Track-support gate (sparse movies)" [level=3] [ref=f68e323]
            - paragraph [ref=f68e324]:
              - strong [ref=f68e325]: Problem.
              - text: "In sparse movies the main remaining error is over-counting: long, dim tracks that are not real nuclei."
            - paragraph [ref=f68e326]:
              - strong [ref=f68e327]: Method.
              - text: "The same principle as in 2.2, now applied to the final tracks with two independent detectors, 3D Net-64 and a sensitive DoG detector:"
            - list [ref=f68e328]:
              - listitem [ref=f68e329]: Cut the tracks into division-free segments.
              - listitem [ref=f68e330]: A node is confirmed if an independent detection is close by in the same frame.
              - listitem [ref=f68e331]: "Remove a segment if too few of its nodes are confirmed:"
            - table [ref=f68e332]:
              - rowgroup [ref=f68e333]:
                - row [ref=f68e334]:
                  - columnheader "movie spacing" [ref=f68e335]
                  - columnheader "a node is confirmed if …" [ref=f68e336]
                  - columnheader "remove the segment if confirmed <" [ref=f68e337]
              - rowgroup [ref=f68e338]:
                - row [ref=f68e339]:
                  - cell "19.7–25 µm" [ref=f68e340]
                  - cell [ref=f68e341]:
                    - text: a DoG detection within 4 µm
                    - strong [ref=f68e342]: or
                    - text: a 3D Net-64 node within 5 µm
                  - cell "40%" [ref=f68e343]
                - row [ref=f68e344]:
                  - cell "> 25 µm" [ref=f68e345]
                  - cell [ref=f68e346]:
                    - text: a DoG detection within 5 µm
                    - strong [ref=f68e347]: and
                    - text: a 3D Net-64 node within 5 µm
                  - cell "20%" [ref=f68e348]
            - paragraph [ref=f68e349]: Dense movies are not touched.
            - paragraph [ref=f68e350]:
              - strong [ref=f68e351]: Effect.
              - text: "Positive in local validation and neutral on public (0.969), so it went into the final submission. On private it cost 0.001, while a more lenient setting gained 0.001: like other changes to the node count, it transferred to new embryos less predictably than the rest of the pipeline."
            - heading "5.4 Model sizes and cost" [level=3] [ref=f68e352]
            - table [ref=f68e353]:
              - rowgroup [ref=f68e354]:

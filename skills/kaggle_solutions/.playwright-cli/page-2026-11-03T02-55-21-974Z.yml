                - text: GitHub
              - text: ": inference, the training of every model, and the download and pseudo-labelling of the external data. Parts derived from the official baseline keep its BSD 3-Clause License."
            - list [ref=f68e428]:
              - listitem [ref=f68e429]:
                - strong [ref=f68e430]: Inference.
                - text: With our released models (
                - link "biohub-4th-place-artifacts (opens in a new tab)" [ref=f68e431] [cursor=pointer]:

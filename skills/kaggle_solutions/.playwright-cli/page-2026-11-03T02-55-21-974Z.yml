              - rowgroup [ref=f68e359]:
                - row [ref=f68e360]:
                  - cell "3D Net-128 / 3D Net-128-PL / 3D Net-64" [ref=f68e361]
                  - cell "18 M parameters each (10 / 10 / 50 epochs)" [ref=f68e362]

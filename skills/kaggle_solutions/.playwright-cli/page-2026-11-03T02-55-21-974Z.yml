            - paragraph [ref=f68e54]: Many thanks to the organisers for a challenging and well-designed competition, and to everyone who shared notebooks, support packs and ideas on the forum.
            - heading "Overview" [level=2] [ref=f68e55]
            - paragraph [ref=f68e56]: "Our tracker has five stages: learned models for detection, links and divisions, a global ILP that puts them together, and rule-based post-processing."
            - table [ref=f68e57]:

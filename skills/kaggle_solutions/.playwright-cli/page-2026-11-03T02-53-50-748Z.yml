                  - paragraph [ref=f65e555]: Here's an overview of my approach for the 7th place solution.
                  - paragraph [ref=f65e556]: The approach for this submission was pretty simple. I used an sklearn RandomForestRegressor with 30 trees to bin the training cases using log(duration + 1) as the target. The features I used were hour of the day, taxi id, caller id, and trip starting location (binned onto a grid with ~100m resolution).
                  - paragraph [ref=f65e557]: For each test trip, I found the appropriate leaf in each tree of the random forest and removed the samples whose duration was shorter than the duration of the test trip segment. If necessary, I climbed the tree to include other nearby leaves so that I had at least 10 training trips that were longer than the test segment. I took the average of the log(duration +1) for those samples and that was my prediction.
                  - paragraph [ref=f65e558]: Despite having learned better from other Kagglers, I did an awful job of CV. I didn't do any proper CV until the last day of the contest, thinking that due to the log factors in the evaluation metric the public leaderboard would be much less volatile due to the small number of test cases than in taxi-I. That was wrong =p I paid the price though - I ended up selecting only my 4th best case for submission and I discarded several ideas on account of the public leaderboard result that were actually good ones. We live and learn....

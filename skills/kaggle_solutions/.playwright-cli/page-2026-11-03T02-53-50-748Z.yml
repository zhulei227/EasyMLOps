                  - paragraph [ref=f65e668]: Dear competitors,
                  - paragraph [ref=f65e669]: Thank you for participating with your straightforward ideas. You made the success of this competition. I want to highlight that this dataset was donated to the UCI data repository to make it available for everyone who wants to run experiments with it.
                  - paragraph [ref=f65e670]: "During my Phd, I used this data for other purposes (not this dataset, but similar data collected in previous periods). I will share my own insights with you (please feel free to make other questions if you think that they are relevant:"
                  - paragraph [ref=f65e671]: 1) The spatial discretization is a must. It is not surprising to see that almost everyone did it somehow…
                  - paragraph [ref=f65e672]: 2) The cutoff points were not randomly selected. They respond to particular seasonalities in Porto which could be mined through the calendar or by some exploratory data analysis as well.
                  - paragraph [ref=f65e673]: 3) The model itself requires a carefull feature engineering before take off. Anyhow, I saw here very elegant solutions…e.g. gradient boosting. But maybe to get a model for each cutoff (or each cutoff type) wouldnt be a bad idea….what do you think?
                  - paragraph [ref=f65e674]: Please feel free to pose more questions and continue to share your own solutions.
                  - paragraph [ref=f65e675]: I do hope to see you all in Porto next September, in ECML/PKDD.
                  - paragraph [ref=f65e676]: Best, Luis Moreira-Matias

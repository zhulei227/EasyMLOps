                  - paragraph [ref=f65e321]: Hi all,
                  - paragraph [ref=f65e322]: here is a short overview of the 1st place solution.
                  - paragraph [ref=f65e323]: "My solution is based on 3 different kind of models:"
                  - list [ref=f65e324]:
                    - listitem [ref=f65e325]: A base model, where the features were extracted from all the tracks in the training set, and longer tracks were sampled more frequently than shorter ones.
                    - listitem [ref=f65e326]: Expert models for short trips (e.g. only 1,2 or 3 positions are known).
                    - listitem [ref=f65e327]: Expert models for each cut off position in the test set (e.g. tracks close to the cut-off position have been selected).
                  - paragraph [ref=f65e328]:
                    - strong [ref=f65e329]: "Selected Features:"
                  - list [ref=f65e330]:
                    - listitem [ref=f65e331]: working day (Mon-Sun)
                    - listitem [ref=f65e332]: hour
                    - listitem [ref=f65e333]: trip length
                    - listitem [ref=f65e334]: lat coordinate start point
                    - listitem [ref=f65e335]: long coordinate start point
                    - listitem [ref=f65e336]: lat coordinate cut of point
                    - listitem [ref=f65e337]: long coordinate cut of point
                    - listitem [ref=f65e338]: distance from start point to city center
                    - listitem [ref=f65e339]: direction from the start point towards the city center
                    - listitem [ref=f65e340]: distance from city center to cut of point
                    - listitem [ref=f65e341]: direction from the city center towards the cut of point
                    - listitem [ref=f65e342]: net distance to cut of point
                    - listitem [ref=f65e343]: median velocity of the car along the track
                    - listitem [ref=f65e344]: velocity of the car at the cut of point
                    - listitem [ref=f65e345]: heading of the car at the cut of point
                  - paragraph [ref=f65e346]:
                    - strong [ref=f65e347]: "Training:"
                  - paragraph [ref=f65e348]: All models are trained using 5 fold cross-validation. I used RandomForestRegressor and GrandientBoostingRegressor from sklearn with default settings except the number of trees, which was set to 200. For most models the GradientBoostingRegressor was slightly better. I also tried neural networks but they performed worse.
                  - paragraph [ref=f65e349]: The final prediction of each test trip was based on the corresponding expert model except for the trips with a low training set size, where I used either the base model or a simple average of all the short trip models depending on trip length.
                  - paragraph [ref=f65e350]: A detailed description of my approach and the code will follow soon.
                - button "Reply" [ref=f65e352] [cursor=pointer]:

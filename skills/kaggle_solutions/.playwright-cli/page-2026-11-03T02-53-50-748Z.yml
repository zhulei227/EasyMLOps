                  - paragraph [ref=f65e387]:
                    - strong [ref=f65e388]: preprocessing & feature generation
                    - text: "From each training data, I created multiple training examples: each partial trajectory starting from the start location becomes a training example. For each training example, I then calculated the elapsed time until the last position, travel distance, the overall bearing, and the nearest taxi stand from the starting point."
                  - paragraph [ref=f65e389]:

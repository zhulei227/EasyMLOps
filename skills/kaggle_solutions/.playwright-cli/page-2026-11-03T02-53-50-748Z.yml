                  - paragraph [ref=f65e282]: Congrats to everybody and most at all, the top 10. I finish 11th and I will clean the code and post it on GitHub.
                  - paragraph [ref=f65e283]: Last two weeks all my model were on h2o, and I used gbm, random forest and deep learning. It seems the best one was gbm. My selected submissions were (1) one pure gbm and (2) a combination of two gbm one deep learning and one random forest (all on h2o)
                  - paragraph [ref=f65e284]: I used "weekday", "minute" (0-1440), "initial_longitude", "initial_latitude", "call_type" and "taxi_id" variables.
                  - paragraph [ref=f65e285]: The only trick on my strategy was the use of duration time of trips. I did not use it to calculate the model but prior to submit it, I calculate if the predicted duration was less than time on test dataset and if so I choosed the time on dataset and multiply it to 1.45. Usually the number of this kind of trips was around 70 over 320.

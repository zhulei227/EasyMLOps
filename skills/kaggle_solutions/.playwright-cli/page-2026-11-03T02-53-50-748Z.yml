                  - paragraph [ref=f65e206]: There was definitely some luck here (my CVs were way too optimistic and my Public Leaderboard scores were marginally competitive), however I did spend a fair amount of time in the taxi-I competition early on, so I was comfortable with the data. Like other competitions with small Train, small Test, or noisy data, sometimes the simpler models do well. Besides, there were plenty of prior competitions where luck did not play in my favor, so I guess it balances out eventually.

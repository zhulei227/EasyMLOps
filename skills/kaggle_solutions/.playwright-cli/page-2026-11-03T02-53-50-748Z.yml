                    - listitem [ref=f65e191]: snapshot_weekday
                    - listitem [ref=f65e192]: snapshot_hour (In Test, manually set based upon the snapshot datetime because some of the polylines lengths did not match the snapshot datetime)
                    - listitem [ref=f65e193]: net_distance_to_snapshot
                    - listitem [ref=f65e194]: seconds_to_snapshot
                    - listitem [ref=f65e195]: log_seconds_to_snapshot
                  - paragraph [ref=f65e196]: 3. Dependent Variable
                  - list [ref=f65e197]:

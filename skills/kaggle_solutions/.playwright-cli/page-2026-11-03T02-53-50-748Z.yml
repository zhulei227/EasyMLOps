          - generic [ref=f65e49]:
            - paragraph [ref=f65e50]: Congrats to all the winners.
            - paragraph [ref=f65e51]: For my submission, the idea was to do something quick and dirty without the usual time-consuming steps of modeling, cross validating, and ensembling. Whereas my posted benchmark code used 1 point to find similar trajectories, the final submission used 2 points.
            - paragraph [ref=f65e52]: Below is the recipe.
            - list [ref=f65e53]:
              - listitem [ref=f65e54]: Only use the most relevant rows. For example, to predict for 2014-12-21 at 14:30, only use train data from the afternoons of Sundays before public holidays.
              - listitem [ref=f65e55]: Only use the most relevant columns. Basically, just timestamp and polyline.
              - listitem [ref=f65e56]: Look up the most similar trajectories in train for each test case. For simplicity, only the starting locations and the cut-off locations are compared. (Train trajectory is cut to about the same length as test).
              - listitem [ref=f65e57]: Similarity features include distance, overall bearing, and last bearing.
              - listitem [ref=f65e58]: Calculate the average of coordinates and log(polyline length), weighted by similarity.
              - listitem [ref=f65e59]: Thresholds chosen based on intuition and looking at a couple of examples to make sure enough similar trajectories are used.

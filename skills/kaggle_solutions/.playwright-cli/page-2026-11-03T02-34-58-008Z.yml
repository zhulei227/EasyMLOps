      - generic [ref=f41e31]: 2nd place solution with GPU muscles — IEEE's Signal Processing Society - Camera Model Identification
      - separator [ref=f41e32]
      - generic [ref=f41e34]:
        - generic [ref=f41e35]:
          - heading "2nd place solution with GPU muscles" [level=1] [ref=f41e36]
          - generic [ref=f41e37]:
            - link [ref=f41e38] [cursor=pointer]:
              - /url: /competitions/sp-society-camera-model-identification
              - paragraph [ref=f41e40]: IEEE's Signal Processing Society - Camera Model Identification
            - paragraph [ref=f41e41]: Solution Writeup · 2nd place
        - separator [ref=f41e43]
        - generic [ref=f41e44]:
          - generic [ref=f41e46]:
            - paragraph [ref=f41e47]:
              - strong [ref=f41e48]: tldr
              - text: ": We downloaded a about 500+ GB photos, trained 9+ imagenet-like models with 3 version of the pipeline. Finally, we averaged 27 checkpoints with geometric mean."
            - paragraph [ref=f41e49]:
              - strong [ref=f41e50]: "Key components of a good solution, by priorities:"
            - list [ref=f41e51]:
              - listitem [ref=f41e52]: Large and clean external dataset
              - listitem [ref=f41e53]: Consistant local validation
              - listitem [ref=f41e54]: Classic competitive approach to learning models
              - listitem [ref=f41e55]: Diverse models
            - paragraph [ref=f41e56]:
              - strong [ref=f41e57]: Data mining
              - text: ": We downloaded 500+ Gb photos from various resources: Flickr, Yandex.Fotki, Wikipedia Commons, mobile reviews. In addition, on the last night we downloaded 22k more photos with urls from Flickr gathered by"
              - link "Andres Torrubia (opens in a new tab)" [ref=f41e58] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/sp-society-camera-model-identification/discussion/49064
                - text: Andres Torrubia
              - text: .
            - paragraph [ref=f41e59]:
              - strong [ref=f41e60]: Filtering data
              - text: ": Lightroom/photoshop/etc processing could eliminate all the information about the camera. We filtered on: model, resolution, quality of jpeg compression, software of processing. After filtering of the training and validation, the datasets looked like this:"
              - img "enter image description here"
              - text: We took the validation from
              - link "Gleb’s post (opens in a new tab)" [ref=f41e61] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/sp-society-camera-model-identification/discussion/47235
                - text: Gleb’s post
              - text: ", but replaced iPhone 6 plus pictures in it by iPhone 6 ones."
            - paragraph [ref=f41e62]:
              - strong [ref=f41e63]: Training models
              - text: ": Our code is based on pytorch version of"
              - link "Andres solution (opens in a new tab)" [ref=f41e64] [cursor=pointer]:
                - /url: https://www.kaggle.com/c/sp-society-camera-model-identification/discussion/48679
                - text: Andres solution
              - text: ". For all the models, the binary flag is_manip was used as an additional feature for the classifier of a net. All models had an input of 480. For the majority of our models, five crops + flip photo orientation (10TTA) was applied to the pictures, for D4 models five crops + the whole group of D4 were applied (40TTA); then geometric mean was applied to the predictions. Useful tricks:"
            - list [ref=f41e65]:
              - listitem [ref=f41e66]: Adam, reducing LR on plateau with patience 2-4
              - listitem [ref=f41e67]: Cyclic LR with SGD
              - listitem [ref=f41e68]: Pseudo-labeling
              - listitem [ref=f41e69]: Averaging 3 checkpoints with the best loss for validation
            - paragraph [ref=f41e70]: Also on the last day we trained several models with D4 augmentations, finetune from best checkpoint of previous pipeline. We didn’t have submit to check all models on LB, but the result on one was impressive.
            - paragraph [ref=f41e71]:
              - text: "The final ensemble of models looked like this:"
              - img "enter image description here"
              - text: "Logging models:"
              - img "enter image description here"
              - strong [ref=f41e72]: Averaging
              - text: ": We tried different approaches with class balancing and dropping the missing classes according to the probabilities. But in the end geometric average of 27 checkpoints of different models is the best."
            - paragraph [ref=f41e73]:
              - strong [ref=f41e74]: What did not work?
              - text: Demosizing
              - img "enter image description here"
              - text: Cameras fix on the matrix in a particular pixel the intensity of only one color, and the rest of the colors are restored to neighboring pixels, and the recovery algorithm for different camera manufacturers is different. The idea was to calculate the difference between the original image and the image obtained by one of the standard demosayzingov. The inertia of the differences is to train the neural network.
            - paragraph [ref=f41e75]:
              - strong [ref=f41e76]: "Hardware:"
            - list [ref=f41e77]:
              - listitem [ref=f41e78]: i7 7700k, 64gb, 2x 1080 (just for development)
              - listitem [ref=f41e79]: i7 6700k, 32gb, 2x Titan X (Maxwell)
              - listitem [ref=f41e80]: i7 5930K, 32GB, 3x1080Ti
              - listitem [ref=f41e81]: Xeon 2696v3, 64gb, 4x1080Ti
              - listitem [ref=f41e82]: i7 3770k, 16gb, 2x 1080Ti

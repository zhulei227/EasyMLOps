                      - text: "Bauer: Thanks for you explanation. This is extremely informative. I have a few basic questions though:"
                  - list [ref=f64e600]:
                    - listitem [ref=f64e601]: Which neural net library did you use? Neuralnet and mxnet didn't work (mxnet has a bug and neuralnet was very slow), so finally i used nnet in R (for final ensemble)
                    - listitem [ref=f64e602]: "Splitting of title and query by prepositions: Can you please provide some intuition behind doing this? Is it based on the fact that the first half is main clause, second half is subordinate?"
                    - listitem [ref=f64e603]:
                      - text: "Quantification of important noun similarities (L1, L2, cosine distances): L1 = Manhattan distance, L2=Euclidean. Is this the correct interpretation? Also did these features help you? I tried POS tagging but resulting features were not important."
                      - link "@Sameh (opens in a new tab)" [ref=f64e604] [cursor=pointer]:
                        - /url: /Sameh
                        - text: "@Sameh"
                      - text: Faidi mentioned the same.
                  - paragraph [ref=f64e605]: For neural nets, we used Keras with Theano backend. One hidden layer with 1024 hidden nodes and relu activation, a second 3-node hidden layer with sigmoid activation to stabilize the predictions and a final linear output layer and RMSE objective. Dropout for regularization and early-stopping to determine number of epochs. With a single hidden layer and linear output I was not able to get it converge. Training was quite fast with GPU support, so I used 3-10 bags of models with same parameters and different seed.
                  - paragraph [ref=f64e606]: "To explain the splitting by prepositions, take for example the title \"Window Cleaning Robot for Framed Window\". When we split by preposition (for, with, between, etc.) we get two substrings in this case: ['Window Cleaning Robot','Framed Window']. We then reversed the order of this list and concatenated the substrings, to get \"Framed Window Window Cleaning Robot\". With this transformation, the important words (\"cleaning robot\" in this case) are much more likely in the last position, which improved all our position-sensitive features."

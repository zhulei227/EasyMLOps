                          - text: ", I am curious specifically how you used cosine as the merge mode. I saw that option but wasnt sure what it did. Below, if you merge two word embedding matrices, and use 'cos' the result is a single scalar?"
                  - paragraph [ref=f64e875]: Yes, the output of cosine merge mode is a single scalar, like in the example code you posted. I put another sigmoid hidden layer with 16 nodes on top and a final single linear node as output layer for relevance.
                  - paragraph [ref=f64e876]: The idea is that the LSTMs build an enhanced "sentence" vector from the individual word embedding vectors. During learning, the relevance is propagated back through the cosine merge layer into the LSTM cells. In the paper I mentioned the authors showed that the LSTM is able to learn which words are important and which are not, and take into account word position and order.
                  - paragraph [ref=f64e877]: I have not had a chance to try and understand the paper yet so maybe it would be clearer to me, but are you saying that you had word embeddings exactly like in my example for query and title (or whatever you used for the "document"), merged them with cos and this went into LSTM and after the LSTM was another hidden dense layer (16 units) and finally the dense output?
                  - paragraph [ref=f64e878]: "No, I use the LSTM instead of embedding layers, below the cosine merge. With embeddings I mean the word2vec or glove vectors. I use the sequence of glove word vectors from query and title as input to LSTM. See below the code for generating the model in Keras:"
                  - code [ref=f64e880]: "def generate_lang_model(max_len): model = Sequential() if num_lstm_hidden_layers == 1: model.add(LSTM(output_dim=num_lstm_hidden_units, return_sequences=False, input_shape=(max_len, glove_vec_dim))) else: model.add(LSTM(output_dim=num_lstm_hidden_units, return_sequences=True, input_shape=(max_len, glove_vec_dim))) for k in range(num_lstm_hidden_layers-2): model.add(LSTM(output_dim=num_lstm_hidden_units, return_sequences=True)) model.add(Dropout(lstm_dropout)) model.add(LSTM(num_lstm_hidden_units, return_sequences=False)) return model query_model = generate_lang_model(max_len_query) title_model = generate_lang_model(max_len_title) model = Sequential() model.add(Merge([query_model, title_model], mode='cos', dot_axes=[[1], [1]])) model.add(Dense(16, activation='sigmoid', init='glorot_uniform')) model.add(Dense(1, init='uniform')) model.compile(loss='mean_squared_error', optimizer='adam')"

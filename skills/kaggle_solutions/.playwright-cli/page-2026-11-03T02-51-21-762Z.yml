                  - paragraph [ref=f64e558]:
                    - text: "Congrats to your team's winning and your guys excellent work. I saw you have used WMD, can you share to what extent it helps the model? I haven't tried it (both in CrowdFlower) as I figured it would be quite computation intense. Can you also share the implementation you have been using? (Maybe this:"
                    - link "https://github.com/mkusner/wmd (opens in a new tab)" [ref=f64e559] [cursor=pointer]:
                      - /url: https://github.com/mkusner/wmd
                      - text: https://github.com/mkusner/wmd
                    - text: "?) I would love to have it in my toolbox."
                  - paragraph [ref=f64e560]:
                    - text: Because of the computational complexity, we didn't use the original WMD definition but one of the lower bound approximations that are proposed in the original paper (section 4.1 in
                    - link "http://jmlr.org/proceedings/papers/v37/kusnerb15.pdf (opens in a new tab)" [ref=f64e561] [cursor=pointer]:
                      - /url: http://jmlr.org/proceedings/papers/v37/kusnerb15.pdf
                      - text: http://jmlr.org/proceedings/papers/v37/kusnerb15.pdf
                    - text: ) under "relaxed word movers distance". It is basically a nearest neighborhood search to find the closest word in doc B for each word in doc A and then take sum of all minimum distances. The feature was especially effective when we added weighting of the words by position. We used an exponential weighting of the words in the queries by position, to emphasize the importance of the last 2-3 words in the query.
                  - paragraph [ref=f64e562]: Our implementation is just a nested for loop to calculate the distance matrix, which is not very efficient but works for those small documents. I guess the nearest neighborhood search could be done more efficiently, e.g. with scikits kd-tree implementation. Wow. Seems we did a similar thing. I aggregate the distance between each word in doc A and each word in doc B using double aggregation, e.g., maximum of the minimum distance.
                  - paragraph [ref=f64e563]: Double aggregation is used to capture the similarity/distance from both word level and doc level. Take maximum of the minimum distance for example. In word level and for each word in doc A, we have a list of the distance between it and each word in doc B, we use minimum to aggregate this list. Then in doc level, for doc A, we aggregate the minimum distance of each word using maximum to generate the features. You can use different similarity/distance measures, e.g., cosine sim of word2vec, wordnet synsets path/lch/wup similarity, edit distance, compression distance, char distribution KL divergence etc , and different aggregation methods, e.g., maximum and minimum, to capture the similarity from different perspectives.
                  - paragraph [ref=f64e564]: I also used for-loop which is quite computation intense, but such features computed with cosine sim of word2vec are very useful and have the highest correlation with the target relevance. I haven't used weighting (e.g., IDF, position weighting) in such features as you, but I should really try to combine them according to your results!!

                - generic [ref=f64e258]:
                  - paragraph [ref=f64e259]: We also would like to share the basic concepts of our solution and share our experiences. First of all thanks to Homedepot for hosting this wonderful competition!
                  - paragraph [ref=f64e260]: As many have noticed, this dataset rewards mixing of all kinds of features and modeling approaches which is most easily achieved in teams. No matter what exotic feature engineering and modeling we tried, there was hardly any case that negatively affected the CV score, so we kept on adding models and features until we ran out of time. Our CV strategy worked very well and gave us the confidence to create large L1 and L2 ensembles and adding a third layer of linear stacking.
                  - paragraph [ref=f64e261]: We were quite surprised to end up on place 2 on private as we were only 5th place on public! We did not use productuid or id by itself as a feature, so maybe that helped. We noticed the trend and jump in average relevance for different id ranges, but we only accounted for it using a binary variable id>160,000.
                  - paragraph [ref=f64e262]:
                    - strong [ref=f64e263]: Data cleaning/Preprocessing
                  - list [ref=f64e264]:
                    - listitem [ref=f64e265]: Spell correction using posted Google corrections and using Norvig correction on corpus built from titles, descriptions and reddit comments.
                    - listitem [ref=f64e266]: Spell correction of queries using manually created dictionaries published in the forum
                    - listitem [ref=f64e267]: Removing all words in brackets from title (battery not included)
                    - listitem [ref=f64e268]: Splitting of title and query by prepositions (in, for, with, etc.) and inversing order, to get important words to the end
                    - listitem [ref=f64e269]: Normalizations of units
                  - paragraph [ref=f64e270]:
                    - strong [ref=f64e271]: Feature Groups
                  - list [ref=f64e272]:
                    - listitem [ref=f64e273]:
                      - paragraph [ref=f64e274]: Word match counts and positions on Wordnet synonym, hyponym and hypernym expanded titles and queries
                    - listitem [ref=f64e275]:
                      - paragraph [ref=f64e276]: Attribute extraction and matching for product titles/attributes and queries
                      - list [ref=f64e277]:
                        - listitem [ref=f64e278]: Brand
                        - listitem [ref=f64e279]: Color
                        - listitem [ref=f64e280]: Material
                        - listitem [ref=f64e281]: Sizes, volumes
                        - listitem [ref=f64e282]: Power, voltage, current, btu
                    - listitem [ref=f64e283]:
                      - paragraph [ref=f64e284]: Jaccard and Dice distances between query, title, description
                    - listitem [ref=f64e285]:
                      - paragraph [ref=f64e286]: Char n-gram TF-IDF, SVD, NMF based cosine distance and total common term counts
                    - listitem [ref=f64e287]:
                      - paragraph [ref=f64e288]: Extraction of 1, 2 and 3 important nouns in queries, product titles (using noun position) and all nouns in product descriptions (using nltk pos tagger) and quantification of important noun similarities (L1, L2, cosine distances). Incorporated important and unimportant words dictionary published in the forum
                    - listitem [ref=f64e289]:
                      - paragraph [ref=f64e290]: Longest common subsequence between title, brand and query
                    - listitem [ref=f64e291]:
                      - paragraph [ref=f64e292]: Average query and product title, description, attribute, important noun, Wordnet expanded syn/hypo/hypernym similarities using pretrained word2vec models and GloVe word embeddings
                    - listitem [ref=f64e293]:
                      - paragraph [ref=f64e294]: Glove word embedding centroids and distances based on various corpora (pretrained, generated from query+title+description, enriched with Reddit DIY and Home Improvement comments, enriched with Wordnet synonyms)
                      - list [ref=f64e295]:
                        - listitem [ref=f64e296]: Relaxed word movers distance
                        - listitem [ref=f64e297]: Relaxed word movers distance (weighted by query/title word position)
                        - listitem [ref=f64e298]: Cosine distance
                        - listitem [ref=f64e299]: Euclidean distance
                        - listitem [ref=f64e300]: Centroid vectors of query, title, descriptions as features
                    - listitem [ref=f64e301]:
                      - paragraph [ref=f64e302]: BOW, TF-IDF, LSA based features
                      - list [ref=f64e303]:
                        - listitem [ref=f64e304]: Word N-gram TF-IDF cosine distances (N=1,2,3)
                        - listitem [ref=f64e305]: SVD cosine distances (50 dim, 100 dim, 300 dim)
                        - listitem [ref=f64e306]: NMF cosine distances
                        - listitem [ref=f64e307]: Raw SVD vectors as features
                    - listitem [ref=f64e308]:
                      - paragraph [ref=f64e309]: Aggregates by query and product
                      - list [ref=f64e310]:
                        - listitem [ref=f64e311]: Standard deviations, rank transformations, percentiles of distance features
                        - listitem [ref=f64e312]: L1,L2, cosine distances to query and product centroids of SVD/NMF/Glove
                    - listitem [ref=f64e313]:
                      - paragraph [ref=f64e314]: Statistics features
                      - list [ref=f64e315]:
                        - listitem [ref=f64e316]: Num occurrences of query in whole dataset
                        - listitem [ref=f64e317]: Num occurrences of product in whole dataset
                    - listitem [ref=f64e318]:
                      - paragraph [ref=f64e319]: Exploiting the id anomaly
                      - list [ref=f64e320]:
                        - listitem [ref=f64e321]: Boolean indicator id>160,000
                    - listitem [ref=f64e322]:
                      - paragraph [ref=f64e323]: Feature interactions
                      - list [ref=f64e324]:
                        - listitem [ref=f64e325]: 2-way polynomial interactions between top ranking features
                  - paragraph [ref=f64e326]:
                    - strong [ref=f64e327]: Cross-Validation
                  - paragraph [ref=f64e328]: "We used 3 runs of 3-fold cross validation: 2 runs with disjunctive queries (query does not occur in validation sets), 1 run with disjunctive product id, to roughly match the proportions of unseen queries and product ids between train and test."
                  - paragraph [ref=f64e329]:
                    - strong [ref=f64e330]: Modeling and Ensembling
                  - list [ref=f64e331]:
                    - listitem [ref=f64e332]: About 200 L1 models based on various feature subsets, trained with XGB, RFR, ETR, Neural Nets, Random Trees Embedding+Lasso/Ridge, ETC (Regression via Classification)
                    - listitem [ref=f64e333]: L2 Stacking with Bayesian Ridge, 10X bagged Neural Net and 10X bagged ETR, trained for each L1 CV run
                    - listitem [ref=f64e334]: L3 Stacking with ridge regression

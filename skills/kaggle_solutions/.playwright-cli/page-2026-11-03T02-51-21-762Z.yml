                  - generic [ref=f64e813]:
                    - paragraph [ref=f64e814]: I will first mention few lines about the way I cleaned and corrected the text. I worked on it for a month (an hour a day) I guess :) and then there was the google solution :). But - I think my approach was better so I did not use the google one. The reason being my cleaning used a "benefit of doubt" approach - which cleans and corrects with reference to what is it being evaluated against. I guess this is how a human would do too when ranking.
                    - paragraph [ref=f64e815]: Here was my approach .
                    - paragraph [ref=f64e816]: Prelude - I used multithreading heavily to do these processing. Specifically pool.map from multiprocessing.
                    - paragraph [ref=f64e817]: Create a func (say "clean") to do (see attached)
                    - paragraph [ref=f64e818]: a) regex replacements
                    - paragraph [ref=f64e819]: b) segment a word if it has a wordnet synset and more than one segments (using wordsegment). E.g Rainproof gets segmented to rain proof. Some errors do creep in in this step but that is "favourably" corrected later
                    - paragraph [ref=f64e820]: c) check for words which seem like they got stitched together wrongly and split them after checking that the splits result in a good word (from synsets)
                    - paragraph [ref=f64e821]: Level 1
                    - paragraph [ref=f64e822]: "-> Use clean to convert bullets (will call it functionality henceforth), description,brand,material,title,search term"
                    - paragraph [ref=f64e823]: "-> Use words from cleaned title, description,functionality,brand and material to train norvig"
                    - paragraph [ref=f64e824]: Level 2
                    - paragraph [ref=f64e825]: "-> Create a new column by concatenating brand material functionality description and title. Say \"ref\""
                    - paragraph [ref=f64e826]: "-> Check all search terms against its ref and concatenate words which were split in the search. E.g \"deck over\" becomes \"deckover\". This also corrects wrongly segmented words - again with a \"benefit of doubt\""
                    - paragraph [ref=f64e827]: Level 3.
                    - paragraph [ref=f64e828]: "-> Correct the search terms again - this time using ref and the following logic"
                    - paragraph [ref=f64e829]: a) Correct words which are not all Uppercase and alpha and not in enchant dict (used enchant.Dict("en_US"))
                    - paragraph [ref=f64e830]: b) For each such word use norvig to provide list of closest matching words (candidates) for replacement
                    - paragraph [ref=f64e831]: c) Then for each such word use res_similarity and path_similarity to give a preference to candidate words based on neighbouring good words in the search term. This went as we correct. So say you have a search term "dcek paint dor". First I will get all closest words for dcek and then check their similarity to paint and then once I have corrected that to deck , deck paint are neighbouring words when correcting dor and so on.
                    - paragraph [ref=f64e832]: d) Also for each such word use ref to check if any of the candidates words are present in ref and give a preference to be the chosen as the replacement word based on the weight of that word in ref. Weight means the number of times in occurs in ref. This means if there is a word repeated multiple times in ref then that will get more preference being a replaced word than another found only once in ref.
                    - paragraph [ref=f64e833]: e) Some adjustment between c) and d) preferences to sort the candidate words according to preference and chose one replacement word
                    - paragraph [ref=f64e834]: So essentially words in search terms were being corrected based on their "ref" and their neighbouring words.
                    - paragraph [ref=f64e835]: Once I had corrected the fields using this approach, wordvec models, tf models, tf-idf models, tf (char) models, tf-idf (char) models gave me very strong features.

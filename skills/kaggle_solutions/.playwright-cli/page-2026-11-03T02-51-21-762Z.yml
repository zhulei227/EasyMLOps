                - paragraph [ref=f64e1020]: Just to add perhaps a couple of lines to what Alex already mentioned above, we actively tried to get models with high ensambling potential, which means reasonably good on their own but at the same time as little correlated as possible. Having a broad and diverse feature set was one key to that, combining a lot of different algorithms on L1 was another. Using these models with some different sets of hyperparameters, feature reduction/projection/embedding techniques was a third. We even mixed some of the weaker feature subsets on the L1 to get combinations that are on par with the stronger ones. Finally, having a good cross-validation strategy was key, as is most of the time of course.

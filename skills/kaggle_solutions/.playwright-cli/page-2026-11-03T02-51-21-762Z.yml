                  - paragraph [ref=f64e364]: "So here's a brief summary of our solution :"
                  - paragraph [ref=f64e365]:
                    - strong [ref=f64e366]: 1) Cross validation
                  - paragraph [ref=f64e367]: "To evaluate our models accurately, we used 5 validation sets generated with the following rules :"
                  - list [ref=f64e368]:
                    - listitem [ref=f64e369]: 57% of examples must have unseen queries in training part
                    - listitem [ref=f64e370]: For the other queries (seen in training), 60% of examples go to training and 40% go to validation
                    - listitem [ref=f64e371]: Each of the 5 validation samples contains between 25.000 and 30.000 examples
                  - paragraph [ref=f64e372]:
                    - strong [ref=f64e373]: 2) Feature engineering
                  - paragraph [ref=f64e374]: "Combining all 4 team members' datasets, we had more than 4000 features :"
                  - list [ref=f64e375]:
                    - listitem [ref=f64e376]: Counts and metrics such as the ones in Chenglong Crowdflower solution
                    - listitem [ref=f64e377]: Word2Vec/Gensim
                    - listitem [ref=f64e378]: Glove
                    - listitem [ref=f64e379]: Brands
                    - listitem [ref=f64e380]: Measures
                    - listitem [ref=f64e381]: Bullets
                    - listitem [ref=f64e382]: Materials
                    - listitem [ref=f64e383]: Signatures (Collection Name, Artist's name, Artwork name)
                    - listitem [ref=f64e384]: Colors
                    - listitem [ref=f64e385]: Query and title parsing and comparing
                    - listitem [ref=f64e386]: Word features
                    - listitem [ref=f64e387]: Word clustering
                    - listitem [ref=f64e388]: Document clustering
                  - paragraph [ref=f64e389]: With this feature engineering effort, single xgboosts score around 0.435 on public LB
                  - paragraph [ref=f64e390]:
                    - strong [ref=f64e391]: 3) Ensembling and stacking
                  - paragraph [ref=f64e392]: The winning edge came from generating various predictions with xgboost, keras, linear models and others, then stacking them to gain around 0.004 on LB.
                  - paragraph [ref=f64e393]: Cheers !
              - separator [ref=f64e394]

                      - paragraph [ref=f40e459]:
                        - strong [ref=f40e460]: 1) What is "stochastic adversarial blending"?
                        - text: As
                        - link "@andy (opens in a new tab)" [ref=f40e461] [cursor=pointer]:
                          - /url: /andy
                          - text: "@andy"
                        - text: refered in
                        - link "this post (opens in a new tab)" [ref=f40e462] [cursor=pointer]:
                          - /url: https://www.kaggle.com/c/home-credit-default-risk/discussion/61273
                          - text: this post
                        - text: ", we can build a model which can distinguish train or test data. We use that prediction ( adversarial validation ) when blending. The process is as follows,"
                      - list [ref=f40e463]:
                        - listitem [ref=f40e464]: Sample data with a sampling ratio by using adversarial validation as a sampling weight.
                        - listitem [ref=f40e465]: Optimize the weights with train prediction.
                        - listitem [ref=f40e466]: Iterate 1~2 process to get converged weights.
                      - paragraph [ref=f40e467]: This technique propelled our score about 0.0002.
                      - paragraph [ref=f40e468]:
                        - strong [ref=f40e469]: 2) Did you all share the features for each of your models?
                        - text: Some were shared, others were not.
                      - paragraph [ref=f40e470]:
                        - strong [ref=f40e471]: 3) What features did you use for the final blend?
                        - text: For the final blend, we did not use any features. Attached image shows the features used in each model. ( Cardinal numbers were allocated in each feature. )
                      - paragraph [ref=f40e472]:
                        - strong [ref=f40e473]: 4) Were you looking at the CV score to tune your blend?
                        - text: Yes. We monitored both CV and Public LB. We submitted the predictions which have nice score in CV and public LB, both.
                      - paragraph [ref=f40e474]:
                        - strong [ref=f40e475]: 5) Did you all choose the same cv-split for the blend?
                        - text: Actually at first we tried to keep same cv-split. But after some experiments of stacking we did not care cv-split any more. ( Stacking tended to overfit. CV >> LB. So we decided to use only blending. )

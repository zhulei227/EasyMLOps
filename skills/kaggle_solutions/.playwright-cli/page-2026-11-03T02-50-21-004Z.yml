                - generic [ref=f63e140]:
                  - paragraph [ref=f63e141]: "Thank you Matias for the nice summary. I'll give some notes on the \"creative\" xgboost model that Matias mentioned. My main motivation was that training on the group variable might not be the best approach to minimize the mlogloss. So I build a 2-stage model:"
                  - list [ref=f63e142]:
                    - listitem [ref=f63e143]: Predict the probability of gender
                    - listitem [ref=f63e144]: Use gender as additional feature and predict the probability of age groups
                  - paragraph [ref=f63e145]: The clue is that we do not need the gender in the test set to make the prediction because we have to make two predictions for each ID in the test set anyway. First, we assume that the user is female and predict, then we assume that the user is male and predict again.
                  - paragraph [ref=f63e146]:
                    - text: Using the definition of
                    - link "conditional probability (opens in a new tab)" [ref=f63e147] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Conditional_probability
                      - text: conditional probability
                    - text: ", we can combine the predictions for gender and age groups."
                  - paragraph [ref=f63e148]: P(A_i, F) = P(A_i| F) * P(F) for i = 1,…,6 and
                  - paragraph [ref=f63e149]: P(A_i, M) = P(A_i| M) * P(M) for i = 1,…,6.
                  - paragraph [ref=f63e150]: where A_i are the age groups 1 to 6, and F and M are female and male, respectively.
                  - paragraph [ref=f63e151]: At least for me, this approach worked much better than optimizing group probabilities alone. I got 2.25037 on public LB and 2.25484 on private LB with a "single" xgb model.
                  - paragraph [ref=f63e152]: I tried to build this 2-stage model for keras, too. However, it gave me little (if any) boost on my cv, so I did not spend much time on it. But this does not mean that it does not work for keras.

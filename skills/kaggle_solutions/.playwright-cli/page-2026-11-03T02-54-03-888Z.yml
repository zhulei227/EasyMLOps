                  - paragraph [ref=f66e179]: Congratulations to all the winners.
                  - paragraph [ref=f66e180]:
                    - text: My approach is outlined in
                    - link "this" [ref=f66e181] [cursor=pointer]:
                      - /url: https://github.com/wallinm1/kaggle-facebook-bot/blob/master/facebook_notebook.ipynb
                    - text: Jupyter notebook.
                  - paragraph [ref=f66e182]: I used somewhat of a text classification approach. I concatenated the bid entries into one long space-delimited string, and then performed tfidf-vectorization on these text features. The idea was that bots would exhibit certain sequential patterns in their behavior that could be discovered with this type of a text mining approach.
                  - paragraph [ref=f66e183]: In addition to the text features, I also computed some descriptive statistics (median, max, min, range, deciles) for the time differences between bids, along with counts of unique entries for the columns.
                  - paragraph [ref=f66e184]: In CV, the numeric features stood for the majority of the auc-gain, but the text-features definitely helped a bit.

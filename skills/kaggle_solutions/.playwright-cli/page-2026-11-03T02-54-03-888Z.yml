            - paragraph [ref=f66e41]: Solution Writeup · 2nd place · Jun 10, 2015
        - separator [ref=f66e43]
        - generic [ref=f66e44]:
          - generic [ref=f66e46]:
            - paragraph [ref=f66e47]: "Here's a little blurb about how I approached feature generation and cross-validation for this problem:"
            - paragraph [ref=f66e48]: http://small-yellow-duck.github.io/auction.html
            - paragraph [ref=f66e49]: "code: https://github.com/small-yellow-duck/facebook_auction"
            - paragraph [ref=f66e50]: "I used sklearn's RandomForestClassifier. The most useful features I identified were:"
            - list [ref=f66e51]:
              - listitem [ref=f66e52]: the median time between a user's bid and that user's previous bid
              - listitem [ref=f66e53]: the mean number of bids a user made per auction
              - listitem [ref=f66e54]: the entropy for how many bids a user placed on each day of the week
              - listitem [ref=f66e55]: the means of the per-auction URL entropy and IP entropy for each user
              - listitem [ref=f66e56]: the maximum number of bids in a 20 min span
              - listitem [ref=f66e57]: the total number of bids placed by the user
              - listitem [ref=f66e58]: the average number of bids a user placed per referring URL
              - listitem [ref=f66e59]: the number of bids placed by the user on each of the three weekdays in the data
              - listitem [ref=f66e60]: the minimum and median times between a user's bid and the previous bid by another user in the same auction.
              - listitem [ref=f66e61]: the fraction of IPs used by a bidder which were also used by another user which was a bot
            - paragraph [ref=f66e62]: "Cross-validation was a bit tricky: I did CV 100 times on different 80-20 splits. My mean CV score was almost the same (+/- 0.003) as my final leaderboard score."
            - paragraph [ref=f66e63]: "edit to answer some further questions:"
            - paragraph [ref=f66e64]: In order to convert the time scale to hours, I made a bids/unit time histogram and looked at the periodicity - bidding volumes cycled with a period of one day. There are pretty graphs and more details on my github page.
            - paragraph [ref=f66e65]: "A concrete example of the entropy is the IP entropy: N!/(N_{IP1}! N{IP2}!... N{IPn}!). N is the total number of bids and N_{IPn} is the total number of bids placed from the nth IP. (Because the entropy is a large number, I used the log of the entropy.) The entropy is a measure of how both randomly distributed the bids are, how many IPs there are and how many bids there are. A bidder that places all their bids from the same IP has an entropy of N!/N! = 1."
            - paragraph [ref=f66e66]: I used the simple average of five RandomForestClassifiers (each with a different value for the initialization parameter, random_state) to generate the predictions.
            - paragraph [ref=f66e67]: Thanks to everyone else who shared their approaches! I thought that leaving out the bots with only one bid was a clever idea. And I was surprised to see that people got mileage out of the device type.

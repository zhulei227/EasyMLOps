                  - paragraph [ref=f66e308]: Congratulations to the winners, this was a really fun contest!
                  - paragraph [ref=f66e309]:
                    - text: For classification I used a two-stage meta-learner approach with
                    - strong [ref=f66e310]: RF
                    - text: ","
                    - strong [ref=f66e311]: XGBoost
                    - text: and
                    - strong [ref=f66e312]: NN
                    - text: as base learners and a combination of those three as meta learners.
                  - paragraph [ref=f66e313]: "The final features I used are as follows:"
                  - paragraph [ref=f66e314]:
                    - strong [ref=f66e315]: "1."
                    - text: Fraction of auctions won by member (out of total number of auctions member participated in).
                  - paragraph [ref=f66e316]:
                    - strong [ref=f66e317]: "2."
                    - text: Mean fraction of bids made by member (in auctions member participated in).
                  - paragraph [ref=f66e318]:
                    - strong [ref=f66e319]: "3."
                    - text: Mean fraction of bids made by member within first 10% of bids (in auctions member participated in).
                  - paragraph [ref=f66e320]:
                    - strong [ref=f66e321]: "4."
                    - text: Mean fraction of bids made by member within last 25% of bids (in auctions member participated in).
                  - paragraph [ref=f66e322]:
                    - strong [ref=f66e323]: "5."
                    - text: Mean fraction of bids made by member (in auctions member won).
                  - paragraph [ref=f66e324]:
                    - strong [ref=f66e325]: "6."
                    - text: Mean fraction of bids made by member within first 10% of bids (in auctions member won).
                  - paragraph [ref=f66e326]:
                    - strong [ref=f66e327]: "7."
                    - text: Mean fraction of bids made by member within last 25% of bids (in auctions member won).
                  - paragraph [ref=f66e328]:
                    - strong [ref=f66e329]: 8. , 9. , 10.
                    - text: Max, Mean and Standard Deviation of number of auctions member is active in per minute.
                  - paragraph [ref=f66e330]:
                    - strong [ref=f66e331]: 11., 12., 13.
                    - text: Max, Mean and Standard Deviation of number of auctions member is active in per hour.
                  - paragraph [ref=f66e332]:
                    - strong [ref=f66e333]: 14.,15.,16.
                    - text: Probability of bot given Country, Merchandise search category, and device
                  - paragraph [ref=f66e334]:
                    - strong [ref=f66e335]: 17., 18., 19.
                    - text: Max, Mean and Standard Deviation of number of ips used per minute.
                  - paragraph [ref=f66e336]:
                    - strong [ref=f66e337]: 20., 21., 22.
                    - text: Max, Mean and Standard Deviation of number of ips used per hour.
                  - paragraph [ref=f66e338]:
                    - strong [ref=f66e339]: "23."
                    - text: "Probabilty of being referred by url : 'vasstdc27m7nks3'"
                  - paragraph [ref=f66e340]:

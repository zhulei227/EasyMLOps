                - generic [ref=f66e534]:
                  - paragraph [ref=f66e535]: Congrats to the winners! This was a pretty fun competition; figuring out whether my CV scores were lying or not was interesting to say the least.
                  - paragraph [ref=f66e536]: "I used the following features:"
                  - list [ref=f66e537]:
                    - listitem [ref=f66e538]: number of bids made at the absolute minimum time delta for each bidder
                    - listitem [ref=f66e539]: number of bids made at one single time stamp (essentially counting how many simultaneous bids were made, either in one auction, or across multiple auctions)
                    - listitem [ref=f66e540]: number of bids per bidder in each quarter of the auction
                    - listitem [ref=f66e541]: number of devices, countries, urls, auctions, ip addresses per bidder
                    - listitem [ref=f66e542]: changes in ip, url, country, device per bidder
                    - listitem [ref=f66e543]: average of the time delta between a bidder beating a previous bidder's bid
                    - listitem [ref=f66e544]: average time delta between the times each bidder places a bid
                    - listitem [ref=f66e545]: Features 1-5 were divided by the total number of bids made by each bidder
                  - paragraph [ref=f66e546]: I realized my best scores with XGBoost and 10 fold stratified CV 10 times. My best single model score came as a result of using about half the features listed above. I then used the unused features with the first half to create an ensemble which put me near the top 10% on the public leader board. After which I hit a wall and couldn't really see any ways of improving my score. I am very happy to see that my ensemble moved me closer to the top 5% on the private leader board however!
                  - paragraph [ref=f66e547]: I just want to add one interesting note, K nearest neighbours (using 30 neighbours, and a distance based weight per neighbour) worked surprisingly well with only 5 features. Using the log transformed number of bids, devices, countries, auctions and urls per bidder, I was able to get a score of 0.885 on the public leader board (0.90559 on the private). Not bad for about 15 minutes of effort :)

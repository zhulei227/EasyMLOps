                  - paragraph [ref=f66e989]: For bidding pattern in an auction, I count how often people make continuous bids; the portions of bids in first 10%,30%50%, last 10% 30% 50% of an auction; the maximum number of bids made in an auction(average over all auctions by the bidder and calculate the difference between maximum and mean) ...
                  - paragraph [ref=f66e990]: I also split the ip, address and account into two parts and take the first part as feature, but I don't think it help the performance.

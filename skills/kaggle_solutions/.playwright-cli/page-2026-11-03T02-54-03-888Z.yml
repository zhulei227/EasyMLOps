                  - paragraph [ref=f66e386]: "Congrats to all the winners!I used scikit learn RandomForestClassifier algorithm.List of decent features according to cross-validation feature selection method I used:1. absolute number of bids per user.2. num uniq devices, auctions, ips and urls3. avg and first-non-zero time diffs between user bids4. percentage of bids made with favorite(most common) device5. percentage of bids made from favorite country6. max number of bids in a single auction7. number of simultaneous bids8. number of device switches, numer of auctions switches, number of ips switches, number of countries switches e.g. this sequence corresponds to 3 'switches' (with 2 devices): [dev1, dev1, dev2, dev2, dev2, dev2, dev1]9. percentage of user bids made in first/last 5% of auction observed timeline (observed timeline doesn't correspond to real auction timeline, but in my opinion still helps to understand if user prefers to bid at the beginning or end of an auction)10. average number of transaction in the same country in 1-hour window with various normalizations (in my opinion this feature roughly reflects user favorite bidding time of the day)11. two categ->response transformations features. average response for country and device. the same idea as discussed here: https://www.kaggle.com/forums/f/15/kaggle-forum/t/8005/replacing-categorical-variables-with-historic-response-rate"
                  - paragraph [ref=f66e387]: there were also a few other trivial features

                  - paragraph [ref=f66e1192]: Hi Dario,
                  - paragraph [ref=f66e1193]: The feature calculation consists of two parts one is to determine what is the probability of bots using the "search category" and then to determine what is the weighted probability of a member being a bot based on the number of bids of that member that originated with certain "search categories".
                  - paragraph [ref=f66e1194]: "To make it a little clear, I have provided an example below:"
                  - paragraph [ref=f66e1195]: User ID Bot Search Category Bidsu1 Yes s1 5u1 Yes s2 4u1 Yes s3 5u1 Yes s4 1u2 No s1 10u2 No s2 8u2 No s3 9u2 No s4 7u3 No s3 11u3 No s4 12
                  - paragraph [ref=f66e1196]: "Now Step 1:"
                  - paragraph [ref=f66e1197]: Search Category Humans Using It Bots Using It p(Bot Use|Search Category)s1 1 1 0.5s2 1 1 0.5s3 2 1 0.33s4 2 1 0.33
                  - paragraph [ref=f66e1198]: "Now Step 2 (calculation of bid weighted probabiliies):"
                  - paragraph [ref=f66e1199]: User ID Bot Search Category Bids p(Bot Use| Search Category ) Bid Weighted Probabilities u1 Yes s1 5 0.5 2.5
                  - paragraph [ref=f66e1200]: u1 Yes s2 4 0.5 2
                  - paragraph [ref=f66e1201]: u1 Yes s3 5 0.33 1.65
                  - paragraph [ref=f66e1202]: u1 Yes s4 1 0.33 0.33
                  - paragraph [ref=f66e1203]: u2 No s1 10 0.5 5
                  - paragraph [ref=f66e1204]: u2 No s2 8 0.5 4
                  - paragraph [ref=f66e1205]: u2 No s3 9 0.33 2.97
                  - paragraph [ref=f66e1206]: u2 No s4 7 0.33 2.31
                  - paragraph [ref=f66e1207]: u3 No s3 11 0.33 3.63
                  - paragraph [ref=f66e1208]: u3 No s4 12 0.33 3.96
                  - paragraph [ref=f66e1209]: "Now finally to calculate P(Bot|Search Usage) (Bids weighted average of P(Bot usage|Search Categories):"
                  - paragraph [ref=f66e1210]: For u1 = (2.5 + 2 + 1.65 + 0.33)/(5 + 4 + 5 + 1) = 0.432
                  - paragraph [ref=f66e1211]: For u2 = (5 + 4 + 2.97 + 2.31)/(10 + 8 + 9 + 7) = 0.42
                  - paragraph [ref=f66e1212]: For u3 = (3.63 + 3.96)/(11+12) = 0.33
                  - paragraph [ref=f66e1213]: Now these values are Feature 15. Hopefully, I could explain the calculations a bit more clearly this time around! :) Some members do have similar values, but never the same, there is always some difference (unless of course two members had the exact same number of bids within the exact same search categories and used the same search categories [rarely happens]). That being said, I did not try any extensive dummification approaches, and have no idea how dummification would have fared. :) I would love to hear about it, when you have had time to compare the approaches.
                  - paragraph [ref=f66e1214]: Discussions are always welcome on Kaggle forums (in my opinion :D ), and of course I would be happy to discuss feature construction with you further. I have a lot to learn as well. :)

                  - paragraph [ref=f66e983]: Thanks for sharing your approach so fast!
                  - paragraph [ref=f66e984]:
                    - text: "Quick question:"
                    - strong [ref=f66e985]: how do you average your five RF models, just arithmetric average or average the rank?
                    - text: I didn't got the chance to try different averaging approach, a ranking average of four single models :one from xgboost, three from sklearn(randomforest, gradient boost, extra tree) boost my score by 0.002, is there better ways to ensemble?
                  - paragraph [ref=f66e986]: I was working with entropy all the time in my research, never thought of using it to generate features for this competition...shame on me...
                  - paragraph [ref=f66e987]: For me, besides the obvious counting features and their ratios(number of bids, number of auctions, number of ip, number of country...),

                - generic [ref=f66e757]:
                  - paragraph [ref=f66e758]: "[quote=fakeplastictrees;81331]"
                  - paragraph [ref=f66e759]: One final trick that may have made the difference is that I looked at the histogram of the number of bids made by each bot in the training set. There were 5 bots that made just one bid, which looked anomalous to my eye. I wondered if this might not help to predict on a different data set so I submitted an entry which was just my main model but trained on the training set without these five bots. I think this one was the winner, but I’ll confirm when I can see all my submission private scores.
                  - paragraph [ref=f66e760]: "[/quote]"
                  - paragraph [ref=f66e761]: Even though my final score is dreadful due to starting the competition really late, I can add to this.Removing the 5 bots that made just one bid increased my CV auc by ~0.03, however adding another step at postprocessing increased the public leaderboard score by about 0.02 aswell.
                  - paragraph [ref=f66e762]: I searched for the "signatures" of the bids of the five bots that were banned just after one bid in the bid dataset, and it appeared that each one of them had the same signature as a detected bot with a number of bids > 1.The signatures were the auction, referral site, time, device, ip and (obviously) country of the bids. If there were two bids that had equal information, and one bid belonged to a bot bidder, the other bid was also flagged as a bot bidder.So I added a post-processing step which searched for all the matches (test set bid - train set flagged bot bid) after classification, and flagged them as a highly probable bot.
                  - paragraph [ref=f66e763]: Unfortunately, since I had only three submissions to use, I couldn't experiment with searching for matches in the test set as well (same signature as a highly probable bot from the test set), and then copying the probabilities to the max of the two.

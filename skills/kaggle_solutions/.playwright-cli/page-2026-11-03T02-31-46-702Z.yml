              - text: .
            - paragraph [ref=f27e52]: This post is part of the 2nd place solution in LB 0.949 (LB 0.971 with leak).
            - paragraph [ref=f27e53]:
              - link "Brief Summary (opens in a new tab)" [ref=f27e54] [cursor=pointer]:
                - /url: https://www.kaggle.com/competitions/foursquare-location-matching/discussion/336062
                - text: Brief Summary
            - paragraph [ref=f27e55]: Other part
            - list [ref=f27e56]:
              - listitem [ref=f27e57]:
                - link "Candidate Generation (opens in a new tab)" [ref=f27e58] [cursor=pointer]:
                  - /url: https://www.kaggle.com/competitions/foursquare-location-matching/discussion/336072
                  - text: Candidate Generation
            - 'heading "Stack-part 1: Binary classification of matches" [level=2] [ref=f27e59]'
            - paragraph [ref=f27e60]: "Using the candidate matches created in the previous stage, we ensemble three models: GBDT (XGBoost, lightGBM), BERT(xlm-roberta-base). For this id-pair (e.g., src_id, dst_id), GBDT mainly used the edit distance feature, while BERT used text created in particular columns. These models classified whether the pair matched or not."
            - heading "GBDT" [level=3] [ref=f27e61]
            - heading "Features" [level=4] [ref=f27e62]
            - paragraph [ref=f27e63]:
              - text: XGBoost features were created by colum2131 (
              - link "@columbia2131 (opens in a new tab)" [ref=f27e64] [cursor=pointer]:
                - /url: /columbia2131
                - text: "@columbia2131"
              - text: ), and lightGBM features by ria (
              - link "@no9more9ria10 (opens in a new tab)" [ref=f27e65] [cursor=pointer]:
                - /url: /no9more9ria10
                - text: "@no9more9ria10"
              - text: "). Although there are some differences in each feature, the following XGBoost’s features were below:"
            - list [ref=f27e66]:
              - listitem [ref=f27e67]:
                - text: Features generated independently with src_id and dst_id
                - list [ref=f27e68]:
                  - listitem [ref=f27e69]: latitude / longitude
                  - listitem [ref=f27e70]: country with ordinal-encoding
                  - listitem [ref=f27e71]: categories with ordinal-encoding
              - listitem [ref=f27e72]:
                - text: Features generated dependently with src_id and dst_id
                - list [ref=f27e73]:
                  - listitem [ref=f27e74]:
                    - text: Edit distance (name, categories, address, city, state, zip, url, phone)
                    - list [ref=f27e75]:
                      - listitem [ref=f27e76]: gesh
                      - listitem [ref=f27e77]: leven
                      - listitem [ref=f27e78]: jaro
                      - listitem [ref=f27e79]: simple_ratio (RapidFuzz)
                      - listitem [ref=f27e80]: partial_ratio (RapidFuzz)
                      - listitem [ref=f27e81]: token_set_ratio (RapidFuzz)
                      - listitem [ref=f27e82]: token_sort_ratio (RapidFuzz)
                      - listitem [ref=f27e83]: token_ratio (RapidFuzz)
                      - listitem [ref=f27e84]: partial_token_ratio (RapidFuzz)
                      - listitem [ref=f27e85]: wratio (RapidFuzz)
                      - listitem [ref=f27e86]: qratio (RapidFuzz)
                  - listitem [ref=f27e87]:
                    - text: Set similarity with .split(“ ” or “, “) (name, cateogires)
                    - list [ref=f27e88]:
                      - listitem [ref=f27e89]: jaccard
                      - listitem [ref=f27e90]: dice
                      - listitem [ref=f27e91]: sympson
                  - listitem [ref=f27e92]:
                    - text: Cosine similarity of vectors encoded by tf-idf (name, categories, address, all)
                    - list [ref=f27e93]:
                      - listitem [ref=f27e94]: tfidf(ngram_range=(1, 1), analyzer=‘word’)
                      - listitem [ref=f27e95]: tfidf(ngram_range=(1, 3), analyzer=‘char’)
              - listitem [ref=f27e96]:
                - text: Others
                - list [ref=f27e97]:
                  - listitem [ref=f27e98]: probability by transformer
            - heading "Modeling" [level=5] [ref=f27e99]
            - paragraph [ref=f27e100]: The cross-validation of the train data was purposely split so that leakage would occur. Specifically, instead of the folds with GroupKFold(n_splits=2, group=‘point_of_interest’), we created new folds with GroupKFold(n_splits=5, group=‘src_id’). This leakage improved the CV and Public LB because train and test data contained common records. We suspect that the latitude and longitude variables and the ordinal categories worked effectively as features to represent the common id’s records.
            - heading "BERT" [level=3] [ref=f27e101]
            - heading "Text & Numerical-Features" [level=4] [ref=f27e102]
            - paragraph [ref=f27e103]: The text was defined as each lowercased name and cateogires connected by a SEP-token and country. Additionally, the numerical feature was logarithmic variables of haversine distance.
            - code [ref=f27e105]: "def get_basearray(cfg, df): cfg.idx2id = df['id'].fillna('').to_numpy() cfg.id2idx = {c: i for i, c in enumerate(cfg.idx2id)} cfg.idx2name = df['name'].fillna('').str.lower().to_numpy() cfg.idx2categories = df['categories'].fillna('').str.lower().to_numpy() cfg.idx2address = df['address'].fillna('').str.lower().to_numpy() return cfg def get_text(cfg, i, j): # {i: index of src_id, j: index of dst_id} text = cfg.idx2country[i]+cfg.sep+\\ 'name1 '+cfg.idx2name[i]+cfg.sep+'category1 '+cfg.idx2categories[i]+\\ cfg.sep + cfg.sep +\\ 'name2 '+cfg.idx2name[j]+cfg.sep+'category2 '+cfg.idx2categories[j] return text"
            - heading "Model Training" [level=4] [ref=f27e106]
            - paragraph [ref=f27e107]: "The architecture of BERT is below:"
            - code [ref=f27e109]: "class CustomModel(nn.Module): def __init__(self, cfg, criterion): super().__init__() self.cfg = cfg self.criterion = criterion self.config = AutoConfig.from_pretrained( cfg.MODEL_PATH, output_hidden_states=True ) self.config.attention_probs_dropout_prob = 0.0 self.config.hidden_dropout_prob = 0.0 self.backbone = AutoModel.from_pretrained( cfg.MODEL_PATH, # xlm-roberta-base config=self.config ) self.linear1 = nn.Sequential( nn.Linear(self.config.hidden_size+len(cfg.num_cols), 1024), nn.SELU(), nn.Linear(1024, 1) ) def forward(self, inputs, labels=None): outputs = self.backbone( inputs['input_ids'], attention_mask=inputs['attention_mask'] )[\"last_hidden_state\"] outputs = outputs[:, 0, :] outputs = torch.cat(( outputs, inputs['num_features'] ), dim=1) logits = self.linear1(outputs).flatten() loss = self.criterion(logits, labels) return logits, loss"
            - paragraph [ref=f27e110]: This model was trained for 5 epochs on all train data.
            - heading "Leak Post Process" [level=2] [ref=f27e111]
            - paragraph [ref=f27e112]: As mentioned in other discussions, there was a duplication of train data in the test data. Therefore, the some test data was merged with the train data, and matches were created with the same poi. The prediction of LB0.949 was overwritten. We processed this matches overwriting the matches of LB0.949. Note that train.csv is replaced on submit, so we created a separate train.csv dataset.
            - code [ref=f27e114]: "import cudf train = cudf.read_feather(‘../input/4sq-train-data-copy-feather/train.ftr’).fillna(‘[NAN]‘) test = cudf.read_csv(‘../input/foursquare-location-matching/test.csv’, dtype=str).fillna(‘[NAN]’) cols = [‘name’, ‘latitude’, ‘longitude’] test = test.merge(train[cols+[‘point_of_interest’]], on=cols, how=‘left’) test[[‘id’, ‘point_of_interest’]].to_pandas().to_csv(‘id2poi.csv’, index=False) id2poi = pd.read_csv('id2poi.csv') match_dict = {} for poi, group_df in id2poi.groupby('point_of_interest'): ids = set(group_df['id'].tolist()) for id_str in ids: match_dict[id_str] = ids sub = pd.DataFrame({ ‘id’: sub_dict.keys(), ‘matches’: [ match_dict.get(key, value) for key, value in sub_dict.items() ] }) sub[‘matches’] = sub[‘matches’].map(lambda x: ' ’.join(x)) http://sub.to_csv(‘submission.csv’, index=False)"

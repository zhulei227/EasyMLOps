                - generic [ref=f24e294]:
                  - paragraph [ref=f24e295]: Thanks for that description Paul, Dmitry and everyone else who's sharing their final code. Paul described my code correctly, I'll just add a little more detail here.
                  - paragraph [ref=f24e296]:
                    - text: My plan was to make 1 set of sparse features using Miroslaw's code (
                    - link "details here" [ref=f24e297] [cursor=pointer]:
                      - /url: ../5258/how-i-modified-miroslaw-s-code
                    - text: ) to use with logistic regression and other sparse classifiers. Then I made a second set of non-sparse features for ensemble methods.
                  - paragraph [ref=f24e298]: "My ensemble features:"
                  - list [ref=f24e299]:
                    - listitem [ref=f24e300]: The original categorical variables, with role_title and role_family merged (title is a subset of family) and rollups1&2 merged (1 is almost a subset of 2). I figured this would speed things up over the dozens or hundreds of times I ran the code and allow the algorithms to focus on the more informative interactions.
                    - listitem [ref=f24e301]: Counts of the remaining 5 variables.
                    - listitem [ref=f24e302]: "% of a categorical variable's total requests coming from each particular resource."
                    - listitem [ref=f24e303]: The number of unique resources that a MGR_ID received requests for.
                  - paragraph [ref=f24e304]: "I tried these but didn't use them:"
                  - list [ref=f24e305]:
                    - listitem [ref=f24e306]: "% of a resource's requests coming from a particular department."
                    - listitem [ref=f24e307]: The number of unique resources that each variable (aside from MGR_ID) received requests for.
                    - listitem [ref=f24e308]: The number of unique counts of each variable that each resource received requests for.
                    - listitem [ref=f24e309]: 2nd order feature counts.
                  - paragraph [ref=f24e310]:
                    - text: I put all these features into a RandomForest, an ExtraTreesForest and a GBM. Then I blended them using logistic regression after transforming them with an inverse sigmoid function, which was an idea I got from user
                    - link "hornar" [ref=f24e311] [cursor=pointer]:
                      - /url: ../../../../../users/8531/hornar
                    - link "on this thread" [ref=f24e312] [cursor=pointer]:
                      - /url: ../4928/combining-the-results-of-various-models/26866#post26866
                    - text: ". The blend RF:ET:GB was about 0.25 : 1 : 0.10."
                  - paragraph [ref=f24e313]: The ensemble blend scored 0.90428 on the private board, vs. 0.91387 for my best logistic. But blended 1:2 they got 0.92059.
                  - paragraph [ref=f24e314]: I relied less than Paul on CV scores because of rare feature issues. I think that turned out to be OK, my private scores ended up being very consistently 0.004 lower +/-. 0.001. And the difference between public and private was more stable than the CV vs. public difference. But then again Paul's solo score was much higher than mine!

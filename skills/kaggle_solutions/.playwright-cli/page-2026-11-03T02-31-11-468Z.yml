      - generic [ref=f24e31]: Winning solution code and methodology — Amazon.com - Employee Access Challenge
      - separator [ref=f24e32]
      - generic [ref=f24e34]:
        - generic [ref=f24e35]:
          - heading "Winning solution code and methodology" [level=1] [ref=f24e36]
          - generic [ref=f24e37]:
            - link [ref=f24e38] [cursor=pointer]:
              - /url: /competitions/amazon-employee-access-challenge
              - paragraph [ref=f24e40]: Amazon.com - Employee Access Challenge
            - paragraph [ref=f24e41]: Solution Writeup · 1st place · Aug 4, 2013
        - separator [ref=f24e43]
        - generic [ref=f24e44]:
          - generic [ref=f24e46]:
            - paragraph [ref=f24e47]: Hi everyone,
            - paragraph [ref=f24e48]: "I just released the code for our solution on Github. It is published under a MIT License:"
            - paragraph [ref=f24e49]:
              - link "https://github.com/pyduan/amazonaccess" [ref=f24e50] [cursor=pointer]:
                - /url: https://github.com/pyduan/amazonaccess
            - paragraph [ref=f24e51]: I did some refactoring but more may be needed. In particular, I have pretty much left Ben's code as is (in BSMan/) and only made minor modifications to files that I have integrated into my own code but haven't written myself (in external/). I'll do some additional cleaning if I have time.
            - paragraph [ref=f24e52]: As of now, the code that is being ran when launching classifier.py is my model (which include some of Ben's features) -- to obtain the final blend, one must run Ben's code independently then merge the predictions (which can be done by slightly modifying combine.py, which was written ad-hoc and which I haven't generalized yet). As you can see, the skeleton is basically the same as the one I used in the starter code I published.
            - paragraph [ref=f24e53]: Also, special thanks to Miroslaw, whose code I shamelessly copied to create some of my datasets.
            - paragraph [ref=f24e54]
            - paragraph [ref=f24e55]:
              - strong [ref=f24e56]: Methodology
              - text: ":"
            - paragraph [ref=f24e57]: The final prediction is a weighted average of my code (2/3) and Ben's (1/3).
            - paragraph [ref=f24e58]
            - paragraph [ref=f24e59]: Benjamin Solecki
            - paragraph [ref=f24e60]:
              - text: Ben's approach is itself a blend of a logistic model and a mixture of tree-based models. He explained his approach for the logistic model in more detail
              - link "here" [ref=f24e61] [cursor=pointer]:
                - /url: ../../c/amazon-employee-access-challenge/forums/t/5258/how-i-modified-miroslaw-s-code/28026#post28026
              - text: . As for the tree-based models, it is a combination of Random Forests, GBMs, and Extremely Randomized Trees that are grown using features based on counts and frequencies (e.g. number of resources managed by a given manager, etc.). I'll let him explain his approach further if he wishes to -- we merged comparatively late in the game (2 weeks before the deadline) so I would risk misrepresenting his train of thoughts.
            - paragraph [ref=f24e62]
            - paragraph [ref=f24e63]: Paul Duan
            - paragraph [ref=f24e64]: As for mine, it was mainly driven by the fact that the structure of the dataset contained all categorical variables, with a large number of categories and some rare features. This meant that stability was a high priority, ie. models should be relatively robust to changes in the composition of the dataset. I believe this is what in the end helped our score to drop less than the other top competitors from the public leaderboard to the private one.
            - paragraph [ref=f24e65]: "As such:"
            - paragraph [ref=f24e66]: "- I trusted my CV score above all else, which was obtained by repeating a 80/20 train/test split 10 times. I would then select the models not only based on raw score, but also on the standard deviation between the 10 folds."
            - paragraph [ref=f24e67]: I made no attempt at fixing the discrepancy between CV and leaderboard scores that was due to the fact that all categories in the test set appeared in the train set, which was not necessarily the case when doing a CV split. The reasoning being that the best model would need to be resistant to a change in the split.
            - paragraph [ref=f24e68]: "- I removed role 1 and role 2 from the original columns, as their effect was too strong and seemed to cause too much variance; I suspect that the algorithms weren't too good at dealing with unknown role IDs (they were the ones with the fewest number of categories, so the models tended to trust them too much)"
            - paragraph [ref=f24e69]: "- I spent comparatively very little time on feature selection (which was a big subject in this competition, judging by the forums), as they would be highly dependent on the makeup of the dataset. I did, however, reuse some of Miroslaw's code to generate three different datasets built by using greedy feature selection with different seeds. This was not critical to the raw performance of the blend but did help diversifying it/reducing the variance."
            - paragraph [ref=f24e70]:
              - text: "- I considered feature"
              - emphasis [ref=f24e71]: extraction
              - text: to be much more important to feature
              - emphasis [ref=f24e72]: selection
              - emphasis
            - paragraph [ref=f24e73]: "- my classifier consists of a large combination of models (~15 currently) that are each either using a different algorithm or a different feature set. The top 3-5 models are probably enough to reach .92+ on the private leaderboard, but I found adding additional variants to the datasets helped minimize variance."
            - paragraph [ref=f24e74]: I then combined them by computing their predictions using cross-validation, and combining them using a second model (stacking). When training the second model, I also added meta-features (nb of time this resource/manager/etc appeared in the training set, etc.), the idea being to try to determine dynamically which model should be trusted the most (some perform better when the manager is unknown, etc.).
            - paragraph [ref=f24e75]: Each dataset consists of what I called base data sets (combination of the original columns) and extracted feature sets.
            - paragraph [ref=f24e76]: The extracted feature sets are based on cross-tabulating all categories and looking at the counts manager/resource/etc X had been associated with role/department/etc Y, and so on (in feature_extraction.py, this is what I called the pivot tables; the features sets are lists of lambda functions that extract the relevant cell in the table).
            - paragraph [ref=f24e77]
            - paragraph [ref=f24e78]:
              - strong [ref=f24e79]: Usage
            - paragraph [ref=f24e80]: To run the code, you'll need Python, numpy/scipy and pandas installed. Pandas is not really necessary for the most part, but it is used in some of the external code; I may rewrite them to remove this dependency when I have the time.
            - paragraph [ref=f24e81]: The usage is described on the Github page (to create a submission made up of a simple average of the models in my blend, simply run python classifier.py -v -f testsubmission and it should show up in your submissions/ folder. This should net you a private leaderboard score of .92330. To get the full .92360, you'll need to also run BSMan's code in the BSMan/ folder then combine all predictions according to a 2/3 1/3 split, where BSMan's final prediction is itself a 2/3 1/3 combination of his logistic model and ensemble models.
            - paragraph [ref=f24e82]: Runtime for my models should be ~30 minutes per fold, considerably less if you remove some models (simply comment out some strings in the model list, especially the GBC ones), and considerably more if you enable stacking as this will require cross-validated predictions on the training set to be computed as well.
            - paragraph [ref=f24e83]: Everything is cached so you'll never have to compute the same thing twice -- it also means that you should have some disk space available (the cache may grow to a couple gigabytes).
            - paragraph [ref=f24e84]
            - paragraph [ref=f24e85]: Paul

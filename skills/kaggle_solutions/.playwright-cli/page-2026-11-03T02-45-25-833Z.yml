            - 'heading "Part of 3rd Place Sol: Multi-label Classifier-based PP" [level=3] [ref=f50e196]'
            - generic [ref=f50e199]:
              - paragraph [ref=f50e200]:
                - text: "Codes:"
                - link "https://github.com/shinsiangchoong/kaggle_vinbigdata_classifierPP_2021 (opens in a new tab)" [ref=f50e201] [cursor=pointer]:
                  - /url: https://github.com/shinsiangchoong/kaggle_vinbigdata_classifierPP_2021
                  - text: https://github.com/shinsiangchoong/kaggle_vinbigdata_classifierPP_2021
              - paragraph [ref=f50e202]:
                - text: We would like to thank the competition host(s) and Kaggle for organizing the competition, and congratulate all the winners, and anyone who benefited in some way from the competition. Special thanks to my teammates
                - link "@erniechiew (opens in a new tab)" [ref=f50e203] [cursor=pointer]:
                  - /url: /erniechiew
                  - text: "@erniechiew"
                - text: ","
                - link "@scusywxy (opens in a new tab)" [ref=f50e204] [cursor=pointer]:
                  - /url: /scusywxy
                  - text: "@scusywxy"
                - text: ","
                - link "@zehuigong (opens in a new tab)" [ref=f50e205] [cursor=pointer]:
                  - /url: /zehuigong
                  - text: "@zehuigong"
                - text: ", and"
                - link "@stephkua (opens in a new tab)" [ref=f50e206] [cursor=pointer]:
                  - /url: /stephkua
                  - text: "@stephkua"
                - text: who carried me in the competition especially for the detector part.
              - paragraph [ref=f50e207]:
                - text: This is a summary of our
                - strong [ref=f50e208]: Multi-label Classifier-based Post-Processing (PP)
                - text: . Another part of the solution (for the detector etc.) can be found
                - link "here (opens in a new tab)" [ref=f50e209] [cursor=pointer]:
                  - /url: https://www.kaggle.com/c/vinbigdata-chest-xray-abnormalities-detection/discussion/229769
                  - text: here
                - text: .
              - heading "PP Suggested in Public Notebooks" [level=2] [ref=f50e210]
              - paragraph [ref=f50e211]:
                - text: I believe most participants are using 2-class classifier(s) for PP. In most public notebooks (e.g.
                - link "this notebook (opens in a new tab)" [ref=f50e212] [cursor=pointer]:
                  - /url: https://www.kaggle.com/awsaf49/vinbigdata-2-class-filter
                  - text: this notebook
                - text: ), when the 2-class classifier confidence is below a certain threshold, the predicted boxes are removed.
              - heading "Multiplication of Classifier and Detector Confidences" [level=2] [ref=f50e213]
              - paragraph [ref=f50e214]: We tried a different way instead of just removing the boxes, i.e. if the classifier is confident that the image is a normal image, we scale down the box confidences by multiplying them with the classifier confidence.
              - heading "Our 2-Class Classifier" [level=2] [ref=f50e215]
              - list [ref=f50e216]:
                - listitem [ref=f50e217]: "Model: EfficientNet-B6, 5 folds"
                - listitem [ref=f50e218]: "Image Size: 512 x 512"
                - listitem [ref=f50e219]: "Augmentation:"
              - list [ref=f50e220]:
                - listitem [ref=f50e221]: HorizontalFlip(p = 0.5)
                - listitem [ref=f50e222]: ShiftScaleRotate(rotate_limit = 10),
                - listitem [ref=f50e223]: RandomBrightnessContrast(p = 0.2),
                - listitem [ref=f50e224]: CLAHE(clip_limit=4.0, tile_grid_size=(8, 8), p = 0.5),
                - listitem [ref=f50e225]: Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225))
              - list [ref=f50e226]:
                - listitem [ref=f50e227]: "Optimizer: Adam, BS = 4, BCE loss, LR=0.001, ReduceLROnPlateau + EarlyStopping"
                - listitem [ref=f50e228]: "Val AUC: 0.9868"
              - paragraph [ref=f50e229]:
                - text: We found out that this classifier actually performs worse than
                - link "this notebook (opens in a new tab)" [ref=f50e230] [cursor=pointer]:
                  - /url: https://www.kaggle.com/awsaf49/vinbigdata-2-class-filter
                  - text: this notebook
                - text: "on the public LB. We did not further try another 2-class classifier model. By applying the notebook’s classifier predictions on our final detector (also following its threshold), the scores are as follows: Remove Predicted Boxes: Public=0.315, Private=0.292 Multiplication with 2-class-filter score: Public=0.319, Private=0.295"
              - heading "Our Multi-label Classifiers" [level=2] [ref=f50e231]
              - paragraph [ref=f50e232]: "We also tested a multi-label classifier. The Intuitions are as follows:"
              - list [ref=f50e233]:
                - listitem [ref=f50e234]: All these classes interact with each other, a multi-label classifier may be able to capture their interactions and learn better.
                - listitem [ref=f50e235]: Is it better if we could do class-independent PP for each class?
              - paragraph [ref=f50e236]: "Model Details:"
              - list [ref=f50e237]:
                - listitem [ref=f50e238]: "Model: EfficientNet-B4, 5 folds"
                - listitem [ref=f50e239]: "Labels: 15 classes, A class of an image is labelled 1/0.67/0.33 if 3/2/1 radiologists annotated the class on the image."
                - listitem [ref=f50e240]: "Image Size: 1024x1024, 1024x1024_with_fixed_aspect_ratio, 1280x1280_with_fixed_aspect_ratio (weighted average of 3 models)"
                - listitem [ref=f50e241]: "Augmentation:"
              - list [ref=f50e242]:
                - listitem [ref=f50e243]: HorizontalFlip(p=0.5),
                - listitem [ref=f50e244]: ShiftScaleRotate(scale_limit = 0.15, rotate_limit = 10, p = 0.5),
                - listitem [ref=f50e245]: RandomBrightnessContrast(p=0.5),
                - listitem [ref=f50e246]: Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225))
              - list [ref=f50e247]:
                - listitem [ref=f50e248]: "Optimizer: SGD(momentum=0.9), BS = 2, BCE loss for each class, LR=0.001, ReduceLROnPlateau + EarlyStopping"
                - listitem [ref=f50e249]: "Class14 AUC: 1024x1024: 0.9923 1024x1024_with_fixed_aspect_ratio: 0.9937 1280x1280_with_fixed_aspect_ratio: 0.9940"
              - paragraph [ref=f50e250]: "Worthy mentioning that training with multi labels could also improve class14 AUC. We tried 2 multiplication-based PP methods using this classifier:"
              - list [ref=f50e251]:
                - listitem [ref=f50e252]: "Multiplication with classifier score of respective class: If the classifier score of the class is less than a threshold, the box confidences of the class are scaled down by multiplying the classifier score of the class. We also implemented class-independent thresholds based on the validation AUCs of the classes, i.e. classifier scores of classes with higher validation AUC are allowed to multiply the box confidences of more images."
                - listitem [ref=f50e253]: "Multiplication with class14 score only: This is similar to the 2-class classifier but note that the multi-label training has also improved the class14 performance."
              - paragraph [ref=f50e254]: "Results: Multiplication with classifier score of respective class: Public=0.348, Private=0.305 Multiplication with class14 score only: Public=0.332, Private=0.305"
              - paragraph [ref=f50e255]: “Multiplication with classifier score of respective class” improved public LB by a lot, hence we used it in a final submission. Unfortunately, the improvement does not generalize to the private LB. We are lucky that our rank remains without that improvement :D

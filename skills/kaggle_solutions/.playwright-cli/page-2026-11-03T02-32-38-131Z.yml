            - heading "[2nd] place solution (for the C in MYRCJ)" [level=3] [ref=f31e196]
            - generic [ref=f31e199]:
              - paragraph [ref=f31e200]: Thank you everyone for a great competition, and I am very happy to reach the 2nd place in my first Kaggle competition together with a great team!
              - paragraph [ref=f31e201]: I will provide an overview of my original solution and some code which was then incorporated into the MYRCJ team submission. The main parts of my work used in the final team submission were the prediction of relative position and the postprocessing strategy.
              - paragraph [ref=f31e202]:
                - strong [ref=f31e203]: 1. Absolute position and floor estimation
                - text: "In this part I trained a single custom NN (one for each building with identical settings) for floor estimation and positioning where each one is split in two MLPs, one for positioning and one for floor classification. The input is a single measurement of RSSI, and the models are trained by using augmentations and other common NN techniques. It was trained on improved positions for RSSI measurements by interpolating between waypoints. The team had at least three independent identical floor classification results, of which mine was one. My floor prediction MLP is based on ordinal regression similar to what is proposed here:"
                - link "https://www.ethanrosenthal.com/2018/12/06/spacecutter-ordinal-regression/ (opens in a new tab)" [ref=f31e204] [cursor=pointer]:
                  - /url: https://www.ethanrosenthal.com/2018/12/06/spacecutter-ordinal-regression/
                  - text: https://www.ethanrosenthal.com/2018/12/06/spacecutter-ordinal-regression/
                - text: . A single positioning MLP with this approach resulted in public LB 6.71 and CV 7.84.
              - paragraph [ref=f31e205]:
                - strong [ref=f31e206]: 2. Delta position estimation
                - text: For this task I implemented a many-to-one LSTM which by using a sliding window on IMU sequences of arbitrary length predicts the displacement between two waypoints. The input used was the orientation (3d array based on TYPE_ROTATION_VECTOR) and accelerometer. I have uploaded a general model definition and training function in
                - link "https://github.com/ckjellson/MTO_SW_LSTM (opens in a new tab)" [ref=f31e207] [cursor=pointer]:
                  - /url: https://github.com/ckjellson/MTO_SW_LSTM
                  - text: https://github.com/ckjellson/MTO_SW_LSTM
                - text: . A single version of this model resulted in a mean delta positioning error of 1.83 m on tracks in our validation dataset for which the PDR code results in a mean error of 2.55 m.
              - paragraph [ref=f31e208]:
                - strong [ref=f31e209]: 3. Postprocessing
                - text: My postprocessing was based on iterating between moving points into the corridor geometry and cost minimization. This was originally done for 50 iterations, and after this using the snap-to-grid once to get the final result.
              - paragraph [ref=f31e210]:
                - text: These three steps resulted in my original public LB 3.256, but some steps were improved later for use in the team ensemble.
                - link "@mamasinkgs (opens in a new tab)" [ref=f31e211] [cursor=pointer]:
                  - /url: /mamasinkgs
                  - text: "@mamasinkgs"
                - text: will publish the complete approach.
              - paragraph [ref=f31e212]:
                - text: "Thanks for great kernels:"

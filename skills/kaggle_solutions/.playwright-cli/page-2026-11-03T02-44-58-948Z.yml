            - heading "3rd place Dieter part" [level=3] [ref=f48e196]
            - generic [ref=f48e199]:
              - paragraph [ref=f48e200]:
                - text: Thanks to Kaggle and hosts for this very interesting competition with a tricky setup. Also huge props to my team mates
                - link "@zfturbo (opens in a new tab)" [ref=f48e201] [cursor=pointer]:
                  - /url: /zfturbo
                  - text: "@zfturbo"
                - text: and
                - link "@mpware (opens in a new tab)" [ref=f48e202] [cursor=pointer]:
                  - /url: /mpware
                  - text: "@mpware"
                - text: who carried me to 3rd place. Since we worked quite independently on the models we thought it helps readability to split the work in 3 posts. In the following, I want to give a rough overview of my part of our solution.
              - heading "TLDR" [level=3] [ref=f48e203]
              - paragraph [ref=f48e204]: I did an ensemble of several ideas to tackle the weak label problem. The first model type works on cropped single cells which are weighted using trainable attention to derive a bag-of-cell prediction on which the loss wrt to the weak image label is calculated. The second model type is on image level. Here cell masks derived using HPA Cell segmentor are used to extract local features and derive a single cell feature vector. All single cell feature vectors are weighted to derive with an image level label. The third model type is an image level model which does not account for single cells, but helps the overall prediction ranking.
              - heading "Data setup & CV" [level=3] [ref=f48e205]
              - paragraph [ref=f48e206]: I settled early on the hyperparameters for the HPA cell segmenter, which I slightly modified to run faster. I generated masks for all images and used those and fixed single cell ids through the competition. For cross-validation I identified clusters of similar/ duplicate images and used GroupKfold to create a robust validation scheme. I used Public HPA data and images from the first HPA competition, which were not included here.
              - heading "Models" [level=3] [ref=f48e207]
              - heading "Single Cell Model" [level=4] [ref=f48e208]
              - paragraph [ref=f48e209]:
                - text: I tried different ways how to create a bag-of-cell model to leverage the weak labels. The following worked very well and is quite similar to
                - link "@wowfattie (opens in a new tab)" [ref=f48e210] [cursor=pointer]:
                  - /url: /wowfattie
                  - text: "@wowfattie"
                - text: "solution:"
              - list [ref=f48e211]:
                - listitem [ref=f48e212]: Use HPA Cell Segmenter to crop single cells
                - listitem [ref=f48e213]: Feed batches x n_cells into the model
                - listitem [ref=f48e214]: Use attention pooling to train weighting of cells within a bag and derive bag-prediction
                - listitem [ref=f48e215]: BCE loss between image label and bag-predictiction
              - paragraph [ref=f48e216]: "The following gives a brief illustration (e.g. bs =1):"
              - paragraph [ref=f48e217]:
                - img "model1"
              - paragraph [ref=f48e218]: I want to note that the single cell model turned out to be especially robust on private LB as it can better handle high SCV.
              - heading "Image model with aggregated local features" [level=4] [ref=f48e219]
              - paragraph [ref=f48e220]: The second architecture uses the complete image but selects local features using a previously generated cell mask
              - paragraph [ref=f48e221]: Cell mask is resized to 16x16 to map local feature vectors of backbone output (which has size (bs,1024,16,16)) to single cells and hence create an embedding vector for each cell. I weight the embedding vectors using trainable attention to derive the image level label.
              - paragraph [ref=f48e222]:
                - img "model2"
              - paragraph [ref=f48e223]: I used backbones SE-ResNeXt26 and SE-ResNeXt101 from timm repository for these 2 model types.
              - paragraph [ref=f48e224]: The third model is an efficientnet-b7 trained on image level and predicts the same label for each cell within an image.
              - heading "Compressing into one" [level=4] [ref=f48e225]
              - paragraph [ref=f48e226]: I want to note that by generating single cell out-of-fold predictions using this ensemble and training a single cell model with that results in a good but lightweight single model (Public LB 0.524)
              - paragraph [ref=f48e227]: Thanks for reading. Happy to answer any questions.
          - separator [ref=f48e228]
